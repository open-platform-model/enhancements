slug: kubernetes-first-class-kernel-platform
title: Kubernetes as a First-Class Kernel Platform
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  Move the Kubernetes runtime surface into the kernel so the deletion protocol, ownership guards and resource ordering have one implementation instead of a fork per frontend.
status: draft
# Primary owner: the kernel. The deletion protocol, the ownership vocabulary,
# and the K8s object model all land in library/opm/; the frontends adopt.
area: library
