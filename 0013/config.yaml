id: "0013"
slug: secret-field-attributes
title: Attribute-Declared Secret Fields
status: accepted

# major: core removes published definitions ($opm vocabulary, the discovery
# pyramid, #SecretK8sRef, #SecretSchema and friends) and narrows #Secret to
# the two-arm disjunction; catalog_opm narrows #SecretSchema.data to string.
# Both are breaking for any consumer of the current shapes.
semver: major

# Primary owner is nobody in particular, which is why this is cross-cutting:
# core loses a dead construct and gains one context field, library gains the
# whole mechanism, catalog_opm loses a duplicated one, and the module authoring
# surface changes. No single repo dominates.
area: cross-cutting

# Every repo that ships code/schema/content changes driven by this enhancement.
affects:
  - cross-cutting
  - core
  - library
  - catalog
  - modules
  - cli
  - opm-operator
  - opmodel.dev

