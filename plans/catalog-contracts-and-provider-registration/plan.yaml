# Structured slice plan for enhancement 0015. Narrative rationale lives in
# 06-operational.md ## Cross-Repo Coordination; this file is the structured
# backing data (task vet, task plan:graph, task plan:ready, task slice:seed).
#
# Every implementation slice extends 0019's single-build pipeline; the three
# cross-enhancement dependencies below are the structural form of
# 06-operational.md's "this entry cannot ship ahead of those slices".
slices:
  - id: core-contract-maps
    repo: core
    phase: implementation
    concern: >
      #Catalog gains #resources/#traits/#blueprints beside #transformers,
      each stamping modulePath and catalogVersion; SPEC.md §3.6 co-update
      under the core-schema-edit protocol.
    depends_on: []
    decisions: [D1]
    status: planned

  - id: core-inventory-routing
    repo: core
    phase: implementation
    concern: >
      The contract-inventory fold and the #ContractRouting assertion derived
      on #Platform beside #composedTransformers (unfulfilled/overSubscribed
      reports, D37's exactly-one kept); SPEC.md §3.4 and §4.1 co-updates.
    depends_on:
      - core-contract-maps
      - "0019:core-registry-import"
    decisions: [D1, D2]
    status: planned

  - id: library-assembly-checks
    repo: library
    phase: implementation
    concern: >
      The duplicate guard at platform-package generation (detection per
      OQ9's deferral), the unimplemented-vs-unknown missed-demand split,
      and the one-registration-per-module refusal.
    depends_on:
      - core-inventory-routing
      - "0019:library-match-in-build"
    decisions: [D5, D15]
    status: planned

  - id: catalog-contract-members
    repo: catalog
    phase: implementation
    concern: >
      catalog_opm lists its resources, traits and blueprints in the new
      member maps; values already exist and are imported by the transformers
      that demand them.
    depends_on:
      - core-contract-maps
    decisions: [D1]
    status: planned

  - id: catalog-registration-surface
    repo: catalog
    phase: implementation
    concern: >
      The transformer-registration #Resource contract and its rendering
      transformer in catalog_opm: pre-bound spec derivation, stamped
      providerRef, instance-derived CR name.
    depends_on:
      - catalog-contract-members
      - core-inventory-routing
    decisions: [D9, D11, D12]
    status: planned

  - id: operator-registration
    repo: opm-operator
    phase: implementation
    concern: >
      TransformerRegistration CRD and the acceptance battery (artifact
      gate, provides equality, build compatibility, already-provided),
      readiness exclusion, finalizer, Platform.status.registry.
    depends_on:
      - core-inventory-routing
      - "0019:opm-operator-platform-generation"
    decisions: [D2, D3, D8, D10, D11, D14]
    status: planned

  - id: operator-regeneration
    repo: opm-operator
    phase: implementation
    concern: >
      Edge-triggered, level-computed platform-package regeneration from the
      (Platform spec, active claims) tuple, stamped with the
      generation-plus-active-claims identity.
    depends_on:
      - operator-registration
    decisions: [D13]
    status: planned

  - id: cli-platform-pull-check
    repo: cli
    phase: implementation
    concern: >
      opm platform pull (fetch the operator-generated platform package as a
      build-local module) and opm platform check (unfulfilled and
      over-subscribed contract pre-flight).
    depends_on:
      - core-inventory-routing
      - operator-regeneration
    decisions: [D6]
    status: planned

  - id: provider-e2e
    repo: catalog
    phase: migration
    concern: >
      End-to-end proof on a cluster: a real provider catalog and module ship
      the k8up path from 01-problem.md, including health-gated activation,
      a second registration refused at acceptance, and blocked deletion
      while instances depend on it.
    depends_on:
      - library-assembly-checks
      - catalog-registration-surface
      - operator-regeneration
      - cli-platform-pull-check
    decisions: [D3]
    status: planned

# Decisions deliberately implemented in no slice.
unsliced:
  D4: "Decides against building a packaging split — no code anywhere."
  D7: "Records that no transformer-predicate stability rule ships; the widening gate is deferred to the 0011 publish-gate family."
