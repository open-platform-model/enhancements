# Structured slice plan for enhancement 0019. Narrative rationale lives in
# 06-operational.md ## Cross-Repo Coordination; this file is the structured
# backing data (task vet, task plan:graph, task plan:ready, task slice:seed).
#
# The entry's two phases (A: parity on the current path; B: the single-build
# collapse) are BOTH `implementation` in this file's phase vocabulary — nothing
# here republishes artifacts. The A/B split is carried by the dependency
# graph: no library-parity-* / library-*-fill / library-finalize-removal slice
# depends on anything in Phase B, which is the structural guarantee
# the entry's delivery criteria gate on.
title: "Kernel render path parity with pure CUE"
implements: ["0019"]
slices:
  # ── Phase A: parity on the current path (library-local) ──────────
  - id: library-parity-harness
    repo: library
    phase: implementation
    concern: >
      Differential parity harness comparing kernel render output against
      pure-CUE unification of the same three inputs; lands first, its first
      failure on the definition strip is D1's evidence.
    depends_on: []
    decisions: [0019:D1]
    status: planned

  - id: library-component-fill
    repo: library
    phase: implementation
    concern: >
      Fill #transform.#component from the unstripped value and repair
      TestFlow_WebApp_OnOpmPlatform's severed instance construction in the
      same slice; sweep cli and opm-operator for the same construction shape.
    depends_on:
      - library-parity-harness
    decisions: [0019:D1]
    status: planned

  - id: library-moduleinstance-fill
    repo: library
    phase: implementation
    concern: >
      Fill #transform.#moduleInstance for the first time, with plain-read and
      self-referential tests; closes open-platform-model/library#65.
    depends_on:
      - library-component-fill
    decisions: [0019:D3]
    status: planned

  - id: library-finalize-removal
    repo: library
    phase: implementation
    concern: >
      Remove FinalizeValue from the render path, then from the public kernel
      surface (MAJOR, MIGRATIONS.md entry), shipping the D14 env-ordering
      migration note and the security-audit skill rewrite with it.
    depends_on:
      - library-component-fill
      - library-moduleinstance-fill
    decisions: [0019:D1, 0019:D14]
    status: planned

  - id: core-resourcename-default
    repo: core
    phase: implementation
    concern: >
      Flip metadata.resourceName's default to the instance-qualified form
      with a hidden assertion for a legible overlong refusal; SPEC.md
      co-update under core-schema-edit. Output-neutral for rendered
      fleets; lands before the sweep.
    depends_on: []
    decisions: [0019:D16]
    status: planned

  - id: catalog-names-readonly
    repo: catalog
    phase: implementation
    concern: >
      Sweep all 50 transformers to read #component.#names for the primary
      object name under D15's carve-outs; delete #ResourceNameTrait and
      #WorkloadName; bump the core dep. Gate: byte-identical goldens.
      Absorbs catalog_opm#44 and core#49.
    depends_on:
      - library-component-fill
      - core-resourcename-default
    decisions: [0019:D15]
    status: planned

  - id: modules-fleet-rename
    repo: modules
    phase: implementation
    concern: >
      Revalidate the v2 staging fleet under instance-qualified naming: set
      explicit metadata.resourceName where a name is an external contract,
      drop the deleted trait, record residual renames. Alpha stance: no
      deprecation cycle.
    depends_on:
      - catalog-names-readonly
    decisions: [0019:D15, 0019:D16]
    status: planned

  # ── Interim operator stopgap (independent of both phases) ────────
  - id: opm-operator-render-serialization
    repo: opm-operator
    phase: implementation
    concern: >
      Serialise shared-Kernel access across the operator's controllers
      behind one mutex until D8 lands: one kernel.Kernel is shared by
      controller goroutines against library's one-per-goroutine rule;
      measured 2.5x-5.5x throughput cost accepted.
    depends_on: []
    decisions: [0019:D8]
    status: planned

  # ── Phase B: the single-build collapse (cross-repo) ──────────────
  - id: core-registry-import
    repo: core
    phase: implementation
    concern: >
      D5 registry reshape: #CatalogEntry replaces #Subscription with
      {enable, #catalog}; version and #transformers derived, key bound to
      modulePath; #composedTransformers derived, #matchers removed (D17);
      SPEC.md co-update.
    depends_on: []
    decisions: [0019:D5, 0019:D17]
    status: planned

  - id: core-context-projection
    repo: core
    phase: implementation
    concern: >
      D12: #TransformerContext fields except #runtimeName become projections
      of the other two inputs; SPEC.md co-update under core-schema-edit.
      Staged behind the parity harness; kernel then fills #runtimeName
      alone, context.go mirror deleted.
    depends_on:
      - library-parity-harness
      - library-moduleinstance-fill
    decisions: [0019:D12]
    status: planned

  - id: library-render-build
    repo: library
    phase: implementation
    concern: >
      The render-build assembler: stage instance + platform into a generated
      render module under D13's promotion invariant, build once, read
      rendered and diagnostics; parity-harness-proven before the old path is
      deleted.
    depends_on:
      - library-finalize-removal
      - library-parity-harness
      - core-registry-import
      - core-context-projection
    decisions: [0019:D9, 0019:D13]
    status: planned

  - id: library-match-in-build
    repo: library
    phase: implementation
    concern: >
      Matching moves into the render build with verdicts as data per
      experiment 05's glue; gated on reproducing the kernel's exact pair
      set; deletes excludeProvenance and the D30 denylist; owns the reverse
      index now that core carries none (D17).
    depends_on:
      - library-render-build
    decisions: [0019:D2, 0019:D10, 0019:D17]
    status: planned

  - id: library-skew-policy
    repo: library
    phase: implementation
    concern: >
      Kernel-side module-versus-platform skew detection with caller-supplied
      response (warn-and-render or refuse), returned as structured
      diagnostics, never library-emitted output.
    depends_on:
      - library-render-build
    decisions: [0019:D7, 0019:D18]
    status: planned

  - id: library-adr002-supersession
    repo: library
    phase: implementation
    concern: >
      ADR-002 gains its superseded-by header; a new ADR records the
      shares-nothing and cue.Context lifetime rules; ADR-003's federation
      rationale is retired in place; opm/materialize shrinks or is deleted.
    depends_on:
      - library-render-build
      - library-match-in-build
    decisions: [0019:D8]
    status: planned

  - id: opm-operator-store-removal
    repo: opm-operator
    phase: implementation
    concern: >
      Remove internal/platform/store.go's single held platform slot and the
      render serialisation stopgap; renders become self-contained
      shares-nothing units sized by memory.
    depends_on:
      - library-adr002-supersession
      - opm-operator-render-serialization
    decisions: [0019:D8]
    status: planned

  - id: opm-operator-platform-generation
    repo: opm-operator
    phase: implementation
    concern: >
      The operator generates the #Platform CUE package its CR describes
      (typed fields stay on the CR), with a named extension point where
      enhancement 0015's effective transformer set folds in.
    depends_on:
      - core-registry-import
    decisions: [0019:D6]
    status: planned

  - id: cli-skew-surface
    repo: cli
    phase: implementation
    concern: >
      Expose D7's skew policy on the instance/module build command surface
      (kernel default per D18: warn-and-render; refuse opt-in).
    depends_on:
      - library-skew-policy
    decisions: [0019:D7, 0019:D18]
    status: planned

  - id: opm-operator-skew-surface
    repo: opm-operator
    phase: implementation
    concern: >
      Expose D7's skew policy on the operator surface (Platform CR field or
      controller option); refuse is the admission-time strictness opt-in
      over the kernel's warn-and-render default (D18).
    depends_on:
      - library-skew-policy
    decisions: [0019:D7, 0019:D18]
    status: planned

unsliced:
  "0019:D4": >
    The slicing decision itself — implemented by this plan's own ordering
    and dependency graph rather than by any single slice.
  "0019:D11": >
    An authoring contract, never structurally enforced: sibling access
    through #moduleInstance stays reachable and is discouraged by catalog
    review; the catalog-names-readonly sweep keeps the first-party
    transformers exemplary, and no code change carries it.
