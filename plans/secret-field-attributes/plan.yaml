# Slice plan for 0013 — Attribute-Declared Secret Fields.
# Structured landing order; narrative rationale in 06-operational.md
# ## Cross-Repo Coordination. The seam to respect: everything consumes the
# core alpha first; metallb is the only slice that touches a live cluster.

title: "Attribute-Declared Secret Fields"
implements: ["0013"]
slices:
  - id: core-secret-narrowing
    repo: core
    phase: implementation
    concern: >-
      Narrow #Secret to the two-arm disjunction, delete the dead secret
      machinery, correct SPEC.md §1, regenerate INDEX; publishes the core v2
      alpha every other slice consumes. Load core-schema-edit first.
    depends_on: []
    decisions: [0013:D7, 0013:D9, 0013:D10, 0013:D12]
    status: planned

  - id: library-secret-pass
    repo: library
    phase: implementation
    concern: >-
      New opm/secret (Discover, Resolve) wired before the component build:
      fail-closed discovery, resolve-in-place via decode-splice-encode, one
      graph build, synthesized secrets component with platform-supplied FQN,
      .value diagnostic in compile.
    depends_on: [core-secret-narrowing]
    decisions: [0013:D2, 0013:D3, 0013:D5, 0013:D6, 0013:D8, 0013:D11, 0013:D13, 0013:D16, 0013:D17]
    status: planned

  - id: catalog-consumption-rewire
    repo: catalog
    phase: implementation
    concern: >-
      Import core's #Secret, delete the duplicated contract and discovery
      pyramid, rewrite both consumption sites to read .ref/.key, strip all
      name computation from secret_transformer.
    depends_on: [core-secret-narrowing]
    decisions: [0013:D9, 0013:D12]
    status: planned

  - id: cli-secrets-surface
    repo: cli
    phase: implementation
    concern: >-
      Inspect secrets section, opm secrets template, SOPS values-file decrypt,
      secrets-aware vet messaging; port the secrets-module fixture and retire
      the superseded auto-secrets-injection spec.
    depends_on: [library-secret-pass, catalog-consumption-rewire]
    decisions: [0013:D14]
    status: planned

  - id: operator-library-bump
    repo: opm-operator
    phase: implementation
    concern: >-
      Bump to the secret-pass library; document the supplied-arm
      plaintext-in-CR posture with the referenced arm as production guidance
      (no valuesFrom mechanism).
    depends_on: [library-secret-pass]
    decisions: [0013:D15]
    status: planned

  - id: docs-secrets-authoring
    repo: opmodel.dev
    phase: implementation
    concern: >-
      Author the first secrets docs (public docs deliberately carry none
      until this lands): routing/fulfilment split, the two arms, no plaintext
      in renders, materialisation as a platform choice, SOPS workflow.
      Regenerate the schema reference.
    depends_on: [core-secret-narrowing, cli-secrets-surface]
    status: planned

  - id: modules-metallb-migration
    repo: modules
    phase: migration
    concern: >-
      Migrate metallb to the attribute form: drop the spec.secrets map, move
      RBAC resourceNames to the new object name, re-render and diff against
      the live cluster (values unchanged); rewrite DESIGN_PATTERNS' secret
      section.
    depends_on: [core-secret-narrowing, library-secret-pass, catalog-consumption-rewire]
    status: planned

unsliced:
  "0013:D1": Superseded by D10 the day it was written; retained position only — no work to carry.
  "0013:D4": Superseded by D11 the day it was written; retained position only — no work to carry.
