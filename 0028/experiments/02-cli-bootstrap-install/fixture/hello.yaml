# Operator-owned fixture instance. Adapted from
# opm-operator/test/fixtures/modules/hello/moduleinstance.yaml (f568db6):
# version v0.0.11 (the newest in the local registry), no per-instance applier
# SA (the dev applier grant in dev-applier-rbac.yaml covers configmaps).
apiVersion: opmodel.dev/v1alpha1
kind: ModuleInstance
metadata:
  name: hello
  namespace: default
spec:
  owner: operator
  module:
    path: testing.opmodel.dev/modules/operator/hello@v0
    version: v0.0.11
  values:
    message: "hello from ModuleInstance CR"
  prune: true
