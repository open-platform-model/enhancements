id: "0003"
slug: module-publishing
title: OPM Module Publishing Workflow
status: superseded
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: cli
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
affects:
  - cli
  - library
  - core
  # Added 2026-07-26 (D13). No operator feature code changes — it already reads
  # only spec.module.{path,version} and never metadata.version — but the identity
  # migration does: prune.go skips deletes whose live uuid label disagrees with
  # Status.InstanceUUID, so relabelling live instances needs an adoption path.
  - opm-operator
