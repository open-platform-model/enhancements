    event: "@embed ruled out (user decision). It was OQ18 option (b) — deriving #Module.metadata.modulePath in CUE from the module's own cue.mod/module.cue via @extern(embed) plus regexp — and it is withdrawn regardless of the measurements that supported it (verified working, survives publishing since cue.mod/module.cue ships inside the artifact zip, but constrained to the module root because @embed cannot escape its own directory). OQ18's live options are now (a) modulePath AUTHORED in module source per D16, one line duplicated with cue.mod and checked at publish and acquire, keeping artifact bytes equal to source bytes and leaving the committed tree independently evaluable by plain cue vet; or (c) GENERATED AT PUBLISH into a gitignored identity package existing only in the artifact, which is what experiment 05 implements — removing the hand-maintained duplication entirely at the cost of artifact bytes differing from source and a fresh clone not vetting until an opm command has generated the package."
  - date: "2026-07-26"
    event: "D21, D22, D23 from the experiment-05 review; OQ18 resolved, OQ19 opened. D21 takes READING B: #Catalog.metadata declares NO version field; the catalog's full SemVer lives only in its generated identity package and each primitive reads id.Version directly for its own metadata.version, which is where the D19 compatibility signal actually needs to be since that is what a module inherits. #Catalog's pattern constraint therefore stamps modulePath onto #transformers but not version. This supersedes D19's implication that the field sits on the catalog root while leaving D19's substance intact. Reading A rejected because the stamping exists only to propagate a value the primitives can already read from the same identity package — machinery without a job, and a second place a catalog's version appears in the schema. D22 answers 'how does the built-against catalog version get recorded' with: IT ALREADY IS. A module's cue.mod/module.cue deps block records the exact catalog version resolved at build time — verified, modules/jellyfin/cue.mod/module.cue carries deps: \"opmodel.dev/catalogs/opm@v1\": {v: \"v1.0.0-alpha.1\"} — and that file ships INSIDE the published artifact (confirmed by unzipping jellyfin@v2 tag v2.0.2), and the registry loader already stages it, LoadModulePackageWithSource documenting that the module's own cue.mod drives transitive resolution. So publish records nothing new; it guarantees the file is intact, and the kernel reads it back at materialize. Generating a separate record was rejected as redundant AND less trustworthy, since a generated copy can drift from the deps that actually resolved; recomputing at render was rejected as the exact failure experiment 05 exhibits, where the value tracks the platform's catalog rather than the module's so the floor compares a value against itself and can never fail. The requirement is not to RECORD the value but to STOP DISCARDING it. D23 resolves OQ18 to (c): modulePath is GENERATED by OPM tooling from the artifact's own cue.mod/module.cue `module:` line for BOTH #Module and #Catalog, never hand-written, superseding D16's authored-path half while keeping D16's substance. Accepted consequence, chosen rather than discovered: the committed tree is NOT independently evaluable by plain cue vet, since the generated identity is absent until an opm command produces it. @embed remains ruled out. NEW OPEN QUESTION OQ19 (mechanism, deliberately not fixed by D23): the proposal was an identity/ subpackage plus a `metadata: modulePath: id.ModulePath` binding made 'part of the schema so the author doesn't have to write it' — but THAT BINDING CANNOT LIVE IN core, because #Module and #Catalog are defined in opmodel.dev/core which cannot import a consumer's identity package (it does not know the consumer's path, and CUE has no construct for importing relative to whoever is unifying you). Two ways to keep the author-writes-nothing property: (i) generate a file in the artifact's OWN package setting metadata.modulePath directly — no subpackage, no import, works for #Module immediately; (ii) keep identity/ and also generate the binding into the root package. For #Catalog the subpackage is not optional regardless, since experiment 03 measured that removing it yields `package import cycle not allowed` and the leaves need the constant at their own definition site to compute their FQNs — so the likely shape is asymmetric, modules taking (i) and catalogs keeping identity/ plus a generated root binding."
  - date: "2026-07-26"
    event: "D24, D25, D26 from the experiment-05 review round; OQ17 and OQ19 resolved, OQ20 opened. D24 supersedes D20's SPELLING while keeping its reasoning: the dev-build version is the latest published tag in the artifact's MAJOR, PATCH-BUMPED, with -dev appended (latest 1.2.3 -> 1.2.4-dev), because a dev build is by construction AHEAD of every release and must sort that way. vMAJOR.0.0-dev sorted below everything, so a dev catalog failed D19's floor for any module built against a real release — breaking the dev loop precisely when someone is developing the catalog. Verified in experiment 05: built-against 1.2.3 against platform 1.2.4-dev satisfies the floor. STILL TO SPECIFY: the query needs the registry, so a local build acquires a network dependency and needs an offline path that must NOT fall back to a low-sorting value. D25 resolves OQ19 asymmetrically, and the asymmetry follows from package topology rather than preference: #Module gets ONE generated file in its OWN package (gen_identity.cue) setting metadata.modulePath directly — single-package, no cycle, no import, nothing authored; #Catalog gets TWO — identity/identity.cue supplying ModulePath and Version to the resources/ and transformers/ leaves, which read it at their own definition sites to compute their own FQNs and which the root cannot supply without the import cycle experiment 03 measured, PLUS a root gen_identity.cue binding metadata.modulePath so a catalog author writes no more than a module author. The binding cannot live in core because #Module and #Catalog are defined in opmodel.dev/core, which cannot import a consumer's package and CUE has no construct for importing relative to whoever is unifying you. Recorded from the user's direct edits to experiment 05's mod/module.cue and cat/catalog.cue. D26: metadata.name is authored in SNAKE_CASE rather than kebab, the path leaf equals name directly with no projection between, and the rest of the path stays whatever CUE accepts. CONSEQUENCE: nameSnakeCase and #KebabToSnake are REMOVED from core — they exist solely to project kebab onto snake, and with name already snake there is no projection left; D1's 'one identity, one canonical projection' collapses to 'one identity'. This deletes surface THIS ENHANCEMENT ITSELF ADDED, nameSnakeCase having landed in core on 2026-06-17 as D2, recorded plainly rather than quietly dropped. Rejected: narrowing #ModulePathType to snake_case throughout, on evidence — CUE accepts hyphens in path segments (verified, github.com/open-platform-model/my-thing@v1 evaluates and cue mod tidies clean), path segments are not CUE identifiers, and narrowing would make OPM unable to express its own GitHub org; only the LEAF needs to be an identifier because only the leaf is also the package name. Migration: every hyphenated module name is renamed (web-app -> web_app, zot-registry-ttl -> zot_registry_ttl), user-visible via the module.opmodel.dev/name label, and underscores are legal in Kubernetes label values. NEW OPEN QUESTION OQ20: does #Catalog gain a `name` field? It has NONE today — catalog identity is modulePath alone, which is why the addressing half was always degenerate for catalogs — so applying D26 there means ADDING a field whose only sensible value is the path leaf. For: symmetry, a leaf constraint catalogs lack, a readable name for diagnostics. Against: nothing consumes a catalog name, since catalog FQNs carry no name segment and the matcher keys off primitive FQNs, and a field with no reader is what D13 has been deleting; the catalog leaf is also not a CUE package name the way a module's is, so the snake_case argument does not transfer directly. Experiment 05 updated throughout and re-run: all three identity/match-key invariants still PASS and cue vet ./... is clean."
  - date: "2026-07-26"
    event: "Experiment 06-identity-supply-mechanisms authored and CONCLUDED, and D27 recorded on its result. The experiment compares three ways to put identity into an artifact, each with a cat package imported by a mod package so every variant exercises a real transitive import: (A) @tag() with a default, committed and visible; (B) committed concrete value plus an inert @opm(identity, owner=publish) marker; (C) committed marker only, value from a sibling generated file. HYPOTHESIS HELD — identity must be present in the artifact's OWN COMMITTED BYTES, because CUE's dependency resolution is what carries it to consumers and OPM does not mediate that. FINDING 1 CORRECTS A PREDICTION MADE IN DISCUSSION: the anticipated @tag failure was a COLLISION, two artifacts declaring @tag(modulePath) both receiving one injected string. That does not happen. Injection does not propagate into an imported package AT ALL — `cue eval ./a_tag/mod -t modulePath=example.com/real-module@v2` sets the module's own value and leaves the imported catalog reading example.com/UNSET-CATALOG@v1, identical to the uninjected run. The real failure is quieter and worse: the transitive dependency keeps its placeholder, every FQN it derives is built from UNSET, and nothing reports that an injection was ignored. Since a module always reaches its catalog through CUE's own resolution, the kernel can never supply a catalog's identity this way however well it knows the coordinates — @tag is unusable as the value source. FINDING 2: a committed value resolves correctly through the import under plain cue eval with no flags and no OPM tooling, and cue vet -c passes. FINDING 3: @opm() attributes are inert — variant B evaluates and vets identically with or without them — and survive a cue def round-trip verbatim, so a marker attribute is viable for telling a reader a field is tool-owned and letting opm locate the fields it manages without hardcoding names; it carries no value and cannot substitute for one. FINDING 4: variant C works and fails legibly on a fresh clone (`ModulePath: incomplete value string`, `resourceFQN: non-concrete value string in operand to +`) rather than with a missing-field error — technically sound but motivationally wrong, since the value still lives in a file the developer never wrote and cannot see in git. D27 SUPERSEDES D25'S GITIGNORED GENERATION: identity.cue is COMMITTED AND VISIBLE, holds concrete values, carries @opm() markers on tool-owned fields, and OPM tooling WRITES INTO IT the way npm version writes package.json — the developer sees the file, sees the diff, and commits it. D25's structural placement survives unchanged (modules take a file in their own root package, needing no import since CUE has no relative intra-module imports; catalogs keep identity/ as the shared constant their leaves import). The stated driver is TRANSPARENCY rather than mechanics: a committed file is documentable, diffable, reviewable in a PR and greppable, and OPM does nothing behind the developer's back. D27 also RETIRES a cost D23 had accepted — with identity committed and concrete, a fresh clone vets with plain cue and no OPM tooling, which was the largest objection to the generation route. Experiment 05's README now carries a supersession banner: its structural demonstration still holds, but its .gitignore and 'do not commit' banners no longer reflect the design. NEW OPEN QUESTION OQ21, created by D27 meeting D24: a committed identity normally holds the LAST PUBLISHED version while D24 wants an unpublished build to carry latest-in-major+1patch-dev. Experiment 06 rules out the obvious escape — an in-memory override fails for exactly the reason @tag does, since a module importing a locally-replaced catalog resolves that catalog's committed bytes. Three options recorded: (a) rewrite identity.cue on every dev build, leaving the tree dirty after any opm module vet; (b) let the committed value stand, so a module built against a locally-extended catalog claims compatibility with a published version lacking the primitives it uses and the D19 floor passes while the FQN is missing — the diagnostic regression D19 exists to prevent; (c) write the dev version only via an explicit command the developer runs and commits or reverts, making the dirty tree chosen rather than incidental. (c) is closest to D27's own logic but leaves a forgetful developer in case (b)."
