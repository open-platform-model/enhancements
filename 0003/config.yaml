  - date: "2026-07-20"
    event: "Rescoped to cover version agreement, and refreshed against what enhancement 0006 landed in the meantime. D1's mapping is no longer a proposal — it shipped in 0006's C1 slice as cli/pkg/module/module.go CanonicalModuleRef, but in its weakest form: the consumer derives and nothing binds, with no publish enforcement and no library helper (implementation.status not-started -> partial). NEW SCOPE: metadata.version must equal the release tag of the artifact carrying it (D3). This was previously unaddressed and is the more dangerous half — the addressing drift fails loudly as 'module not found', whereas a stale version fails silently: the CLI deploys the artifact it fetched but records a different version in spec.module.version, so after a handoff the operator reconciles a DIFFERENT artifact indefinitely with Ready=True and every gate green. metadata.version is load-bearing in three places (fqn -> module.uuid -> instance.uuid -> the identity label on every rendered resource; spec.module.version; and synth/render.go:62's major() for the synthesized import), so none of them are sound while it may lie. Publishing today is raw `cue mod publish` with the tag read from a separate versions.yml in the modules repo — a third source of truth, and there is no `opm module publish` at all. NEW DECISIONS: D3 (version agreement, expressed in schemas/target.cue as #PublishedModuleRef, which unifies the derived depVersion with the artifact coordinates in hand so a mismatch is a type error — verified: a mismatched example yields `conflicting values \"v0.1.3\" and \"v0.2.0\"`); D4 (publish DERIVES coordinates from metadata, never STAMPS them into the artifact — stamping would make published bytes differ from source, breaking reproducibility and the local-vs-registry byte identity that 0006's render-parity D30 proves and the handoff digest gate rests on); D5 (closes OQ2 — a bare import binds, verified empirically via 0006 C2's fixture work rather than assumed); D6 (closes OQ5 — the invariant is enforced at ACQUIRE in library, not only at publish, because `cue mod publish` exists and every module published to date bypassed OPM tooling; placing the check on kernel.AcquireModuleFromRegistry means the CLI and operator inherit it from one implementation). This inverts 02-design's centre of gravity: publish-side derivation is the ergonomic half, acquire-side verification is the guarantee. NEW OPEN QUESTIONS: OQ6 (what a --version override means under D4 — assertion / rewrite-source-then-publish / tag-only, the last ruled out as reintroducing exactly the drift D3 removes) and OQ7 (whether #Catalog's identical exposure — version! with a *\"0.0.0-dev\" default, feeding catalog FQNs and therefore transformer matching — is specified here and implemented in 0001, or moves wholesale). EVIDENCE recorded in 01-problem.md: this enhancement's own target.cue always specified `depVersion: \"v\" + version`, yet the C1 implementation returned metadata.version verbatim; CUE rejects a bare version and the operator passes spec.module.version straight to the registry loader, so EVERY CLI-written ModuleInstance was unresolvable by the operator until 2026-07-20. It survived because the CLI never reads that field back, the operator was only tested against hand-written YAML fixtures, and the unit test asserted the bare form as expected — a mapping that is merely derivable-by-convention drifts from its implementations."
  - date: "2026-07-25"
    event: "Scope widened to catalog publishing, and the dev-time local-override surface pulled in. D7 resolves OQ7 by ruling that `opm catalog publish` ships HERE rather than in enhancement 0001: it is the module-publishing pipeline with a different artifact type (same derivation, same version-agreement check, same local-override gate), 0001 is already `implemented` so reopening it to add a CLI command inverts the lifecycle, and splitting one code path across two entries reproduces the derivable-but-unenforced drift this entry exists to remove. D3 and D6 therefore extend to `#Catalog` unchanged, closing the `*\"0.0.0-dev\"` default whose failure mode is an unattributed 'no matching transformer'. D8 governs `cue.mod/local-module.cue` at publish: replacements are never honoured (a local path is unresolvable for any consumer, and CUE strips the file at publish anyway), and their presence REFUSES the push unless an explicit allow flag is passed, with each replacement reported next to the registry version that will supersede it — D4's derive-never-stamp applied to the dependency graph rather than the version, and D6's reasoning that a check a publisher can walk past is worth nothing to a consumer. NEW OPEN QUESTION OQ8 (requires an experiment, not a judgement): `local-module.cue` is honoured only for the MAIN module, so the two-hop dev loop OPM wants — instance replaces module, module replaces catalog — silently drops the inner hop and resolves the local module against the published catalog. Three sub-checks recorded: whether an instance can hand-carry both entries (including a no-`v` dep that exists solely to be replaced), whether `cue mod tidy` preserves the transitive entry, and whether catalog materialization reaches replacements at all given `library/opm/materialize/enumerate.go` resolves subscriptions through the registry client independently of main-module load — if it does not, a local catalog checkout supplies a module's primitives while the registry supplies the transformers that render them, which is catalog-version skew by construction. `related` gains 0001 (catalog ownership boundary). Publish-command scope is now module + catalog; OQ1 and OQ6 remain open and now bind both."
  - date: "2026-07-25"
    event: "Catalog publishing fully absorbed, and the discussion residue recorded as decisions + open questions. 01-problem gains the catalog gap in its own shape: #Catalog has NO name field (metadata is modulePath + version, FQN is modulePath@version), so the addressing half is degenerate — registryPath IS modulePath — while the version half is ACUTE because version! carries a *\"0.0.0-dev\" DEFAULT and #Catalog's pattern constraint stamps metadata.version onto every #transformers entry, so a wrong catalog version invalidates the FQN of every transformer it ships and surfaces as an unattributed 'no matching transformer'. EVIDENCE (2026-07-25, workspace registry): opmodel.dev/catalogs/opm tagged v1.0.0-alpha.2 ships identity/identity.cue declaring `Version: #VersionType | *\"0.0.0-dev\"` plus a generated identity/version_override.cue supplying \"1.0.0-alpha.2\"; the v1.0.0-alpha tag likewise. So the catalog invariant holds today ONLY by a stamping generator living outside OPM tooling, with the placeholder default waiting underneath — D6's argument verbatim. 02-design gains steps 7-8, a module-vs-catalog difference table, and the catalog acquire point: catalogs are NOT fetched via AcquireModuleFromRegistry but through subscription resolution in library/opm/materialize, so that pull is where the decoded version is checked against the resolved tag (two artifact types, two fetch paths, one invariant). schemas/target.cue gains #CanonicalCatalogRef + #PublishedCatalogRef (verified: a mismatched pair yields `conflicting values \"v1.0.0-alpha.2\" and \"v1.1.0\"`), plus catalogFQN restating the non-v-prefixed form core computes. NEW DECISION D9: the central registry HOSTS rather than indexes, and module paths are owner-scoped as opmodel.dev/m/<owner>/<name> under reserved segments (m/ vs catalogs/ vs core) — index-only was rejected because CUE resolves paths to hosts through the CUE_REGISTRY prefix mapping with no per-domain autodiscovery, so a self-hosted path is unresolvable for every consumer who has not edited their own config first; flat-namespace was rejected as an unowned land grab. NEW OPEN QUESTIONS: OQ9 (fleet migration under D9 — universal, not exceptional: modulePath feeds fqn -> module.uuid -> instance.uuid -> the label on every rendered resource, so every module AND every live instance changes identity; supersedes OQ4's scope; also covers the testdata fixture and legacy v1alpha1 paths sharing the namespace), OQ10 (primitive modulePath is unrelated to its owning catalog's, so the catalog is NOT derivable from a primitive FQN and 'which catalog do I subscribe to for X?' is unanswerable — note core already stamps transformers' modulePath from the catalog but resources/traits reach a catalog only transitively via transformers' required/optional maps, so there is no site for the same constraint and this needs design), OQ11 (authentication — scope excluded it when this was a naming convention, but D9 makes the central registry a write target and the CLI has no credential surface at all), OQ12 (tag immutability + republish semantics — D3's tag-equals-version is meaningless if a tag can be overwritten under a pinned consumer, and 0006's handoff digest gate would compare against a moving target), OQ13 (catalog version source — keep the identity/version_override.cue stamping, which is OQ6 option (b) and D4-compatible only if the override is committed rather than generated into the artifact, or replace it; either way the 0.0.0-dev placeholder must be refused at publish and at materialize). README scope updated on both sides: D9 in, discovery and CLI platform-resolution modes explicitly out with pointers to the follow-on entry."
  - date: "2026-07-25"
    event: "Experiments 01-03 authored and concluded against OQ13 (catalog version source under D4); OQ13 open -> partial (informed-by-exp-01/02/03). Exp 01 (live registry, localhost:5000) measures the status-quo stamping flow end to end: a stamped catalog resolves to .../transformers/foo@0.0.0-dev from a local checkout and .../transformers/foo@1.0.0 from the registry, so local and published evaluation are GUARANTEED to disagree on the exact strings transformer matching keys off -- reachable via the sanctioned local-module.cue replaceWith dev workflow, invisible to cue vet on either tree, and missed by 0001 experiment 04 which measured only that stamping works. A committed concrete version has parity by construction. Exp 02 compares six version declarations and yields two corrections to the record, both independent of how OQ13 resolves: (a) core/src/catalog.cue:63's `version!: #VersionType | *\"0.0.0-dev\"` default is INERT -- a required field's disjunction default never applies, so core/SPEC.md:576 documents a mechanism that does not exist; the live default is identity.Version, a plain field; (b) 0001 05-risks' proposed CI guard rejecting 0.0.0-dev CANNOT be expressed in CUE -- a !=\"0.0.0-dev\" constraint deletes the default branch and leaves the value incomplete, firing during development, so the guard can only live in a bypassable publish task (the exact D6 gap). Also confirmed: removing the default costs nothing at vet time (strict and sentinel variants both vet clean, plain and -c), strict-and-omitted fails by name, and a version-free source tree is structurally dead (fqn interpolation cannot resolve). Exp 03 shows 0001's identity/ subpackage is load-bearing for import-graph topology alone -- removing it yields `package import cycle not allowed` -- so 0001 D7/D19 survive any reversal of its D8/D9. Evidence recorded in 01-problem.md and under OQ13; no decision taken. Still unrun: OQ8's local-module.cue multi-hop experiment."
  - date: "2026-07-25"
    event: "Experiment 04 (local-module-chain-hops) concluded against OQ8; OQ8 open -> informed-by-exp-04 (bullets 1+2 answered, bullet 3 still open). Three-link chain inst -> mod -> cat against a live registry, every artifact carrying an Origin marker and mod re-exporting the Origin of whichever cat it resolved. CONFIRMED: the inner hop is dropped -- replacing only mod yields modOrigin LOCAL-CHECKOUT with catOrigin REGISTRY, so a replaced dependency's own local-module.cue is silently ignored and the instance renders local module bytes against the PUBLISHED catalog, with nothing in the output naming the discarded replacement. Bullet 1: the chain CAN be reconstructed by hand from the outermost local-module.cue with one entry per hop, and this works whether the transitive dep is pinned or carries no version at all -- so a dep existing solely to be replaced needs no published version. Bullet 2: cue mod tidy PRESERVES the multi-entry file (reformats and alphabetises, prunes nothing), so generated chain-complete local-module.cue tooling is viable. Bullet 3 (does catalog materialization honour replaceWith at all) NOT answered -- kernel question needing a full render fixture; code-level prior recorded only: materialize/enumerate.go builds its own modconfig resolver and calls client.ModuleVersions to enumerate published versions independently of main-module load, and a local directory has no version list to enumerate. Practical consequence: putting a catalog replacement next to the module that depends on it silently does nothing; only the outermost local-module.cue is honoured. Also fixed OQ status phrasing on OQ4/OQ8/OQ10/OQ11 -- `Status: open -- ...` left the parser token as `open -- ...` rather than `open`, so four unresolved OQs were invisible to `task questions:open` (the feed the promotion gate and the OQ-walk skill consume); all 13 now classify (9 open, 2 partial, 3 resolved)."
