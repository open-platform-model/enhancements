  - date: "2026-07-26"
    event: "D15 + D16; OQ15 resolved. D15 narrows D14: the resolved-coordinate label is stamped ONCE in library's kernel on the render path both frontends traverse, rather than by cli and opm-operator separately. D14's parity requirement (all writers must emit an identical label, because 0006's render-parity work and handoff digest gate compare CLI- and operator-rendered output byte-for-byte) stops being a rule someone must remember and becomes a property of there being one implementation — D6's argument on a different surface. The kernel is also the only layer holding both halves at once: the resolved coordinate, from AcquireModuleFromRegistry's own parameters, and the resources being stamped. Rejected: per-frontend stamping (makes byte-identical output a coordination agreement between independently-released codebases, detected only by a digest gate failing after the fact and naming a digest rather than a label); stamping in apply rather than render (the label must exist in rendered output for dry-run, diff and digest, all of which precede apply). D16 resolves OQ15 by taking candidate (d): #Module.metadata.modulePath becomes the module's COMPLETE CUE module path including the major suffix (opmodel.dev/modules/jellyfin@v2) rather than the bare prefix, metadata.fqn IS that string, and uuid/instance.uuid keep their formulas with a version-free major-bearing input. Consequences: the major returns to identity and ONLY the major, so two majors are distinct identities exactly as CUE and Go treat them while patch/minor upgrades keep one identity and the prune guard keeps working; #ModulePathType gains an optional @vN suffix and #ModuleFQNType is retired or redefined; D1's address derivation MOSTLY DISSOLVES because the declared path already is the registry address, so cli/pkg/module/module.go:74's modulePath+leaf+major composition disappears along with majorVersionTag/ensureVPrefix's caller; D1's constraint becomes checkable INSIDE ONE FIELD rather than across two independently-authored ones; name/nameSnakeCase demote to display and package-name projections. Rejected: (i) an authored `major` field beside the bare modulePath (smallest change but adds a second identity fragment to keep in step with cue.mod while leaving D1's recombination intact — paying for the major without simplifying anything); (ii) self-deriving the major via @extern(embed) + regexp over the module's own cue.mod/module.cue (VERIFIED WORKING and verified to survive publishing since cue.mod/module.cue ships inside the artifact zip, but @embed resolves relative to the EMBEDDING file's module so core cannot do it on a consumer's behalf — every module would carry attribute-and-regex boilerplate — and it is untested through library's overlay load path where registry loads stage a synthetic module root); (a) modulePath/name with no version component (collapses two incompatible majors into one identity, the exact collision Go's path suffixes exist to prevent). schemas/target.cue REWRITTEN accordingly and vets clean: #CanonicalModuleRef no longer composes an address (importPath is modulePath verbatim; registryPath and major are split OUT of it rather than assembled into it) and gains leafMatchesName expressing D1 over one field; #PublishedModuleRef's VERSION half is retired as unrepresentable under D13 — artifactVersion is now recorded rather than checked, since nothing inside the module claims a version to check it against — while its ADDRESSING half survives. Both surviving constraints verified to fail on bad input: a wrong artifactPath yields `conflicting values \"...test/podinfo@v0\" and \"...other/podinfo@v0\"`, and a path leaf disagreeing with nameSnakeCase yields `leafMatchesName: conflicting values false and true`. 05-risks blast radius extended with D16's additional sites; D13 and D16 land in ONE window since both change #Module.metadata and both force the identity migration."
  - date: "2026-07-26"
    event: "D17 extends D13 + D16 to #Catalog, resolving OQ13 BY DELETION. #Catalog.metadata.version is removed along with its *\"0.0.0-dev\" default, metadata.modulePath carries the catalog's full CUE module path including the major (opmodel.dev/catalogs/opm@v1), and metadata.fqn is that path. The catalog case is bigger than the module case because #Catalog's pattern constraint (core/src/catalog.cue:70-76) stamps metadata.version onto every #transformers entry: with no catalog version, transformers inherit the catalog's MAJOR, so a transformer FQN becomes opmodel.dev/catalogs/opm/transformers/foo@v1 instead of .../foo@1.0.0-alpha.2, and the stamped modulePath must split the major OUT and re-append it because @v1 now sits mid-string. LARGEST OPERATIONAL WIN IN THIS ENTRY: catalog-version skew stops being routine. Today every catalog release changes the version embedded in every transformer FQN, so a module built against catalog@1.0.0-alpha.2 and a platform subscribed to catalog@1.1.0 share NO matcher keys and the symptom is `no matching transformer`, naming neither the catalog nor the version — already observed in the workspace (opm-operator e2e, fixtures at @v1-alpha against a platform range at @v0). Under D17 only a MAJOR bump changes the key space; patch and minor catalog releases become non-events for matching. WHAT D17 RETIRES: OQ13 itself (the question assumed the version should exist and asked only where to author it; D17 removes the premise), the identity/version_override.cue stamping generator across catalog_opm / catalog_kubernetes / catalog_opm_experimental, the transient-file-in-the-artifact practice, the 0.0.0-dev placeholder, and the version check D7 placed at library/opm/materialize. EXPERIMENTS RECLASSIFIED: 01 (local-vs-published parity) and 02 (six version declarations) become HISTORICAL — they are the evidence that produced D17, not open enquiry, and must not be re-run against the post-D17 schema where the measured value does not exist; a banner saying so is now at the top of experiments/README.md. Experiment 03 is UNAFFECTED and strengthened: it always argued the identity/ subpackage was load-bearing for import topology rather than stamping, and D17 removes the stamping while the subpackage remains necessary to supply ModulePath. INCIDENTAL FINDING: core/src/types.cue:22-24 declares #MajorVersionType with the doc comment 'major version prefix used in primitive FQNs' and NOTHING USES IT — a type written for a design never wired up; D17 is that design. Alternatives rejected: keeping the catalog version and fixing it by other means, i.e. experiment 02 variant B's committed concrete version (the right answer to the question as posed, but the question was whether the version should be declared WELL rather than whether it should EXIST, and keeping one artifact type version-bearing while the other is not leaves two conventions where D7 exists to have one); removing the catalog version but letting each transformer declare its own (breaks 0001 D18 lockstep, turns one catalog-level fact into N author-maintained ones, reintroduces per-primitive drift inside a single artifact); dropping versions from primitive FQNs entirely (noted as the logical endpoint, deferred to OQ16). NEW OPEN QUESTION OQ16: do #Resource, #Trait and #Blueprint follow to major-keyed FQNs? They are NOT stamped by #Catalog — they are reached transitively through each transformer's required/optional maps — so they keep authored version! and @semver FQNs, leaving the primitive FQN space internally inconsistent (transformers @v1, resources @1.4.0, both matched through one #FQNType). Three ways out recorded, and it interacts directly with OQ10 since catalog-stamped primitive identity would answer both at once. schemas/target.cue rewritten and vets clean: #CanonicalCatalogRef loses `version`, splits registryPath/major OUT of modulePath, and gains transformerPrefix + transformerFQN; #PublishedCatalogRef's version half retired as unrepresentable; _transformerFQNExample pins the major-keyed key shape and evaluates to opmodel.dev/catalogs/opm/transformers/deployment@v1."
  - date: "2026-07-26"
    event: "D18, D19, D20; OQ16 resolved, OQ13 re-resolved, OQ17 opened. D18 resolves OQ16: #FQNType becomes MAJOR-keyed (path/name@vN) for EVERY primitive — resources, traits, blueprints, transformers — so a primitive FQN is stable across a catalog's whole compatible series, making the supported pattern explicit (catalog ships v1.0.0/v1.1.0/v1.2.0 adding APIs; platform subscribes to the v1 series; modules written against different MINORS all install and match). Feasibility was already met: library/opm/materialize/materialize.go:93 builds catalogBuild{Subscription, Version, Value} with Version the bare SemVer of the resolved tag (index.go:22), so the kernel already knows which build it pulled and uses it only for error messages today. D18 REVERSES enhancement 0001 D5, recorded plainly because it was deliberate — core/src/types.cue:41-44 says FQNs were LIFTED from major-only to SemVer so divergent definitions surface as errors rather than colliding on a MAJOR bucket. D18 accepts that goal and rejects the mechanism: version inequality is a poor PROXY for definitional divergence that charges every consumer on every release for a check that pays out only when a publisher misbehaves; comparing definitions (same key, different definition -> error) tests the actual condition. Rejected: (A) walk back D17; (C) semver-range-aware matcher, the most expensive option — turns an O(1) keyed lookup into constraint solving and re-implements resolution CUE already does for deps; (D) normalize-to-major at match time, smallest core change but creates two notions of FQN, the declared string and the matcher key, which is the split this entry exists to remove; (E) demand-by-path-only, gives up expressing major incompatibility. D19 REVERSES D17'S VERSION DELETION FOR #Catalog while keeping D17's modulePath-carries-major and D18's major-keyed FQNs. The two now carry different jobs: the FQN (@vN) is the MATCH KEY, so cross-minor works; metadata.version (full SemVer, committed in source) is the COMPATIBILITY SIGNAL, stamped onto every primitive the catalog ships, so a module INHERITS a record of which catalog build it was authored against and the kernel can detect 'this platform's catalog is older than this module requires' and error clearly instead of failing later with a missing FQN naming nothing useful. #Catalog and #Module are therefore NOT symmetric, and the asymmetry is principled: a catalog is a vocabulary provider whose consumers must be able to state a minimum, while a module is a leaf nothing depends on, so D13 stands for #Module and does not extend. schemas/target.cue gains #SemverTriple, #VersionGTE and #CatalogCompat with satisfied constrained to true so an out-of-date platform catalog is a unification failure; VERIFIED — cross-minor (require 1.0.0, resolve 1.2.0) and exact-match vet clean, while require-1.2.0-resolve-1.0.0 yields `satisfied: conflicting values false and true` and a major skew yields `major: conflicting values 2 and 1`. Scope stated in the file: these shapes state the invariant and are NOT a semver implementation — they compare MAJOR.MINOR.PATCH and ignore prerelease ordering; production comparison is Go, where materialize/filter.go:61 already uses a real semver library. D20: ad-hoc and local-render versions are vMAJOR.0.0-dev, never v0.0.0-dev, because the MAJOR is the identity-bearing component (in the module path, in every D18 FQN, and under D16 in modulePath and therefore fqn and every derived UUID) — a 0.0.0-dev placeholder gets the identity-bearing part WRONG and diverges a local render from its published self, which is experiment 01's measured failure, whereas vMAJOR.0.0-dev leaves only minor/patch/prerelease as placeholders, none of which participate in identity. D20 also answers the question D14/D15 left open: a local checkout render stamps vMAJOR.0.0-dev rather than omitting the label. OQ13 RE-RESOLVED by D19 as a concrete SemVer committed in source — experiment 02 variant B's conclusion — after D17 briefly made the question moot. EXPERIMENTS RE-CLASSIFIED AGAIN: the historical banner added to experiments/README.md when D17 landed is WITHDRAWN there and replaced with a superseding note; 01 and 02 are live evidence again, with exp 02's strict-committed finding directly load-bearing for OQ13 and exp 01's finding holding at reduced severity (a stamped catalog's local-vs-published divergence no longer corrupts the match key, which is major-keyed now, but does corrupt the compatibility signal, so the version must still be committed rather than stamped). NEW OPEN QUESTION OQ17: under real SemVer a prerelease sorts BELOW its release, so a locally-developed catalog at 1.0.0-dev compares older than every published 1.x and would fail D19's floor check against any module built against 1.2.0 — breaking the dev loop exactly when a developer is working on the catalog. Candidates: skip the floor check when either side carries -dev; make the placeholder sort HIGH since a dev build is by construction ahead of every release; or keep the check and require hand-pinning, which is the status quo failure in a new hat. The target.cue illustration sidesteps this by ignoring prerelease ordering, so the schema currently states a WEAKER rule than the Go implementation will."
  - date: "2026-07-26"
    event: "Reviewed the D13-D20 outcome end to end and wrote schemas/examples.cue — worked before/after values for #Module and #Catalog, the cross-minor scenario, the too-old-platform failure, and the D20 dev placeholder. It vets, so a wrong example is a build failure rather than a doc bug; must-fail cases are commented with the errors they produce. NEW OPEN QUESTION OQ18 (whether #Module.metadata.modulePath is authored per D16 or derived from cue.mod/module.cue) with a MEASURED CONSTRAINT that settles where a derivation may live: @embed paths resolve relative to the EMBEDDING FILE'S OWN DIRECTORY and cannot escape upward — a package at identity/ embedding cue.mod/module.cue fails `open cue.mod/module.cue: no such file or directory`, and ../cue.mod/module.cue fails `@embed: cannot refer to parent directory`. So any derivation must sit at the module ROOT beside cue.mod/, and an identity/ subpackage CANNOT host it. That answers the question of whether #Module should gain a catalog-style identity/ package: no, on two independent grounds — the mechanism cannot live there, and modules have no structural need anyway, being single-package (jellyfin/seerr/web_app are two .cue files in one package with no subdirs; cert_manager and metallb have a crds/ subdir holding YAML, not CUE), so no FQN is computed from a module-wide constant across a package boundary and there is no cycle to break. The catalog's identity/ is a workaround for the cycle experiment 03 measured, not a pattern to emulate. Live options for OQ18: (a) authored per D16; (b) derived by an @embed in a conventional ROOT-LEVEL identity.cue scaffolded by `opm module init`, core owning the parsing — keeps artifact bytes equal to source bytes and works under plain cue vet, but untested through library's overlay load path, which gates the choice. TWO CORRECTIONS TO 05-risks' D17 blast-radius table, stale since D19 reversed D17's catalog-version deletion: core/src/catalog.cue:63 keeps `version!` and loses only the *\"0.0.0-dev\" default, and the per-catalog identity/identity.cue change is a TWO-LINE edit (Version becomes committed concrete per exp 02 variant B, ModulePath gains @vN, stamping generator and override file retired) rather than a deletion. Also recorded as unchanged: catalog-internal import lines, since intra-module imports omit the major suffix — verified, catalog_opm/cue.mod/module.cue is already opmodel.dev/catalogs/opm@v1 while its own imports carry no suffix — so modulePath gaining @v1 churns no import statement inside a catalog."
  - date: "2026-07-26"
    event: "Experiment 05-decided-shapes-module-catalog authored (Status: Running) — a readable reference implementation of D13-D20 as one #Module and one #Catalog, built so the decisions can be reviewed as CODE rather than as a decision log, and so the remaining choice points are visible in situ. One CUE module rather than three (cross-module resolution is already covered by exp 01 and 04; this one is about the SHAPES), no registry required. core/core.cue is a trimmed copy of core/src/{types,module,catalog,resource,transformer}.cue with every divergence carrying a CHANGED or REMOVED comment naming the decision and the current source line. HYPOTHESIS HELD SO FAR: identity and match keys are stable while the compatibility signal moves — moduleUUID and the demanded primitive FQN are byte-identical across a catalog MINOR bump AND between local dev and published, while builtAgainstCatalog varies (1.2.0 / 1.3.0 / 1.0.0-dev). The D19 floor behaves as designed across four cases including the failure (built against 1.2.0, platform on 1.0.0 -> false). Status stays Running because the A/B question on #Catalog.metadata.version is unresolved and its answer changes core/core.cue; Reading B is implemented (field absent from the catalog root, primitives read id.Version directly) with the one-line Reading A alternative marked beside it. FIVE FINDINGS, one of which is a real gap in the recorded design: (1) #ModulePathType MUST ACCEPT UNDERSCORES and the enhancement had not noticed — core/src/types.cue:20 is =~\"^[a-z0-9.-]+(/[a-z0-9.-]+)*$\" with no underscore, harmless while modulePath was a bare prefix but broken under D16 where the path ENDS IN nameSnakeCase and every multi-word snake name contains one (media_server, cert_manager, zot_registry_ttl); the fixture would not vet until widened, and #FQNType needs the same on its path portion — a concrete addition to the D16 blast radius. (2) D1's leaf constraint fires and earns its place: name media-server against a path ending /mod@v2 failed with `_leafOK: conflicting values false and true`, and under D16 the rule is expressible as strings.HasSuffix(registryPath, \"/\"+nameSnakeCase) over ONE field where today it spans two authored ones with nowhere to live. (3) CUE has no string slicing, so splitting path@vN is strings.SplitN(in, \"@\", 2) rather than LastIndex plus a slice; a module path carries at most one @, always terminal, so SplitN(2) is exact. (4) `uuid` as a field name shadows the `uuid` import — core/src/module.cue:4 already aliases it cue_uuid, and rebuilding from scratch hit the same wall, confirming the alias is load-bearing rather than stylistic. (5) THE COMPATIBILITY SIGNAL IS ONLY MEANINGFUL ONCE FROZEN: in a single tree, regenerating the catalog identity also changes what the module reports as builtAgainstCatalog because the module is re-evaluated against the live catalog; in production that value is frozen into the published artifact. A limitation of the setup, not the design — but it names a guarantee D13-D20 does not currently state, that the module's record of what it was built against must be CAPTURED AT PUBLISH rather than recomputed at render."
