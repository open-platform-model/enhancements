    event: "SUPERSEDED by 0010 (Module and Catalog Identity) and 0011 (Module and Catalog Publishing). The reason is scope rather than error: this entry began as a naming convention, absorbed version agreement, then absorbed the question of whether a version belongs in identity at all, then the question of how identity reaches an artifact — four problems on one id, with 27 decisions and six reversals among them. The append-only log did its job; what broke is that the narrative documents stopped tracking it, so 02-design still describes the version-agreement design under a revision banner and 05-risks carries tables a later decision invalidated. Rewriting in place was rejected because it would require breaking the append-only rule to produce a document that still spans four problems; deleting was rejected because the measurements are the expensive part and core carries a shipped, now-reverting change (nameSnakeCase, added 2026-06-17) whose only explanation lives here. The split follows the repo boundary and the sequencing boundary: 0010 owns what identity IS and how it reaches the artifact's bytes (a breaking core change that can be accepted without answering registry credentials), 0011 owns the commands that write it and the registry it goes to (a cli feature that depends on 0010). Both successors carry fresh decision logs starting at D1 with only current answers, and the evidence this entry gathered is restated inline there and dated rather than cross-referenced, so neither successor requires reading this one. This entry is now the record of how the design got here; experiments/ and research/ stay with it."
