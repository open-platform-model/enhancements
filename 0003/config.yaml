  - date: "2026-07-25"
    event: "Publish-scenario walk: candidate version-agreement methods eliminated by measurement rather than by further experiment. EVIDENCE (01-problem.md, new section): the D3 invariant is ALREADY FALSE across the published fleet. Artifacts pulled from the workspace registry and read byte-for-byte show jellyfin v2.0.1 and v2.0.2 both carrying metadata.version 2.0.0, and seerr v1.0.2 carrying 1.0.0 — only the .0 of each minor line is honest. The mechanism is modules/Taskfile.yml publish:smart, which checksums each module's .cue files, bumps the version in versions.yml on any difference, publishes at the bumped tag, and never reads or writes metadata.version — so the declared version is structurally frozen at whatever was last hand-typed while the tag advances with every content change. Drift is the OUTPUT of the flow, accumulating monotonically. The silent-downgrade path 01-problem previously described as a scenario is therefore the live behaviour of the two most-published modules: all three jellyfin artifacts compute one fqn and one module.uuid, so instances of v2.0.2 are identity-indistinguishable from instances of v2.0.0, and a CLI deployment of v2.0.2 records spec.module.version 2.0.0, which the operator then resolves to a real, older, cleanly-reconciling artifact. versions.yml also disagrees with the registry (claims v2.1.0/v1.2.0 against highest tags v2.0.2/v1.0.2), noted without overclaiming since the workspace registry is a dev instance. NEW DECISIONS: D10 (a catalog carrying cue.mod/local-module.cue cannot be published AT ALL — unconditional refusal on file presence, no allow flag, narrowing D8's catalog half and superseding it there; D8's escape hatch survives for opm module publish only, because a module's divergence is scoped to one artifact whereas a catalog's propagates through #Catalog's pattern constraint into every transformer FQN it ships, a blast radius no publisher can assess at flag-press time); D11 (D6's acquire-side check ships WITHOUT grandfathering — the non-conforming artifacts above stop loading on the day it lands and are fixed by republishing, not by an exemption list, transition window, or adopt-in-place, the last being OQ3's record option promoted from safety net to workaround; the affected set is small, enumerable, privately held, and only grows with every publish under the current flow). OQ6 UPDATED: option (c) tag-only override is no longer ruled out by reasoning but demonstrated as a drift generator — it is what publish:smart does — and the same evidence eliminates the external-version-registry mechanism generally, since versions.yml cannot satisfy D3 by construction when nothing writes back into the source the invariant is about; (a) and (b) survive, differing only in whether the flag may write the source file. NEW OPEN QUESTION OQ14 (what detects 'this module changed' once the version lives in source — the content checksum covers the same .cue files that would carry metadata.version, so a pure version bump flips the change detector; today's flow converges only because it stores the checksum after publishing, and any flow computing it before deciding the version oscillates; candidates are masking the version out of the hash, dropping content detection so the authored version is the sole trigger, or demoting the checksum to an advisory forgot-to-bump warning). New '## Recorded Non-Issues' section in 03-decisions.md opens with promote/mirror between registries, closed as transparent to D3/D6/D9 because CUE maps path prefixes to hosts via CUE_REGISTRY, so mirroring changes the host while path and tag stay put."
  - date: "2026-07-26"
    event: "OQ6 resolved by D12: version authoring splits from version publishing, and the answer to 'what should --version mean' turned out to be 'there should not be one'. `opm module version set <semver>` becomes the SOLE writer of metadata.version — in-place edit of committed source, idempotent, and it also updates cue.mod's @vN when the major changes so the two declarations #CanonicalModuleRef ties together cannot drift. `opm module publish` takes NO version input of any kind: no --version, no override, no assertion flag. The release sequence is version set -> review -> commit -> publish, which puts the commit between deciding a version and pushing an artifact. Rationale is that the strongest form of D4 is an ABSENT parameter rather than a validated one — with no version input the command has no surface through which source and tag can be made to disagree, which needs no test to defend. Alternatives rejected: (c) tag-only override, dead by the 2026-07-25 fleet measurement since it is what publish:smart does; (b) fused set-and-publish, because fusing removes the seam the commit goes in and an artifact whose metadata.version exists in no commit cannot be traced to its source, which is intolerable when that field IS the artifact's identity; (a) assertion flag, rejected as unnecessary rather than wrong since an idempotent `version set` subsumes it (CI calls it unconditionally; matching = silent no-op, differing = reviewable diff) and keeping it would overload one spelling with two meanings a caller cannot disambiguate. ALSO REJECTED — temp-copy stamping (CLI copies the tree, edits metadata.version in the copy, publishes the copy, leaves source untouched), which was raised as a pragmatic option and does fix the consumer half correctly: it breaks artifact-bytes-equals-source-bytes (D4 directly), and because committed source then keeps a version the artifact does not carry, a module rendered from a local checkout computes a different fqn -> module.uuid -> instance.uuid than the same module rendered from the registry, putting a DIFFERENT IDENTITY LABEL on every rendered resource — the label the operator's prune guard and the CLI inventory both match on. That is experiment 01's measured catalog divergence transposed to modules (same mechanism, symptom moves from `no matching transformer` to a mismatched instance UUID), reachable through the sanctioned local-module.cue dev workflow, and it breaks the local-vs-registry byte identity 0006's handoff digest gate rests on. D12 extends to catalogs as `opm catalog version set` per D7's one-pipeline-two-artifact-types rule, fixing the COMMAND while leaving the catalog's authoring SITE to OQ13. Docs threaded: 02-design step 5 rewritten (no new step number — the numbering is referenced by earlier history) plus two new cli integration-point bullets; 04-graduation gains an accepted-gate line requiring the absence of the flag to be tested and a `version set` implemented-gate line requiring real workspace modules as fixtures, and its stale OQ1-OQ7 enumeration is replaced with a pointer to `task questions:open`; README scope gains the command; OQ13 and OQ14's OQ6 cross-references retargeted to D12. Experiment 05 renarrowed to `05-in-place-version-stamping` (temp-copy variant dropped by this decision): remaining variants are the edit mechanics — surgical AST rewrite vs reformatting round-trip vs line edit — plus two cheap eliminations, the supplemental-file unification conflict and whether @tag() survives publish. Not yet authored. Fixture population surveyed: five real modules (jellyfin, seerr, web_app, cert_manager, metallb), every one declaring `version` as a concrete literal in a single root .cue file; cdi, snapshot_controller and wolf are DESIGN.md stubs with no .cue at all, correcting the 2026-07-25 claim that three modules were non-conforming by omitting a version — D11's migration inventory is stale-version artifacts only."
  - date: "2026-07-26"
    event: "Prior-art survey gathered under research/prior-art-version-agreement.md — how seven ecosystems bind a declared version to a published artifact. Three families found: manifest-authoritative (Cargo, npm, Maven, Helm), VCS-authoritative (setuptools-scm, Terraform), and version-is-not-identity (Go). OPM is in family 1 by construction because a CUE module's artifact IS source rather than a build output, which eliminates family 2 on the same grounds D4 already gives. FINDINGS THAT CHANGE SOMETHING: (1) D12 is convergent prior art, not novel — npm ships exactly this split as `npm version` (writes package.json, commits, tags) plus `npm publish`, and `cargo publish` takes no version argument; D12's Source line now cites it. (2) NEW RECOMMENDATION, not yet a decision: `cargo publish` REFUSES on an unclean working tree by default (--allow-dirty is the documented override, itself carrying a known hazard of sweeping in untracked files), which is the enforcement mechanism D12 argued for but did not supply — adopting it would make the version-set -> commit -> publish seam structural rather than conventional and would close the hole where `version set` writes a version that is published but never committed. (3) OQ12 sharpened: package registries treat release immutability as fundamental (Maven Central rejects redeployment) while OCI registries treat it as OPT-IN (ECR mutable by default, Harbor project-level rules); CUE modules live in OCI registries so OPM inherits the weaker default — a gap to close deliberately, two-sided (registry-side immutability stated as a deployment constraint plus client-side refusal to overwrite), with the yank question genuinely open since ecosystems disagree. Tag mutability is also documented as a TOCTOU security defect, raising it above bookkeeping. (4) OQ13 sharpened on the placeholder half: Maven's -SNAPSHOT is the mature form of 0.0.0-dev and differs in every property that matters — suffix on a real version, explicitly authored not defaulted, mutability declared by contract, separate repository, and refused by Central outright. OPM already has the namespace via SemVer prerelease syntax; what is missing is non-defaulted authoring plus registry-side refusal. Also external confirmation of D4: setuptools-scm generates _version.py into the artifact and its own docs say not to commit it, which is coherent for a wheel and incoherent for an artifact that IS source — the same move OPM catalogs make today, producing experiment 01's divergence. (5) OQ14 gains a mechanism and a TENSION: release-please's generic updater can rewrite a version in arbitrary files via an `x-release-please-version` comment annotation, so a .cue file works directly — but that makes release-please a SECOND writer of metadata.version, contradicting D12's sole-writer claim and unaware of the coupled cue.mod @vN edit; OQ14 must choose between automation calling `version set` (D12 survives) or adopting the annotation and narrowing D12 to 'sole writer among OPM commands'. (6) ROAD NOT TAKEN, recorded because it reframes the problem: Go has no version-agreement problem because go.mod carries NO version field — only the major, as a path suffix, which the toolchain enforces. OPM measured version-free source as structurally dead (exp 02 variant d) but the survey explains why the two differ: Go's module identity is path+major and the full version is a coordinate, whereas OPM's fqn interpolates the full version into identity and thence into every resource label. OPM has this problem BECAUSE it put the version inside identity. Not a proposal to change that — the blast radius spans D9, OQ9 and every deployed instance — but the only surveyed approach that removes the problem rather than policing it. (7) D6 contrast: Go verifies CONTENT against a Merkle-tree transparency log (sum.golang.org) rather than checking metadata against fetch coordinates; complementary rather than competing, and a transparency log would partially answer OQ12 by making a moved tag detectable even where the registry permits it. D6 stays the right first move at a fraction of the cost. Caveats recorded in the dossier: search-derived rather than primary-spec-read; crates.io/npm republish specifics, Helm, Terraform, and JSR behaviours are recalled and explicitly marked unverified."
  - date: "2026-07-26"
    event: "SCOPE WIDENED and course reversed: D13 removes #Module.metadata.version ENTIRELY rather than enforcing agreement between it and the release tag. Module source declares modulePath + name and nothing about its version; the full version exists only as the artifact coordinate, with the major carried in the CUE module path (opmodel.dev/modules/jellyfin@v2) where CUE already puts it. This follows CUE's and Go's own model instead of layering on it — cue.mod/module.cue carries major only and `cue mod publish <version>` supplies the rest — and metadata.version was an OPM addition duplicating a coordinate both systems deliberately keep out of source. 02-design's Non-Goal preserving identity semantics is WITHDRAWN in place (struck, not deleted); core identity is now in scope and this is a BREAKING change to a published dependency every module and both catalogs consume. WHAT D13 RETIRES for #Module (catalog side untouched, OQ13 still open): D3 version agreement becomes vacuous with one version in the system; D6's version half likewise, its path half survives; D11's fleet-breakage migration evaporates since the artifacts are non-conforming only against a deleted field; and D12 REVERSES for modules — `opm module version set` has nothing to write and publish must take the version as an argument again, D12's guarantee obtained more cheaply because the reason no lie can be expressed is now an absent second value rather than an absent parameter. D12 stands for catalogs. D4, D8, D9, D10 unaffected. Alternatives rejected: keeping the field and enforcing agreement (policing a problem rather than removing it — publish derivation, acquire check, version-set command, fleet migration and a permanent invariant, all to keep two values equal that need not both exist); variant C, a declared-but-never-authored field injected at acquire (viable and was the standing recommendation — preserves the metadata surface and makes agreement true by construction — but keeps fqn/uuid/shape-gate depending on a value that exists only after a registry fetch, so a module read from disk has no identity, and if fqn must be redesigned anyway the field earns nothing); variant B, a hidden _version written at publish (stamping per D4/exp-01, plus core/SPEC.md:304 records that a field which is not a declared permitted member of the closed #Module breaks re-unification into #ModuleInstance.#module with 'field not allowed', invisible to cue vet because a standalone module is only closed once). BLAST RADIUS AUDITED and documented as a new section in 05-risks.md — every site read at the cited line across core, library, cli, opm-operator, modules and releases. Must change: core module.cue:22/23/26/36 and types.cue:26-28 (#ModuleFQNType), four core/SPEC.md rationale paragraphs (core-schema-edit skill is binding), library shape.go:66 required-concrete list, synth/instance.go:152 precondition, synth/render.go:62 (a SIMPLIFICATION — stops parsing a semver for a major that cue.mod states literally), library schema metadata.go/context.go, cli pkg/module/module.go CanonicalModuleRef plus majorVersionTag/ensureVPrefix, cli apply.go:273 and thineditor.go:112 which write spec.module (this is where the silent-downgrade defect is actually FIXED — the CLI records the coordinate it fetched), five modules/*/module.cue lines, and testdata fixtures. Verified NOT to change: the operator needs no feature code (common_types.go:36-45 ModuleReference is {Path with major, Version tag}, reconcile reads only spec, never metadata.version); no user-authored CUE breaks because #InstanceIdentity never exposed version to components; releases/ is clean; primitives keep their own version! and @semver FQNs and nothing parses a MODULE fqn (instance.go:103 returns it opaque, the matcher keys off primitive FQNs). MIGRATION: every module identity changes once via fqn -> module.uuid -> instance.uuid -> the resource label; same migration D9 already forces so both must land in ONE window (OQ9 now owns both); live instances need an adoption path because prune.go:107 tolerates an EMPTY live uuid label but not a disagreeing one, which is why opm-operator joins `affects` despite shipping no feature change; the module.opmodel.dev/version label loses its source and its removal is user-visible. LATENT BUG FOUND AND REMOVED BY D13: because fqn interpolates version, a genuinely-moving version would change instance.uuid on every upgrade, and reconcile/moduleinstance.go:308 repopulates Status.InstanceUUID from each new render while prune.go:107 SKIPS deletes whose live label disagrees — so shipping D3 would have silently orphaned whatever each upgrade removed. The drift masked it: metadata.version never moved, so the uuid never moved. NEW OPEN QUESTION OQ15 (deliberately pinned when D13 was taken, not settled in passing): what shape fqn and the identity UUIDs take once the version is gone — candidates are modulePath/name, modulePath/name@vN carrying the major from the CUE path (most consistent with D13), or dropping fqn entirely and computing uuid from (modulePath, name) since nothing parses it; uniqueness across publishers is already supplied by D9's owner-scoping. schemas/target.cue marked rather than rewritten — #CanonicalModuleRef's `version` input is annotated as the resolved tag rather than metadata, with the full rewrite deferred to OQ15."
  - date: "2026-07-26"
    event: "D14 + OQ15 evidence. D14: the module.opmodel.dev/version label moves OUT of the schema and is written by the code that performed the resolution — library's render path, cli, and opm-operator — so core/src/module.cue:36 stops declaring it when D13 deletes the field it interpolates, and the label finally states what it always appeared to state: the version of the artifact actually fetched. Constraint recorded: all three writers MUST emit an identical label for the same acquisition, because 0006's render-parity work and handoff digest gate compare CLI-rendered and operator-rendered output byte-for-byte. Alternatives rejected: dropping the label (selecting by deployed version is a real operational need and removing a field is not a reason to remove a capability); keeping a version field to keep the label (that is variant C, already rejected by D13); injecting the resolved version into the module value so CUE can stamp it as today (core/SPEC.md:304's recorded field-not-allowed bug on re-unification into a closed #Module, and it returns a fetch-derived value to module identity). OQ15 EVIDENCE MEASURED (cue v0.17.1) — constrains every candidate that keeps the major in fqn: metadata.modulePath is the bare prefix `opmodel.dev/modules`, carrying neither name nor major, so the major exists in exactly one place, cue.mod/module.cue, and CORE CANNOT SEE IT. CUE exposes no builtin for the enclosing module path (probed). A module CAN read its own module file — `@extern(embed)` plus `_raw: _ @embed(file=\"cue.mod/module.cue\", type=text)` plus regexp.FindSubmatch yields \"v2\", verified working; type=cue is rejected as an unsupported encoding, so it is a text read plus regex. It survives publishing: cue.mod/module.cue ships INSIDE the artifact zip, confirmed by unzipping jellyfin v2.0.2 from the workspace registry. BUT @embed resolves relative to the file's own module, so an embed written in core reads CORE's module file — core cannot derive a consumer's major, and every