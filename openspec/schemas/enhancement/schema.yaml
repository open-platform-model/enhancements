name: enhancement
version: 2
description: OPM enhancement - proposal -> design -> specs -> tasks (a contract, not a build plan)
# Why a project-local schema: an enhancement is one feature of the whole system, designed
# here and built in several repos. One feature is one id and one folder, however large.
# A reader stops as soon as they know enough:
#   README.md      index      generated by `task index`; where a reader starts
#   proposal.md    what, why  2 minutes, written for a newcomer
#   design.md      how, why   one explanation: a diagram, themes, risks, rejected options
#   specs/         contract   for whoever implements a piece
#   tasks.md       delivery   which repo still has work
#   config.yaml    facts      id, status, affects ...; written by the commands, not by an artifact
#   evidence/      proof      notes, experiments, research, schemas; outside every cap
#
# config.yaml is not an artifact: `task new` writes it and the commands keep its status and
# records. schema.cue validates it.
#
# Lifecycle:
#   draft      in changes/. Everything may change.
#   accepted   in changes/, ready to implement. The delta specs stay in the entry and are NOT
#              synced into openspec/specs/. The entry stays editable; an edited requirement
#              needs a re-sample.
#   delivered  every task ticked, then `task deliver` archives it and only then do the delta
#              specs reach openspec/specs/.
#   rejected, superseded, withdrawn
#              archived with `--skip-specs`, with a reason. The deltas never reach specs/.
#
# All caps below are soft: the checker warns and never refuses.
artifacts:
  - id: proposal
    generates: proposal.md
    description: What changes and why, in plain language, one page, owned by the proposer
    template: proposal.md
    instruction: |
      Write the proposal: what OPM does once this lands, for a developer who has never seen it.

      The proposer owns this file word for word. Draft it only from what the proposer said,
      show it, and change it only on their instruction. Never expand it to add detail: detail
      belongs in the design or the specs.

      Advice (the checker warns, never refuses):
      - About 300 words, not counting the `## Open questions` section. Open questions are
        outside the 300-word cap and outside the 3,000-word total.
      - Plain words. No decision numbers, no requirement ids. If a sentence needs a type
        name the reader does not know, move it to the design.

      Sections, in the template's order: the lede (three sentences at most), Why, What
      Changes (3 to 5 observable bullets), What this is not (boundaries), Example (one small
      block from the user's side), Capabilities, Impact, Open questions.

      Capabilities is the link to the specs: every capability named here gets a delta spec,
      and no delta spec exists for a capability not named here. Read `openspec/specs/` first
      and reuse an existing capability before you create one.

      Open questions: one line each, marked `- Blocking: ...` (acceptance waits for the
      answer) or `- Not blocking: ...`. When the owner has answered one, mark it
      `- Answered: ...` and move it into the design theme it settles; accept refuses while
      an `- Answered:` line or a `- Blocking:` line stays here.

      Test before you finish: could a new developer explain this enhancement to a colleague
      after reading only this page? If not, it is too detailed or too vague.

      A short page is easy to get wrong. After the design and the specs exist, read this
      page again and make sure every statement still agrees with them.
    requires: []

  - id: design
    generates: design.md
    description: How it works and why, as one explanation - a diagram, themes, risks, rejected options
    template: design.md
    instruction: |
      Write the design the way a Kubernetes enhancement proposal does: one explanation that
      a reader follows from top to bottom. The proposer makes each choice; you may draft.

      The reader has little working memory and stops reading when the text gets dense.
      Advice (the checker warns, never refuses):
      - About 1,500 words in all, rejected options included.
      - How it works: one diagram of at most 7 boxes, and at most three sentences.
      - Design: one `###` section per theme of the feature, at most 7. A theme is a lasting
        area ("declaring a secret"), never a phase or a date. Stances and policy live here,
        in the theme they belong to; a policy theme needs no requirement.
      - A theme has about 120 words, in paragraphs of at most three sentences. Say what the
        user sees first. Put each reason right after the thing it explains.
      - Considered and rejected: one line each, `- Considered X; rejected because Y.`, at most
        10. List an option only if someone would propose it again.
      - Risks: one line each.
      - An open question the owner has answered moves here from the proposal, into the theme
        it settles. It counts toward the design cap.

      Leave out:
      - Numbered decisions. Point at a theme by its heading.
      - How a repo builds it. That belongs in the repo's own change.
      - What is out of scope. That is "What this is not" in the proposal.
      - History ("we first tried", "this replaces the earlier idea"). State what holds now.
      - Comparisons, measurements and long arguments. Put them in a note in `evidence/` and
        link to it from the sentence they support. A rejected option that needs more than
        one line to stay rejected gets a note.

      While the enhancement is a draft, rewrite freely. Once it is accepted, the design may
      change in a reviewed pull request; the proposal and the design need only that review.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: The contract - delta specs against the store's capability specs
    template: spec.md
    instruction: |
      Write the contract as delta specs: one file per capability named in the proposal, at
      `specs/<capability>/spec.md`. A capability is a lasting area of behaviour ("secrets",
      "instance-export"), never the name of this enhancement. `openspec/specs/` holds only
      delivered work: an ADDED name must not be there, and a MODIFIED, REMOVED or RENAMED
      target must be there. An entry that needs an undelivered entry stays a draft.

      When this enhancement creates a capability, start its delta with a `## Purpose` of one
      or two sentences, at least 50 characters, never starting with `TBD` or `TODO`.
      `openspec archive` reads it only at creation and never changes it later. It is also the
      line every repo sees in its index of this store, so write it for a reader who is
      choosing what to open.

      Requirements:
      - The name is a short plain statement of what holds, at most 8 words ("A package
        refuses a literal secret"). No numbers, no ids.
      - One SHALL (or MUST) statement that a consumer can observe from outside one repo's
        code, in at most 500 characters. The admission test: no Go symbol, no CLI flag, no
        file path. A published CUE definition, which is part of a module's public schema,
        may be named. An internal definition stays out.
      - Shorten the sentence, never the claim. Keep every named field, type, limit and edge
        case that a consumer can see.
      - At least one scenario, written with the requirement: `#### Scenario:` with WHEN and
        THEN. `openspec validate` refuses a requirement without one.
      - No `- Design:` line and no `- Changed by:` line. Provenance is `task history`.

      Delta sections:
      - `## ADDED Requirements`: new requirements.
      - `## MODIFIED Requirements`: an existing requirement changes. Keep its name and restate
        the full requirement with every scenario of the main spec that still holds. OpenSpec
        refuses a MODIFIED block that drops a scenario of the main spec. To reverse a
        shipped scenario, do not MODIFY: write a REMOVED for the old requirement and an ADDED
        under the new name (below).
      - `## REMOVED Requirements`: with `**Reason**` and `**Migration**`. A REMOVED that
        reverses a shipped scenario has the fixed form `**Migration**: Replaced by "<new name>"`.
      - `## RENAMED Requirements`: `FROM:` and `TO:` pairs, when a change makes an existing
        name untrue. Rename it, then modify it under the new name.

      A theme of the design that holds a stance has no requirement. That is correct.

      `.openspec.yaml` keys that you set by hand:
      - `skip_specs: true` when the entry has no requirements and so no `specs/` folder; leave it
        out when `specs/` exists. The checker warns in a draft and refuses from accept.
      - `retire_capabilities: true` when a REMOVED takes the last requirement of a capability.
        Without it `openspec archive` aborts.

      After accept, an edit to a requirement needs a re-sample: run `task resample`, review what
      it prints, then confirm. The confirmation rewrites `accepted:`. Until then the checker
      refuses the edit in a pull request.
    requires:
      - design

  - id: tasks
    generates: tasks.md
    description: Which repo still has work - one line per piece of work in one repo
    template: tasks.md
    instruction: |
      Write the delivery list. It answers one question: which repos still have work?

      **Follow the template exactly.** Progress is counted from `- [ ] X.Y` checkboxes.

      - One `## <n>. <Theme>` section per part of the work. The sections run in order:
        section 1 is done before section 2, and so on. The order is advice: no field and no
        check holds it.
      - One line per repo change: `- [ ] 1.1 <repo>: <outcome>`. Name the outcome in plain
        words, never the method, a file or an identifier. Order the lines by what must ship
        first.
      - Keep it coarse. One line is one repo change, not one requirement.
      - At accept, every repo in `affects` in `config.yaml` has at least one line. While the
        entry is a draft the file is optional.

      Nothing is implemented in this repo. A line is ticked when the repo's own change lands:
      `- [x] 1.1 <repo>: <outcome> (<change-name>)`, the change name without its date. A repo
      with no OpenSpec change appends `(PR <n>)`. The tick is a pull request on this repo.
    requires:
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Do not implement anything here. Each line of tasks.md is delivered by an OpenSpec change
    in the repo it names. That change's proposal says which line it delivers:

      ## Enhancement
      Delivers 0013, task 2.1.

    When that change is archived, tick the line here and add the change's name. When every
    line is ticked, the enhancement is delivered: `task deliver` validates, archives and
    indexes it in one commit. Do not run `openspec archive` by hand: only a delivery, a seed or a
    Purpose-only correction pull request changes `openspec/specs/`.
