name: enhancement
version: 1
description: OPM enhancement - proposal -> meta -> design -> specs -> tasks (a contract, not a build plan)
# MOCKUP (branch openspec-store-design). See openspec/MOCKUP.md.
#
# Why a project-local schema: an enhancement is one feature of the whole system, designed
# here and built in several repos. One feature is one id and one folder, however large.
# A reader stops as soon as they know enough:
#   README.md      index      generated by `task index`; where a reader starts
#   proposal.md    what, why  2 minutes, written for a newcomer
#   design.md      how, why   one explanation: a diagram, themes, rejected alternatives
#   specs/         contract   for whoever implements a piece
#   tasks.md       delivery   which repo still has work
#
# Lifecycle:
#   draft      in changes/, no `accepted` date. Everything may change.
#   accepted   in changes/, ready to implement. The delta specs are synced into
#              openspec/specs/, so every repo sees the contract. The design and the
#              requirements change only together, in a reviewed pull request.
#   delivered  every task ticked, then `openspec archive --skip-specs`.
#   rejected   `openspec archive --skip-specs` with `rejected_reason`; never synced.
artifacts:
  - id: proposal
    generates: proposal.md
    description: What changes and why, in plain language, one page, owned by the proposer
    template: proposal.md
    instruction: |
      Write the proposal: what OPM does once this lands, for a developer who has never seen it.

      The proposer owns this file word for word. Draft it only from what the proposer said,
      show it, and change it only on their instruction. Never expand it to add detail: detail
      belongs in the design or the specs.

      Hard limits:
      - At most 300 words, not counting the code block.
      - Plain words. No file names, and no type names the reader must
        already know. If a sentence needs one, move it to the design.

      Sections, in the template's order: the lede (three sentences at most), Why, What
      Changes (3 to 5 observable bullets), What this is not (2 or 3 bullets), Example (one
      small code block from the user's side), Capabilities, Impact.

      Capabilities is the link to the specs: every capability named here gets a delta spec,
      and no delta spec exists for a capability not named here. Read `openspec/specs/`
      first and reuse an existing capability before you create one.

      Test before you finish: could a new developer explain this enhancement to a colleague
      after reading only this page? If not, it is too detailed or too vague.

      A short page is easy to get wrong. After the design and the specs exist, read this
      page again and make sure every statement still agrees with them.
    requires: []

  - id: meta
    generates: config.yaml
    description: The enhancement's metadata; only facts that do not change after the design is done
    template: config.yaml
    instruction: |
      Fill config.yaml. It holds only facts that stay true once the design is done.

      Do not add a status field, a history or amendment lists. They are derived:
      - draft or accepted: the `accepted` date, written once by the accept step.
      - delivered or rejected: the folder is in `changes/archive/`.
      - amends and supersedes: the delta specs. A MODIFIED or REMOVED requirement that
        another enhancement introduced is the edge.
      - delivery: tasks.md.
      - history: `git log` on the folder.

      Do not write README.md. `task index` generates it from this file, design.md and tasks.md.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: How it works and why, as one explanation - a diagram, themes, risks, rejected alternatives
    template: design.md
    instruction: |
      Write the design the way a Kubernetes enhancement proposal does: one explanation that
      a reader follows from top to bottom. The proposer makes each choice; you may draft.

      The reader has little working memory and stops reading when the text gets dense.
      - How it works: one diagram of at most 7 boxes, and at most three sentences.
      - Design: one `###` section per theme of the feature, at most 7. A theme is a lasting
        area ("declaring a secret"), never a phase or a date.
      - A theme has at most 120 words, in paragraphs of at most three sentences. Say what
        the user sees first. Put each reason right after the thing it explains.
      - Alternatives: at most 10 rejected options, one line each, each starting with the
        theme it belongs to. List an option only if someone would propose it again.
      - Risks: one line each. Open questions: each says whether it blocks acceptance.

      Leave out:
      - Numbered decisions. Point at a theme by its heading.
      - How a repo builds it. That belongs in the repo's own change.
      - What is out of scope. That is "What this is not" in the proposal.
      - History ("we first tried", "this replaces the earlier idea"). State what holds now.
      - Comparisons, measurements and long arguments. Put them in a note in evidence/ and
        link to it from the sentence they support. A rejected option that needs more than
        one line to stay rejected gets a note.

      While the enhancement is a draft, rewrite freely. Once it is accepted, change the
      design only together with the delta specs it explains, in a reviewed pull request.
    requires:
      - meta

  - id: specs
    generates: "specs/**/*.md"
    description: The contract - delta specs against the store's capability specs
    template: spec.md
    instruction: |
      Write the contract as delta specs: one file per capability named in the proposal, at
      `specs/<capability>/spec.md`. A capability is a lasting area of behaviour ("secrets",
      "instance-export"), never the name of this enhancement.

      When this enhancement creates a capability, start its delta with a `## Purpose` of one
      or two sentences. `openspec archive` reads it only at creation; without it the new spec
      gets a placeholder that fails validation. It is also the line every repo sees in its
      index of this store, so write it for a reader who is choosing what to open.

      Requirements:
      - The name is a short plain statement of what holds, at most 8 words ("A package
        refuses a literal secret"). No numbers, no ids.
      - One SHALL statement that a consumer can observe from outside one repo's code. No Go
        symbol, CLI flag or file path.
      - Shorten the sentence, never the claim. Keep every named field, type, limit and edge
        case. A requirement is the one place where being complete beats being short.
      - A `- Design:` line naming the enhancement and the theme that explains why
        ("0013, Resolving secrets"). No rationale here.
      - At least one scenario (`#### Scenario:` with WHEN and THEN). `openspec validate`
        refuses a requirement without one.

      Delta sections:
      - `## ADDED Requirements`: new requirements from this enhancement's decisions.
      - `## MODIFIED Requirements`: an existing requirement changes. Keep its name, restate
        the full requirement with every scenario that still holds, and add a
        `- Changed by:` line naming your enhancement and theme.
      - `## REMOVED Requirements`: with **Reason** and **Migration**.
      - `## RENAMED Requirements`: when a change makes an existing name untrue. Rename it,
        then modify it under the new name.

      Every theme of the design is named by the `- Design:` line of at least one requirement.
    requires:
      - design

  - id: tasks
    generates: tasks.md
    description: Which repo still has work - one line per piece of work in one repo
    template: tasks.md
    instruction: |
      Write the delivery list. It answers one question: which repos still have work?

      **Follow the template exactly.** Progress is counted from `- [ ] X.Y` checkboxes.

      - One `## <n>. <Theme>` section per theme of the design, in the same order.
      - One line per piece of work in one repo: `- [ ] 1.1 <repo>: <outcome>`. Name the
        outcome in plain words, never the method, a file or an identifier.
      - Order the lines by what must ship first.
      - Keep it coarse. One line is one repo change, not one requirement.

      Nothing is implemented in this repo. A line is ticked when the repo's own change
      lands, and the change's name is added in brackets.
    requires:
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Do not implement anything here. Each line of tasks.md is delivered by an OpenSpec change
    in the repo it names. That change's proposal says which line it delivers:

      ## Enhancement
      Delivers 0013, task 2.1.

    When that change is archived, tick the line here and add the change's name. When every
    line is ticked, the enhancement is delivered: `openspec archive --skip-specs`.
