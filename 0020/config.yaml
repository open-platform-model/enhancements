title: Contract Promotion and Retirement
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  Promote a contract by dual-shipping both levels in one build with the promotion declared, and require a tombstone with a reason when a published key stops shipping.
