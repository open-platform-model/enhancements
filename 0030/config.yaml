id: "0030"
slug: opm-portal-v1
title: 'OPM Portal V1'
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  A read-only web portal and versioned read API that show what OPM runs in a cluster, from the Platform down to Pods, with applied state and workload health kept apart.
status: draft
# Type of work, single-valued: schema | runtime | distribution | tooling | misc.
# See enhancements/schema.cue #Category. `task new` requires CATEGORY=.
category: runtime
# Every repo that ships code/schema/content changes driven by this enhancement:
# its blast radius. Several entries means it spans repos; no label is needed.
# Validated against the workspace directory map in /CLAUDE.md; see schema.cue #Repo.
# `task new` requires AFFECTS=; `core` below is only the template's stand-in.
affects:
  - opm-portal
  - opm-operator
  - opmodel.dev
# Does this enhancement add or change opmodel.dev/core definitions?
# true  → schemas/ MUST exist (target.cue + examples.cue + spec.md) and
#         affects MUST include "core".
# false → schemas/ MUST NOT exist; non-core compilable CUE goes in the
#         optional contracts/ (task new:contracts ID=NNNN).
# The template itself keeps schemas/ and contracts/ as copy sources and is
# exempt from the iff-rule (0000 is skipped by `task vet`).
core_schema: false
