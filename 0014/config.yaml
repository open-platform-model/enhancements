history:
  - date: "2026-07-29"
    event: >-
      Drafted. 0006 shipped the handoff that moves an instance's manager to the operator; nothing moves its
      definition out of the cluster, so a CLI-first user who now wants GitOps hand-assembles four YAML documents
      per instance from a `kubectl get -o yaml` dump. Three decisions came from the user on the day: the exported
      unit is the CR plus its apply envelope rather than a bare CR (D1), export refuses to write unless the
      published module reproduces `status.lastAppliedRenderDigest` (D2, reusing handoff's gate chain and
      `VerificationDigest`), and `spec.values` is written verbatim with a warning rather than redacted or refused,
      because OPM cannot yet identify which values are secret (D3). D4 records the live CR as the sole input.
      Two findings from reading the code shaped the design. `ApplySpec` (cli/internal/inventory/store.go:119)
      writes only `spec.module`, `spec.owner`, and `spec.values`, so every CLI-written CR lacks
      `spec.serviceAccountName` and `spec.prune` — meaning a dump-and-strip export applies under the controller's
      own identity and orphans its workloads on delete, a behaviour difference invisible in the YAML. And the
      render-bearing / apply-bearing partition resolves the tension that finding creates: the fields the digest
      gate verifies are copied untouched, while the fields governing apply identity and deletion sit outside the
      render digest and can be completed without weakening the guarantee, provided every completion is reported.
      The partition is enforced in schemas/target.cue rather than asserted in prose. Six open questions;
      OQ4 (field-manager collision when Flux's kustomize-controller applies over fields owned by opm-cli and the
      operator) is the load-bearing one and is gated on a runnable experiment, because it decides whether the
      adoption is as quiet as D2's guarantee implies.
  - date: "2026-08-04"
    event: "Illustrative example vocabulary genericised across this entry — a documentation-hygiene pass, cosmetic only. NO decision, gate, open question, measurement or schema constraint changed, and no decision or OQ number moved. The worked examples' application names move to neutral infrastructure names (`postgres`, `grafana`, `minio`; the five-module scene loses its home-cluster framing), and example namespaces from `media`/`games-*` to `prod`/`staging`/`data-*`. DELIBERATELY LEFT VERBATIM: dated measurements (the 2026-07-25 byte-for-byte registry read and everything derived from it), live-fleet inventories, and real repository paths — `modules/jellyfin/`, `opm-kind-demo/jellyfin/` and the `modules/*` rewire lists name artifacts that were actually read or must actually be opened, so renaming them would falsify the record or dangle the pointer. Where an entry's problem statement IS the measurement, it stays; where the name was arbitrary, it moved."
