id: "0016"
slug: instance-init
title: Initialize a Module Instance Package from a Published Module
status: draft
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: cli
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
#
# cli: the new `opm instance init` command. core: one additive optional field
# on #Module (the init-values template, D3). library: conditional on OQ4 —
# listed because the leading option generalizes helper/synth's instance-file
# renderer so CLI init and in-memory synth share one generator; drop it if OQ4
# resolves to a CLI-side renderer. opmodel.dev regenerates the CLI reference
# mechanically after landing and ships nothing gated by this entry.
