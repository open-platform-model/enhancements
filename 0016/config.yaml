id: "0016"
slug: instance-init
title: Initialize a Module Instance Package from a Published Module
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  Derive a complete, committable module instance package from an acquired OCI artifact, instead of hand-typing its dependency pins, majors and module wiring.
status: draft
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: cli
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
#
# cli: the new `opm instance init` command and its renderer (D7). core: one
# additive optional field on #Module (initValues, D3/D4). library ships
# nothing: the renderer is CLI-side (D7). opmodel.dev regenerates the CLI
# reference mechanically after landing and ships nothing gated by this entry.
affects:
  - cli
  - core
core_schema: true
semver: minor
created: "2026-08-13"
updated: "2026-08-30"
authors:
  - emil@jacero.se
# Append-only timeline of milestones. Free-form `event` strings;
# `slice` + `semver` are optional structured fields for events that carry
# machine-readable detail.
history:
  - date: "2026-08-13"
    event: >-
      Drafted. Nothing turns a published module into the on-disk instance package everything downstream consumes (opm instance build/apply, the operator's ModulePackage path): `opm module init` scaffolds author-side modules, and library synth.Instance builds instances only in memory — explicitly refusing a debugValues fallback as "a frontend policy concern". Three decisions came from the user on the day: a new CLI command scaffolds a standalone instance package from an OCI module reference and tag (D1); the generated values.cue defaults to the module's debugValues, making init useful against the already-published fleet with no republish (D2); and #Module gains an optional field (working name initValues) carrying the author-intended init template, taking precedence over debugValues, whose testing contract stays unchanged (D3). Six Open Questions carried: field name/shape and #config conformance (OQ1), command surface and ref syntax (OQ2), empty-source behavior (OQ3), renderer home library-vs-cli (OQ4), init-time validation (OQ5), generated cue.mod pinning strategy (OQ6).
  - date: "2026-08-20"
    event: "Schemas convention migration: config gains core_schema: true — schemas/ is now formally the core-schema delta (target.cue + examples.cue + spec.md required from accepted); cue.mod refreshed to enhancements.opmodel.dev/0016/schemas, CUE v0.17.0. Structure/metadata only."
  - date: "2026-08-20"
    event: "Schemas convention follow-up: CLI request/report contracts moved from schemas/ to contracts/ (schemas/ keeps only the #ModuleInitSurface core delta); examples.cue and schemas/spec.md authored."
  - date: "2026-08-21"
    event: "Decision Kind gate retrofit: every decision annotated with Kind (contract | policy | scope) per the new template convention. Classification only — no decision content changed."
  - date: "2026-08-22"
    event: "Open Questions register extracted: the ## Open Questions section moved from 03-decisions.md to the new 07-questions.md under the seven-doc convention (single canonical location); in-entry location references reworded. Structure/metadata only."
  - date: "2026-08-23"
    event: 'Lifecycle reshape: implementation axis removed (delivery derives from the plans side), 04-graduation.md deleted, summary added.'
  - date: "2026-08-24"
    event: 'Open Questions walked: OQ1-OQ6 resolved by D4-D9 (initValues shape, module-init-mirrored surface, empty fallback, CLI-side renderer, no init vet, pinned deps); library out of affects; semver minor.'
  - date: "2026-08-24"
    event: 'Experiments 01-08 concluded on cert_manager/metallb. D4 revised (defaults resolve, optionals dropped), D5 revised (publish selector, skip no-core majors, all-or-nothing write), core floor recorded.'
  - date: "2026-08-24"
    event: 'Dependency on 0019 recorded: the cli slice lands after 0019 render-path changes (skew signal D7/D18, single build D9, derived render cue.mod D13); related and ordering constraint updated.'
  - date: "2026-08-30"
