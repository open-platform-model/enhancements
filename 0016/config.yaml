# Append-only timeline of milestones. Free-form `event` strings;
# `slice` + `semver` are optional structured fields for events that carry
# machine-readable detail.
history:
  - date: "2026-08-13"
    event: >-
      Drafted. Nothing turns a published module into the on-disk instance package everything downstream consumes
      (opm instance build/apply, the operator's ModulePackage path): `opm module init` scaffolds author-side
      modules, and library synth.Instance builds instances only in memory — explicitly refusing a debugValues
      fallback as "a frontend policy concern". Three decisions came from the user on the day: a new CLI command
      scaffolds a standalone instance package from an OCI module reference and tag (D1); the generated values.cue
      defaults to the module's debugValues, making init useful against the already-published fleet with no
      republish (D2); and #Module gains an optional field (working name initValues) carrying the author-intended
      init template, taking precedence over debugValues, whose testing contract stays unchanged (D3). Six Open
      Questions carried: field name/shape and #config conformance (OQ1), command surface and ref syntax (OQ2),
      empty-source behavior (OQ3), renderer home library-vs-cli (OQ4), init-time validation (OQ5), generated
      cue.mod pinning strategy (OQ6).
  - date: "2026-08-20"
    event: "Schemas convention migration: config gains core_schema: true — schemas/ is now formally the core-schema delta (target.cue + examples.cue + spec.md required from accepted); cue.mod refreshed to enhancements.opmodel.dev/0016/schemas, CUE v0.17.0. Structure/metadata only."
  - date: "2026-08-20"
    event: "Schemas convention follow-up: CLI request/report contracts moved from schemas/ to contracts/ (schemas/ keeps only the #ModuleInitSurface core delta); examples.cue and schemas/spec.md authored."
  - date: "2026-08-21"
    event: "Decision Kind gate retrofit: every decision annotated with Kind (contract | policy | scope) per the new template convention. Classification only — no decision content changed."
