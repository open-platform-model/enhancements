entry: "0028"
entry_hash: "bb463b364c1c6c6b1d0cd32688aa1ac75d0c20b4ba91e2d2cf6d6d4361584a08"
walked: "2026-10-04"
verdicts:
  - gate: feature
    verdict: pass
    evidence: "config.yaml summary: 'The operator is published as an OPM module from its own repository, and opm operator install deploys it as a CLI-owned ModuleInstance pulled from the registry.' 01-problem.md Current State: 'None of them is reachable from the install command.' and Gap 5: 'Any other version is fetched from GitHub release assets, which an air-gapped cluster cannot reach and a registry mirror cannot serve.'"
    reasoning: "Reworks an existing capability (operator install) into one OPM lacks: tuning that survives an upgrade, an inventory for the operator, and version selection from a registry or mirror. Not a chore: the user-visible install, upgrade and uninstall behaviour changes."
  - gate: contract
    verdict: pass
    evidence: "02-design.md Affected Surfaces: 'cli. `opm operator install` installs the module as a CLI-owned instance in two steps (D3), refusing before it changes anything (D3:R12)'; 'catalog. The workload security context gains a seccomp profile at pod and container level, and the role resource accepts a role with no subjects'; Schema / API Surface: 'The new consumer-facing surface is the operator module's `#config` (D5) ... once published they are part of the contract.' affects: opm-operator, cli, opm, opmodel.dev, catalog."
    reasoning: "Changes a CLI surface (install, upgrade, uninstall, version selection), a catalog authoring contract, a new published module path and #config compatibility surface, and operator behaviour (D4:R1). Five repos, so the single-repo clause does not apply."
  - gate: durability
    verdict: pass
    evidence: "Probe: 34 hits after the walk's fix (504c254). Classified: 22 are mandated markers (15 `(retired, 2026-10-04)` tombstones per the enhancements skill; 7 dated resolution notes on OQ3-OQ6, OQ9, OQ12, OQ13, the same shape as 0012 OQ2/OQ3 and 0026 OQ17); 5 sit inside Measured lists in 03-decisions.md (lines 194, 197, 229, 366, 405) as dated provenance; 3 are the term of art 'shipped pin' from RELEASING.md (02-design.md:73, 03-decisions.md:299, 06-operational.md:67); 2 are `read 2026-10-04` provenance in 06-operational.md:65 and OQ11; 2 are the dated owner choice on the 'previously adopted' alternatives at 03-decisions.md:57 and 111, the skill's draft-revision form. The read of 01..07 found three logbook sentences, now rewritten: 05-risks.md 'The install-driven migration is not yet measured end to end (04-graduation.md).' (dropped; 04-graduation.md carries the criterion); 05-risks.md 'Where the operator does not yet hold D4:R1, the only recovery is ...' (now 'An operator release that predates D4:R1 can still take itself over this way ...'); 03-decisions.md Summary 'so D3 and D9 gained requirements' (now 'D3 and D9 carry a requirement for each'); plus 02-design.md 'what D3 and D9 now require' and 'landed first' reworded."
    reasoning: "No sentence left in 01..07 reports progress or narrates a change of position outside the mandated Revised, Source, tombstone and previously-adopted forms. 01-problem.md's 'today' and the 06-operational coordination items describe the before-state and the transition, which stay true as statements of what the switch requires. 04-graduation.md's pre-acceptance wording is that file's purpose."
  - gate: rewrite
    verdict: pass
    evidence: "Probe returned 0 hits. Requirement lines checked by hand: the only code-styled tokens in `- Rn:` lines are `v0`, `1.0.0`, `#config`, `restricted`, `MAJOR.MINOR` and D3:R18 'named `opm-operator` in the namespace `opm-operator-system`', all observable from outside any repo's code. Remaining repo paths sit in Measured/Source provenance (e.g. 03-decisions.md D3 Measured '`cli/internal/operator/ready.go`, read 2026-10-04') or name current state to be verified (06-operational.md '`RELEASING.md`'s tier table ... name the embedded `install.yaml` and `PinnedOperatorVersion`'). 02-design.md: 'Field names and shapes are the operator repository's to choose in the implementing change'. OQ11 states the release-config constraint as 'needs both turned on, or an equivalent'. Closest call, D2: 'generated from what the controller's own code declares (its CRD schemas and its permission markers)'; its requirements R1 to R3 bind only equality with the controller's declarations."
    reasoning: "A from-scratch rewrite of opm-operator, cli or catalog_opm would still be bound by every requirement; the named paths only let a reader verify the before-state, and deleting them changes no obligation. D2's 'generated from' names the authority (the controller's code), not a file or tool."
  - gate: single-question
    verdict: pass
    evidence: "02-design.md opening: 'The operator becomes an ordinary OPM module, published from the operator's repository on a version train of its own, and `opm operator install` becomes an ordinary CLI apply of that module with one bootstrap step in front.' Decisions grouped by that premise: the published module (D1 release unit, D2 install-shape authority, D7 release position, D12 catalog prerequisites that D2's catalog path forces); installing it (D3 bootstrap, D5 tuning as values, D6 what stays outside, D10 version refusals, D11 render platform); its lifecycle on a cluster (D4 CLI-owned forever, D8 migration from a manifest, D9 upgrade and uninstall)."
    reasoning: "One question: how OPM's own controller is installed as an OPM module. D12 is the one decision outside the CLI and operator, and it exists only because D2 renders through the catalog (its Decision opens 'Two catalog changes are prerequisites of the operator module, because D2 renders the controller through the catalog'); ownership transfer was removed to a separate design, leaving no second question."
