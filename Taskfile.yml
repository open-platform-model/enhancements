# Tasks for OPM enhancements workflow.
#
# The task names (vet, new, accept, deliver, index, fresh, links, ...) are
# one-line calls to `enh`, the Go program in tools/enh/ (design part two,
# section 3). They work on the entries in openspec/changes/. Run from the
# enhancements/ directory, or via the workspace-root include
# (`task enhancements:<name>`).
#
# Deps: go (for enh), cue; the openspec CLI (1.14.1) for the tasks that run
# it; gh for `ideas`. Same toolchain as every other OPM Taskfile.
version: "3"

silent: true

env:
  # Canonical developer registry mapping (workspace Registry Policy rule 1)
  # so the evidence modules of an entry may import opmodel.dev/core@vN — reads resolve
  # from GHCR anonymously and cache locally. An ambient CUE_REGISTRY wins.
  CUE_REGISTRY:
    sh: 'echo "${CUE_REGISTRY:-opmodel.dev=ghcr.io/open-platform-model,testing.opmodel.dev=ghcr.io/open-platform-model,registry.cue.works}"'

tasks:
  default:
    desc: Show the most useful commands
    cmds:
      - |
        cat <<'EOF'
        Every command below is a one-line call to `enh` (tools/enh/, `go run`). `enh help` lists its flags.
        Entries live in openspec/changes/; the ten closed old-layout entries are in archive/.

        Common tasks:
          task check                             — the gate: vet (with --cue, ENH_FINAL=1), links, fresh
          task test                              — the checker's own tests: go test of tools/enh and tests/schema (CI job `test`)
          task vet [ID=0013] [MODE=accept|deliver] [BASE=origin/main] — check the entries
          task new SLUG=foo TITLE="Foo Bar" SUMMARY="OPM gains X." CATEGORY=tooling AFFECTS=core,cli
          task seed:new CAP=registration-acceptance
          task correction:new SLUG=owner-value [CAPS=instance-ownership,platform-reconciliation]
          task accept ID=0013 [BASE=origin/main] — print the sample; then CONFIRM=1 task accept ID=0013
          task resample ID=0013                  — same for an accepted entry whose text changed
          task deliver ID=0013 [BASE=origin/main] — check, archive, index, commit
          task reject|withdraw ID=0013 REASON="…"
          task supersede ID=0013 BY=0033 REASON="…"
          task tick ID=0013 LINE=1.1 REF=change-name
          task index                             — write README.md per entry, INDEX.md and GRAPH.md
          task fresh                             — fail when a generated file is stale
          task links                             — fail on a broken link between entries
          task list | show ID=0013 | questions ID=0013 | stale ID=0013 | history REQ="Name"
          task reconcile                         — Delivers lines against ticks (needs sibling checkouts)
          task cite-lint                         — decision numbers and lone ids in Go and CUE comments
          task specs-rule [BASE=ref]             — CI rule for openspec/specs/ (needs openspec 1.14.1)
          task ideas                             — open idea issues on GitHub (needs gh)
          task docs:bundle:check                 — build and lint the enhancements docs bundle (opm-docs)
        EOF

  # The tasks below are one-line calls to `enh` (design part two, section 3).
  # Values of the command line are shell-quoted, so a value with spaces or
  # quotes stays one argument. CONFIRM=1 is read by `enh` itself.
  vet:
    desc: "Check the entries in openspec/changes with enh vet --cue, final (ID, MODE and BASE optional)"
    summary: |
      Always runs with `--cue` (V29: cue vet of each evidence module, as
      warnings) and ENH_FINAL=1 (V30 is an error, never a warning).
      Usage:
        task vet                         every entry, draft mode
        task vet ID=0013 MODE=accept
        task vet MODE=deliver ID=0013
        task vet BASE=origin/main        V7, V27 and V31 compare with this ref
      MODE is draft (default), accept or deliver. BASE defaults to origin/main
      when that ref exists, else main. Extra flags of the enh command go after
      `--`. See `enh help vet`.
    env:
      ENH_FINAL: "1"
    cmds:
      - go -C tools/enh run . vet --cue {{if .MODE}}--mode {{.MODE | shellQuote}} {{end}}{{if .BASE}}--base {{.BASE | shellQuote}} {{end}}{{if .ID}}{{.ID | shellQuote}} {{end}}{{.CLI_ARGS}}

  new:
    desc: "Make a draft entry: id, openspec change, config.yaml, index"
    summary: |
      Usage:
        task new SLUG=my-feature TITLE="My Feature" SUMMARY="OPM gains X." CATEGORY=tooling AFFECTS=core,cli
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . new {{.SLUG | default "" | shellQuote}} {{.TITLE | default "" | shellQuote}} {{.SUMMARY | default "" | shellQuote}} {{.CATEGORY | default "" | shellQuote}} {{.AFFECTS | default "" | shellQuote}} {{.CLI_ARGS}}

  seed:new:
    desc: "Make the seed change seed-CAP"
    summary: |
      Usage:
        task seed:new CAP=registration-acceptance
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . seed:new {{.CAP | default "" | shellQuote}} {{.CLI_ARGS}}

  correction:new:
    desc: "Make the correction change correction-SLUG"
    summary: |
      Usage:
        task correction:new SLUG=owner-value
        task correction:new SLUG=owner-value CAPS=instance-ownership,platform-reconciliation
      SLUG names the fix. Each capability in CAPS must exist in openspec/specs/.
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . correction:new {{.SLUG | default "" | shellQuote}} {{if .CAPS}}{{.CAPS | shellQuote}}{{end}} {{.CLI_ARGS}}

  accept:
    desc: "Accept a draft, seed or correction: print the sample (CONFIRM=1 writes the record)"
    summary: |
      Usage:
        task accept ID=0013
        CONFIRM=1 task accept ID=0013
        task accept ID=seed-registration-acceptance
        task accept ID=correction-owner-value
        task accept ID=0013 BASE=origin/main
      BASE is the branch the PR starts from (default origin/main when that ref
      exists, else main). V7, V27 and V31 compare with it. Extra flags of the
      enh command go after `--`. See `enh help accept`.
    cmds:
      - go -C tools/enh run . accept {{if .BASE}}--base {{.BASE | shellQuote}} {{end}}{{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  resample:
    desc: "Re-sample an accepted entry (CONFIRM=1 rewrites accepted)"
    summary: |
      Usage:
        task resample ID=0013
        CONFIRM=1 task resample ID=0013
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . resample {{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  deliver:
    desc: "Deliver an accepted entry, a seed or a correction: check, archive, index, commit"
    summary: |
      Usage:
        task deliver ID=0013
        task deliver ID=0013 BASE=origin/main
      BASE is the branch the PR starts from (default origin/main when that ref
      exists, else main). V7, V27 and V31 compare with it. Extra flags of the
      enh command go after `--`. See `enh help deliver`.
    cmds:
      - go -C tools/enh run . deliver {{if .BASE}}--base {{.BASE | shellQuote}} {{end}}{{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  reject:
    desc: "Reject a draft with a reason"
    summary: |
      Usage:
        task reject ID=0013 REASON="why"
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . reject {{.ID | default "" | shellQuote}} {{.REASON | default "" | shellQuote}} {{.CLI_ARGS}}

  withdraw:
    desc: "Withdraw a draft or accepted entry with a reason"
    summary: |
      Usage:
        task withdraw ID=0013 REASON="why"
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . withdraw {{.ID | default "" | shellQuote}} {{.REASON | default "" | shellQuote}} {{.CLI_ARGS}}

  supersede:
    desc: "Supersede an entry by one or more others"
    summary: |
      Usage:
        task supersede ID=0013 BY=0033 REASON="why"
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . supersede {{.ID | default "" | shellQuote}} {{.BY | default "" | shellQuote}} {{.REASON | default "" | shellQuote}} {{.CLI_ARGS}}

  tick:
    desc: "Tick a task line and append (REF)"
    summary: |
      Usage:
        task tick ID=0013 LINE=1.1 REF=change-name
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . tick {{.ID | default "" | shellQuote}} {{.LINE | default "" | shellQuote}} {{.REF | default "" | shellQuote}} {{.CLI_ARGS}}

  index:
    desc: "Write README.md of each entry, INDEX.md and GRAPH.md"
    summary: |
      Usage:
        task index
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . index {{.CLI_ARGS}}

  fresh:
    desc: "Fail when a generated file is missing or stale"
    summary: |
      Usage:
        task fresh
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . fresh {{.CLI_ARGS}}

  history:
    desc: "Print the history of a requirement"
    summary: |
      Usage:
        task history REQ="A name"
        task history REQ="A name" CAP=capability
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . history {{.REQ | default "" | shellQuote}} {{if .CAP}}{{.CAP | shellQuote}}{{end}} {{.CLI_ARGS}}

  stale:
    desc: "Print the stale-base flags of an accepted entry"
    summary: |
      Usage:
        task stale ID=0013
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . stale {{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  links:
    desc: "Check the links between entries"
    summary: |
      Usage:
        task links
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . links {{.CLI_ARGS}}

  reconcile:
    desc: "Compare Delivers lines with ticks (needs sibling checkouts)"
    summary: |
      Usage:
        task reconcile
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . reconcile --workspace "{{.TASKFILE_DIR}}/.." {{.CLI_ARGS}}

  cite-lint:
    desc: "Lint decision numbers and lone ids in Go and CUE comments"
    summary: |
      Usage:
        task cite-lint
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . cite-lint --root "{{.TASKFILE_DIR}}" {{.CLI_ARGS}}

  list:
    desc: "List the live entries"
    summary: |
      Usage:
        task list
        task list -- --archived
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . list {{.CLI_ARGS}}

  show:
    desc: "Print the facts of one entry"
    summary: |
      Usage:
        task show ID=0013
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . show {{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  questions:
    desc: "Print the open questions of one entry"
    summary: |
      Usage:
        task questions ID=0013
      Extra flags of the enh command go after `--`. See `enh help`.
    cmds:
      - go -C tools/enh run . questions {{.ID | default "" | shellQuote}} {{.CLI_ARGS}}

  specs-rule:
    desc: "Check that a change to openspec/specs/ is one delivery, one seed, one correction or a Purpose correction"
    summary: |
      Usage:
        task specs-rule                  against origin/main
        task specs-rule BASE=some-ref
      Replays `openspec archive` (the pinned 1.14.1) in a scratch copy, so
      it needs that CLI and the full git history. Extra flags of the enh
      command go after `--`. See `enh help specs-rule`.
    cmds:
      - go -C tools/enh run . specs-rule --base {{.BASE | default "origin/main" | shellQuote}} {{.CLI_ARGS}}

  check:
    desc: "The gate of this repo: enh vet (with --cue and ENH_FINAL=1), links and fresh"
    summary: |
      Runs, in order: `task vet`, `task links` and `task fresh`.
      Not in this task: `specs-rule` (it needs the PR base and the OpenSpec
      CLI; CI runs it).
    cmds:
      - task: vet
      - task: links
      - task: fresh

  test:
    desc: "The checker's own tests: go test of tools/enh, then the schema fixtures"
    summary: |
      Runs `go -C tools/enh test ./...` and `bash tests/schema/run.sh`.
      The specsrule tests skip without the pinned openspec CLI (1.14.1) on
      PATH, so install it for a full run; CI does. Not part of `task check`,
      which stays the gate of the entries (about 30 s because of the cue
      vet); CI runs this task as its own job.
    cmds:
      - go -C tools/enh test ./...
      - bash tests/schema/run.sh

  ideas:
    desc: List open idea issues (label `idea` on GitHub; the pre-entry intake)
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: "task ideas needs the GitHub CLI (gh)"
    cmds:
      - gh issue list --label idea --state open

  ## Docs bundle
  #
  # docs-kit.cue declares one section bundle, enhancements: every entry, live
  # and archived, plus INDEX.md and GRAPH.md, as opmodel.dev's Enhancements
  # section (docs-kit docs/contracts.md C21). CI builds, signs and publishes
  # it through docs-kit's publish.yml (docs.yml). These tasks run the same
  # opm-docs release locally. The release is pinned in .opm-docs-version and
  # in every publish.yml ref, and docs:bundle:check refuses the two
  # disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the enhancements section bundle of the work tree into out/enhancements/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project enhancements --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the enhancements section bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project enhancements
