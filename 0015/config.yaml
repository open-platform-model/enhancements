history:
  - date: "2026-08-05"
    event: >
      Drafted from a design conversation grounded in three measurements taken the same day.
      `core/src/catalog.cue` carries exactly ONE member map, `#transformers`, and
      `library/opm/materialize/index.go:39-41` skips any catalog build without one — so a
      contract with no adapter is absent from the materialized world, which is precisely the
      state 0010 D37's `fulfilment: "provider"` creates on purpose. `compile/match.go:344-360`
      is SUBSET containment, not equality, so a more-specific transformer never displaces a
      less-specific one; both pair and both render, and 0010 D32's guard does not reach the
      case because it fires only for `fulfilment: "provider"` contracts. And the real
      discriminator across the 8 transformers sharing `catalog_opm`'s `#ContainerResource`
      bucket is `requiredLabels` (`daemonset_transformer.cue:27-29`), not the resource/trait
      set — which is what makes 0010 D36's `matchLabels` the lever for provider classes rather
      than a new matcher concept. Four decisions locked: D1 (explicit contract maps), D2
      (classes, amending 0010 D37), D3 (RBAC-gated registration CR), D4 (no contract/adapter
      packaging split, decided now because riding 0010's FQN break is nearly free and a
      standalone break later is not). Six Open Questions carried.
  - date: "2026-08-19"
    event: "Enhancement 0019 rescoped to carry the single-build render pipeline as its Phase B (its D9: one CUE build per render; D5: registry entries import their catalog and embed the transformer map, version scalar removed; D6: the operator generates the platform package; D8: ADR-002 superseded, store.go's held slot removed; D10: matching moves into the build). This entry's concept layer (D1-D4: contract maps, classes, TransformerRegistration, packaging) is untouched, but its library and operator integration surface is written against code 0019 deletes: the match.go line anchors, the materialize-based inventory, and the store re-keying in OQ6 all need re-baselining, and OQ6's blast-radius question largely dissolves under 0019 D8 (no held platform to invalidate). 0019's OQ9/OQ10 (what regenerates the platform package when a registration is accepted, and where a conflicting registration's requirements are refused) are deferred TO this entry. Re-baseline is triggered when 0019 reaches accepted."
