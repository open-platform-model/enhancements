# Structured slice plan for this enhancement. Optional — see
# 0000/README.md ## Slice Plan for the field reference and the
# workflow this feeds (task vet, task plan:graph, task plan:ready,
# task slice:seed). Delete this file if the enhancement never
# grows past one slice.
#
# Structural backing for 06-operational.md ## Cross-Repo Coordination,
# which keeps the narrative rationale. That order is strict because each
# step consumes a published artifact from the one before.
#
# ---------------------------------------------------------------------
# THE TWO PHASES ARE A FIELD, NOT A CONVENTION
# ---------------------------------------------------------------------
# Every slice carries `phase: implementation | migration` (enhancements/
# schema.cue #SlicePhase), and `task vet` enforces the ordering as an edge
# rule: no implementation slice may depend on a migration slice. So the
# split is checked rather than described, and this block no longer
# enumerates which slices fall where — read the field, or `task plan:graph`.
#
# What the field cannot record is WHY the seam falls where it does. The
# boundary here is the first `opm catalog publish` of a conforming
# catalog; implementation is dependency-closed behind it.
#
# NO SLICE STRADDLES THE BOUNDARY. That is why catalogs-identity-authoring
# and modules-identity-authoring exist as separate slices from the two
# republishes: authoring the CUE is a source change and reviewable as one;
# pushing the bytes is irreversible under 0011 D10. An earlier revision of
# this plan bundled each pair into one slice, which hid the seam and made
# the split unstateable.
#
# CLUSTERS AND ENVIRONMENTS ARE OUT OF SCOPE (2026-08-05, author's call).
# These entries change what a published artifact IS; moving a running
# deployment onto it is separate work, handled afterwards and privately.
# Named here so it is not rediscovered as a gap:
#   - the live-instance relabel pass and its positive check
#     (04-graduation.md accepted->implemented gate)
#   - the workload-type cutover on already-deployed objects
#     (04-graduation.md gate; see 05-risks.md for why it is a recreate)
#   - rewriting a live Platform's subscriptions from `range` to the D14
#     scalar `version`
#   - the deployment repositories' own v0 -> v1 migration
#   - the Zot registry cutover, which gates 0011 D10 (tag immutability)
#     and D11 (authenticated writes) and has no owner or date
#
# 0011 D17's registry cleanup was on that list until 2026-08-05 and has
# MOVED: items 2-4 are now 0011's own `registry-cleanup` slice, since its
# 04-graduation.md required them while both plans disowned them. Item 1
# (legacy v1alpha1) stays out, gated on the v0 -> v1 fleet migration.
#
# A `releases-repin` slice was cancelled on 2026-08-05 and then DELETED
# outright, together with the `releases` entry in config.yaml `affects`.
# It targeted a deployment repository outside the workspace, which is
# private and does not belong in a public design document; nothing cited
# it in depends_on, so the tombstone the slicing convention preserves was
# protecting no reference. Its finding survives in 06-operational.md's
# step 7: 0011 D13 moves no coordinate, so there is nothing to re-pin.
#
# ---------------------------------------------------------------------
# THE CORE MAJOR BUMP HAPPENED — THIS BLOCK REVERSES ITS OWN OLD HEADING
# ---------------------------------------------------------------------
# This block read "NO CORE MAJOR BUMP" until 2026-08-09, and it was correct
# when written on 2026-08-05: `opmodel.dev/core@v1` had published only
# v1.0.0-alpha.1/.2/.3 and no stable v1.0.0, so the compatibility promise
# had not started and the break could have landed on the v1 line with the
# module path unmoved. It did not. The identity reshape moved the module to
# `opmodel.dev/core@v2` on 2026-08-07, and the v1 line is retired at
# v1.1.0-alpha.1.
#
# WHAT THAT CHANGES FOR EVERY DOWNSTREAM SLICE — and it is why the stale
# text was dangerous rather than merely out of date, because it understated
# the cost of work nobody has started yet: retarget is an IMPORT REWRITE,
# not a dependency bump. Every `import "opmodel.dev/core@v1"` becomes the v2
# line alongside the cue.mod edit, and `task update-deps` CANNOT do it —
# resolving a new major is not the same operation as raising a version
# within one. Rollback is the same rewrite in reverse, to v1.1.0-alpha.1,
# and it stays available to each consumer until that consumer's own
# retarget merges. Both majors stay resolvable indefinitely, because a
# published tag names fixed bytes permanently — the old line does not rot,
# it only gets more expensive to return to.
#
# THE REWRITE IS OWNED BY FIVE SLICES, NOT ONE, and it was named in only one
# of them until 2026-08-09. Measured that day: 213 files across SEVEN repos
# carry `opmodel.dev/core@v1` — library 22, cli 17, opm-operator 16,
# catalog_opm 61, catalog_kubernetes 56, catalog_opm_experimental 9,
# modules 32 — as real `import` statements plus a cue.mod dep in each (the
# catalogs pin v1.1.0-alpha.1, the Go repos v1.0.0-alpha.1, modules
# v1.0.0-alpha.3). Only library-core-retarget said so. The rewrite is now
# named in the concern of every slice that has to perform it:
# library-core-retarget, cli-coordinate-adoption, operator-library-retarget,
# catalogs-identity-authoring and modules-identity-authoring. It is stated
# per-slice rather than only here because an implementer reads their own
# concern via `task plan:ready`, not this header.
#
# `releases/` is NOT in that count and is NOT checked out in this workspace,
# so its exposure is unmeasured rather than known to be zero. The deleted
# `releases-repin` slice was cancelled on the ground that 0011 D13 moves no
# coordinate; a MAJOR move is a different question, and nothing has re-asked
# it since. Re-measure before assuming the cancellation still holds.
#
# THE CORE SLICES DID NOT SHIP AS ONE RELEASE. This block also read "THE
# CORE SLICES ARE ONE RELEASE, NOT THREE" and named core-alpha-release as
# the single cut point 06-operational.md's "nothing else can move until this
# tag exists" describes. That is not what happened. The four shipped across
# four tags on the v2 line:
#
#   v2.0.0-alpha.1   core-identity-shape, plus the major move itself
#   v2.0.0-alpha.2   core-primitive-keying
#   v2.0.0-alpha.3   core-platform-and-match
#   v2.0.0-alpha.4   0011:core-identity-package  <- the only complete tag
#
# SO THREE OF THOSE FOUR TAGS ARE PARTIAL AND RESOLVABLE, which is worse
# than no tag at all: nothing in the registry distinguishes a partial one
# from a complete one. alpha.3 is the most hazardous of the three, because
# it carries three of the four slices — it compiles far enough to look
# right and fails only on the identity package. ONLY v2.0.0-alpha.4 IS A
# RETARGET TARGET.
#
# THE DEPENDENCY STRUCTURE THE BLOCK DESCRIBED IS UNCHANGED and still
# governs. 0011:core-identity-package is the fourth core slice and sits
# INSIDE this chain rather than beside it (2026-08-05): it depends on
# core-identity-shape, because #IdentityPackage is typed out of
# #ModulePathType, #VersionType and #ArtifactRef. So core-identity-shape is
# the single root of the whole core cluster across both entries, and every
# downstream slice still depends on core-alpha-release. What changed is only
# that core-alpha-release verified and documented the cut instead of being
# it. 0011's plan carries the measurement.
#
# ---------------------------------------------------------------------
# CROSS-ENHANCEMENT EDGES TO 0011
# ---------------------------------------------------------------------
# These are ORDERING edges, not blocking ones — neither entry blocks the
# other at the entry level (0011 D17 dissolved the joint window). Four run
# OUTBOUND from slices declared here; a fifth runs inbound and is declared
# in 0011's plan (core-identity-package -> core-identity-shape, above).
#   core-alpha-release          -> 0011:core-identity-package
#     #IdentityPackage ships in `core` (0011 D21) and belongs in the same
#     alpha the catalogs and the fleet retarget to. That alpha is
#     v2.0.0-alpha.4, and #IdentityPackage is what it added — which is why
#     no earlier tag on the line is a retarget target.
#   library-acquire-and-subscription -> 0011:library-compat-comparator
#     D14 DELETES materialize/filter.go and 0011's predecessor selection
#     reuses filter.go:112's highestStable. A move, so it moves first.
#     (The slice was library-subscription-collapse until the 2026-08-10
#     consolidation folded it together with library-identity-read-checks.)
#   catalogs-republish          -> 0011:catalogs-publish-cutover
#   modules-fleet-republish     -> 0011:modules-publish-cutover
#     The republishes go through `opm catalog publish` / `opm module
#     publish`, so the CI cutover must already be in place. The mirror
#     edges are declared in 0011's plan: both cutover slices point a
#     release pipeline at a command that REFUSES a tree with no conformant
#     identity package (0011 D21 refusal 10, D4), so each depends on the
#     authoring slice here that creates those files.
slices:
  - id: core-identity-shape
    repo: core
    phase: implementation
    concern: >
      Module, instance and catalog identity: #ModulePathType gains @vN and
      underscores, #PackagePathType splits off, fqn == modulePath,
      registryPath, snake name, instance fqn/uuid.
    depends_on: []
    decisions: [D1, D2, D3, D6, D8, D41, D43, D45]
    status: done
    openspec_ref: "core/core-identity-shape"

  - id: core-primitive-keying
    repo: core
    phase: implementation
    concern: >
      Contract keys split from implementation keys: #ContractFQNType /
      #ImplFQNType, #APIVersionType, apiVersion! and catalogVersion! on the
      primitives, authored fqn, primitive-versus-adapter.
    depends_on:
      - core-identity-shape
    decisions: [D4, D21, D25, D33, D34, D44]
    status: done
    openspec_ref: "core/core-primitive-keying"

  - id: core-platform-and-match
    repo: core
    phase: implementation
    concern: >
      Platform and match surface: #SubscriptionFilter deleted for a scalar
      version, matchLabels on the four kinds with #LabelWorkloadType deleted,
      fulfilment on #Resource and #Trait, and D28's #Trait.optional plus gate.
    depends_on:
      - core-identity-shape
    decisions: [D14, D28, D32, D36, D37]
    status: done
    openspec_ref: "core/core-platform-and-match"

  - id: core-alpha-release
    repo: core
    phase: implementation
    concern: >
      SPEC.md coherence pass across the four schema slices, examples re-vetted,
      the alpha carrying all four published at v2.0.0-alpha.4. NOT THE SINGLE
      CUT POINT — the four shipped across alpha.1-alpha.4; see history.
    depends_on:
      - core-identity-shape
      - core-primitive-keying
      - core-platform-and-match
      - "0011:core-identity-package"
    status: done
    openspec_ref: "core/core-alpha-release"

  - id: library-core-retarget
    repo: library
    phase: implementation
    concern: >
      Import rewrite to the core v2 line at v2.0.0-alpha.4 — a MAJOR crossing,
      not a re-pin, so update-deps cannot do it. Fix compile breakage,
      regenerate testdata incl. the D42 web_app site; the v0.6.0-pinned site
      stays. No behaviour change.
    depends_on:
      - core-alpha-release
      - catalogs-identity-authoring
    decisions: [D42]
    status: in-progress

  - id: library-acquire-and-subscription
    repo: library
    phase: implementation
    concern: >
      Identity verified where artifacts are read (modulePath vs fetched
      coordinate, version vs tag), and D14 deletes materialize/filter.go — no
      highestStable, no constraint solving; one major-agreement check survives
      beside the subscription.
    depends_on:
      - library-core-retarget
      - "0011:library-compat-comparator"
    decisions: [D9, D11, D14, D41]
    status: planned

  - id: library-matching
    repo: library
    phase: implementation
    concern: >
      The match rung becomes load-bearing: provenance denylist, contract-key
      diagnostics, unresolved demand errors, single-provider guard; matching
      reads matchLabels at the four measured sites; kube-aware FQN comparator;
      own-graph test.
    depends_on:
      - library-core-retarget
    decisions: [D4, D10, D26, D28, D30, D32, D34, D36, D37]
    status: planned

  - id: docs-catalog-contract
    repo: opmodel.dev
    phase: implementation
    concern: >
      Publish the catalog-author contract: the additive-only rule keyed to
      level, that OPM verifies it only for catalogs published through `opm
      catalog publish`, and the three version-shaped values.
    depends_on:
      - core-alpha-release
    decisions: [D4, D27, D34, D35]
    status: planned

  - id: cli-coordinate-adoption
    repo: cli
    phase: implementation
    concern: >
      Rewrite core imports to v2, retarget to the new library, delete the
      address-composition helpers, write the resolved coordinate into
      spec.module.{path,version}. Plus D19's local-module.cue warning and the
      two D42 test import sites.
    depends_on:
      - library-core-retarget
    decisions: [D19, D42]
    status: planned

  - id: operator-library-retarget
    repo: opm-operator
    phase: implementation
    concern: >
      Rewrite core imports to v2 and retarget to the new library. No feature
      code, no adoption code — D18 rejected an operator-side tolerance window.
      Three D42 blueprint import sites in test/fixtures/modules move with it.
    depends_on:
      - library-core-retarget
    decisions: [D18, D42]
    status: planned

  - id: catalogs-identity-authoring
    repo: catalog
    phase: implementation
    concern: >
      Rewrite core imports to v2; commit identity/identity.cue (D5) across the
      three catalogs, re-key every leaf (apiVersion, catalogVersion, fqn),
      flatten blueprints, move matching to matchLabels, drop the stamping
      task. Source only.
    depends_on:
      - core-alpha-release
    decisions: [D5, D42]
    status: in-progress

  - id: modules-identity-authoring
    repo: modules
    phase: implementation
    concern: >
      Rewrite core imports to v2. Add identity/identity.cue per module and the
      metadata wiring, plus the twelve D42 blueprint import moves. No hyphen
      renames — none exist, measured 2026-08-05. Source only.
    depends_on:
      - catalogs-identity-authoring
    decisions: [D2, D42, 0011:D12]
    status: planned

  - id: catalogs-republish
    repo: catalog
    phase: migration
    concern: >
      Cut releases of catalog_opm, catalog_kubernetes and
      catalog_opm_experimental through `opm catalog publish`. The first act
      that changes a published artifact.
    depends_on:
      - catalogs-identity-authoring
      - "0011:catalogs-publish-cutover"
    status: planned

  - id: modules-fleet-republish
    repo: modules
    phase: migration
    concern: >
      Republish the fleet through `opm module publish` against the released
      catalogs. The only fleet republish in the 0010/0011 pair.
    depends_on:
      - catalogs-republish
      - modules-identity-authoring
      - "0011:modules-publish-cutover"
    decisions: [0011:D17]
    status: planned

# Decisions this entry implements in no slice, each with the reason. Surfaced
# by `task decisions:uncovered`, which is quiet about them once they are here.
# See schema.cue #SlicePlan.unsliced: this is a claim on the record that the
# decision needs no work, not a suppression list.
unsliced:
  D7: >
    Its holding (a module's identity file writes metadata directly, declaring no
    top-level field) is REVERSED by the decision now stated at D2, which gives
    modules a catalog-style identity subpackage. What survives is the measurement
    D2 leans on — a top-level Version beside the embedded #Module fails
    re-unification into the closed #ModuleInstance.#module slot — which is
    evidence, not work.
  D16: >
    A decision NOT to add a field. #Catalog gains no `name`, so there is nothing
    to implement; the same reader-set argument D33 uses to delete #definitionName.
