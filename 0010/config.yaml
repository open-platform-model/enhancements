ng source because the naive expectation was wrong twice: a breaking commit on 1.0.0-alpha.N absorbs into 1.0.0-alpha.N+1 (pre-GA major absorb), and on 1.x.0-alpha with minor>0 it produces a STABLE 2.0.0 — so the first v2 cut is forced to 2.0.0-alpha.1 via release-as (to be removed after that release; every later bump then absorbs into 2.0.0-alpha.N+1, pinning main to the v2 alpha line). Each repo also carries a protected v1 maintenance branch with release-please targeting it under always-bump-patch, so existing v1 consumers keep a release train no commit type can move across the major."
