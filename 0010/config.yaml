    event: "`plan.yaml` gains a structured `decisions` field and the repo gains `task decisions:uncovered`. MEASURED FIRST, because the trigger was a cap firing and the useful question was whether the cap was wrong: across the 27 slices in the two entries with plans, the median `concern` sat at 205 of its 240-rune limit, 15 of 27 were within 40 runes, and up to 41 runes went on an inline decision-citation tail (0011's cli-publish-pipeline, 11 decisions). So the cap was not being abused — it had no headroom, and the pressure was ONE-DIRECTIONAL, since a slice's citation list accretes while its description does not. Nothing parsed those citations. RAISING THE CAP WAS REJECTED as treating the symptom and re-arming it later; the field was carrying two things, a one-line description and a decision index, and only the first is what the thinness rule is about. THE COVERAGE INVERSE IS THE REAL PRIZE: `task decisions:uncovered` reports a decision NO SLICE CARRIES, counting citations across entries so 0011's cli-catalog-member-gate is credited with 0010's D17, D21, D25 and D42. That is the audit 0010's own 2026-08-05 event describes doing BY HAND, which found seven pieces of decided work with no slice — D36's library half being real code whose absence would have shipped a schema whose matching read an emptied field. `task vet` checks every cited number resolves and refuses a decision both carried and listed unsliced; coverage itself is deliberately NOT a gate, since an entry's design is legitimately allowed to run ahead of its plan. THE CHECK PAID FOR ITSELF ON FIRST RUN, twice. It rejected the migration's own output — cli-catalog-member-gate's `(0010 D17, D21, D25, D42)` had been read as one cross-entry ref and three local ones, when 0011 D22 says in its own text that all four are 0010's. And it found two genuine gaps: D3 (the catalog's concrete version and the removed `0.0.0-dev` default) was implemented by core-identity-shape and cited by nothing, and D40's surviving identity-package half ships in 0011:core-identity-package and was likewise uncited. Both now carried. SEVEN DECISIONS ARE DELIBERATELY UNSLICED and say why, in a new top-level `unsliced` map: 0010's D2, D7, D16 and D23 (three reversed or superseded by D38, one a decision NOT to add a field) and 0011's D5, D10 and D14 (a reversed namespace half, a registry property gated on the ownerless Zot cutover, and a forward-looking reservation nobody publishes to). Tombstoned numbers need no entry — they are excluded automatically, being retired rather than unimplemented. Both entries now report zero uncovered."

