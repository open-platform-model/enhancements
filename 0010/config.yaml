  - date: "2026-08-01"
    event: "experiments/05-d27-compat-gate MOVED to 0011/experiments/03-d27-compat-gate. It was authored here while D36 and D37 were being settled, but it measures whether 0011 D9's compatibility gate is implementable, and nothing in this entry cited it — no decision, no design-doc reference, only the experiments index row, which is the state the enhancement-experiments skill names as an anti-pattern. D27 delegates publish-side enforcement to 0011 D9 explicitly, and 0011 had asked for the measurement by name in two places. The outcome matters to this entry even though the evidence lives elsewhere: D9 recorded that a gate which could not be built as described would send D27 back to publisher discipline, and the measurement shows it CAN be built — by a field-wise walk rather than by cue.Value.Subsume, which fails in both directions. D27 therefore stands unchanged. No decision in this entry is affected and no cross-reference was added to D27, which was already sound; a reader looking for the feasibility evidence will be in 0011, where the gate is specified."
  - date: "2026-08-01"
    event: "04-graduation.md and 06-operational.md corrected against the decision log. No decision changes; every edit brings a narrative document into line with a decision already recorded, and each correction below was a statement a reader could have acted on wrongly. THREE SELF-CONTRADICTIONS INSIDE 06-operational: Semver Impact said `#SubscriptionFilter` GROWS A FIELD while the Deprecation table three sections down said it is deleted entire (D14 deletes it; #Subscription carries a required scalar version); Cross-Repo step 2 said D14 COLLAPSES materialize/filter.go from resolution to a single check while the same table said the file is deleted (04-graduation is explicit — deleted rather than reduced); and the Migration Inventory's finding 1 said the operator resolves through CUE's DEFAULT CENTRAL REGISTRY while a subsection eighty lines below said it resolves against ghcr.io/open-platform-model via a compiled-in --registry default. THREE STALE OQ CITATIONS, all pointing at questions closed by decisions in this entry: Rollback cited OQ4 for the adoption path when D18 fixed its shape (relabel in place, never recreate, because no ownerReferences means a recreate garbage-collects nothing); Cross-Repo step 5 said opm-operator is where the OQ4 adoption path ships IF IT LANDS AS OPERATOR TOLERANCE, a candidate D18 rejected outright, so the step now reads no feature change of any kind; and the closing paragraph said which transformer bytes run is OQ11's subject, which inverts the current design — OQ11 is resolved by D14 and a catalog release moves nothing until someone edits version: in the platform's own source, the inertness 04-graduation makes an implemented gate. 04-graduation carried the same class of defect in its own OQ bullet, which ended `OQ4 is a runbook question and OQ8 is deferred by agreement` — both superseded, OQ4 by D18 and OQ8 by D19, with OQ7 dissolved by D14 and OQ10 the sole deferral; the bullet now states each closure and says the earlier sentence was superseded rather than silently dropping it. THE INVENTORY NUMBERS were corrected to the figures the 2026-07-31 GHCR read established and 04-graduation already carried: TEN of twelve live instances across EIGHT of ten modules absent from the workspace registry, not six of twelve, and the collection gap that gated SCHEDULING the migration is closed by data — GHCR enumerates completely at 53 packages with every live coordinate present at its deployed version. The two-registry finding SURVIVES (74 local repositories against 53 GHCR packages, neither a subset nor a superset) and now constrains the runbook instead of blocking it. Findings 3 and 4 were demoted in place to match: opm-platform is absent from GHCR so it is dev-registry hygiene rather than a wrong input, though the design question behind it stays open as 0011 OQ9; and radarr/sabnzbd/sonarr are published on GHCR at exactly their deployed v1.0.2, leaving only cdi and snapshot_controller sourced-but-unpublished-anywhere. TWO OMISSIONS FILLED, both decisions that landed after 06-operational was last touched. D36 appeared nowhere: matchLabels, the #LabelWorkloadType deletion and the opm.opmodel.dev/workload-type rename are now in Semver Impact and the Deprecation table, and the consequence an operator meets without reading any CUE is called out on its own — rendered objects stop carrying core.opmodel.dev/workload-type, which is a LABEL REMOVAL ON EVERY LIVE WORKLOAD, so anything selecting on it must be re-pointed first. D32/D37's two-providers-for-one-contract error was missing from Observability, which also said `three new diagnostics` above a list of five; it is now five with the count fixed and the note that two of them have no predecessor. STRUCTURAL: the `Which registry the migration republishes into` subsection sat BETWEEN findings 2 and 3, breaking the numbered list in half; moved below it. THE 0011 RELATIONSHIP was stated in three places in terms that read as contradictory — 04-graduation `preference, not a gate` against 06-operational and 0011 both saying `must land in the same window` — and the two claims are now separated under their own heading: at ENTRY level neither blocks the other and steps 1-5 have no 0011 dependency at all, while at FLEET-REPUBLISH level step 6 and 0011's step 3 share one window because both rewrite every coordinate and therefore every deployed instance's owner label. The constraint is on scheduling the migration, not on either design, and what it buys is effort rather than correctness. Both documents now cross-reference the other so the pair cannot drift apart again. Also corrected: step 7's `releases` names a repo that does not exist under the workspace root — it is the sibling opm-releases/, and the workspace-root directory map's ./releases/ row is stale."
  - date: "2026-08-03"
    event: "D38 recorded, amending D2, D7 and D23 — a module declares a version again, supplied by a catalog-style identity SUBPACKAGE exporting both ModulePath and Version. Recorded while walking 0011's Open Questions, where the command-surface half lands as 0011 D12; the two are contingent on each other. WHAT REOPENED D2 was a consumer this entry had not accounted for, found by measurement rather than by argument: an instance derives its version from the module and declares NONE OF ITS OWN (library/opm/module/instance.go:110's ModuleVersion(); core/src/module_instance.cue), and core/src/transformer.cue:105 declares `version: string` NON-OPTIONALLY inside #moduleInstanceMetadata. Under D2 a registry-acquired module could have that field filled from the resolved coordinate, but a module rendered FROM DISK has no coordinate — which is D2's OWN stated reason for rejecting its second alternative, that `a module read from disk has no identity`. 0010 never named transformer.cue:101-109 in its edit surface and never said what supplies the field after the deletion, so the entry carried an unfilled declaration it had not noticed. Recorded so the case is not overstated: measured 2026-08-03, NO SHIPPED TRANSFORMER READS `.version` — 117 uses of #moduleInstanceMetadata across catalog_opm, catalog_kubernetes and catalog_opm_experimental, every one of them .name or .namespace — so nothing breaks either way and the choice is about which design leaves a declared field with no filler. THE INVARIANT IS THE WHOLE OF WHAT MAKES THIS SAFE, and it is stated everywhere a reader could meet the field rather than only in the decision. D2's deletion rested on two reasons; the drift reason is answered by 0011 D12's publish assertion, and the second — that fqn interpolated version, so a moving version moved module.uuid -> instance.uuid -> the owner label on every resource, after which prune.go:107 skipped every delete WHILE REPORTING SUCCESS — was removed independently by D1 making fqn the module path. So the field returns barred from fqn and uuid, and wiring it back into either restores a silent orphaning that emits no Event, no status field and no metric. That is now a first-class RISK in 05-risks rather than a comment, a MUST-FAIL case in schemas/target.cue (_moduleFqnLeak, confirmed 2026-08-03 against cue v0.17.1 — and it fails STRUCTURALLY on `fqn: conflicting values` before the regex ever runs, because fqn: #ModulePathType & modulePath admits no other value), and an accepted->implemented gate requiring a test that asserts changing only `version` moves NEITHER fqn NOR uuid — both, because a test checking fqn alone will not catch a uuid regression. D7 IS PARTIALLY SUPERSEDED, NOT REVERSED: its measurement stands and is why the subpackage is the shape — a top-level field beside the embedded #Module in the ROOT package still fails at re-unification with `field not allowed`, vetting clean standalone. A separate package is never unified into #Module, so it avoids the failure entirely. D23 IS REVERSED: it kept the two artifact types at different placements on the reasoning that the module half of the writer `has nothing to decide` under D2, which restoring the version removes; its self-import cost is real and unchanged, but `opm module init` generates the import so the cost lands on a template rather than on every module author. DELIBERATELY NOT DECIDED: whether D11's read-side check extends to comparing an acquired module's metadata.version against the tag it was fetched by. D2 had made that comparison impossible and D38 makes it available; doing it would close the drift for artifacts published outside `opm publish`, not doing it keeps D11 about the address alone. #FetchedArtifact's comment records the choice as open rather than silently keeping today's behaviour. Narrative surface corrected across 02-design (design point 2, the core/src/module.cue and shape.go edit lines, the SPEC.md :252-256 range), 06-operational (Semver Impact and the deprecation table, whose row now reads NOT REMOVED), 04-graduation (the modules/ gate now requires identity/identity.cue with both constants), README's cross-reference table (gaining transformer.cue:105 and instance.go:110 as the consumers that forced this), and 05-risks, where the `#Catalog and #Module stop being symmetric` drawback is RETIRED — both now carry a version, and what remains is an asymmetry of MEANING that is worth stating precisely because it is invisible: a catalog's version keys its transformers and stamps provenance, so changing it moves keys, while a module's keys nothing at all."
