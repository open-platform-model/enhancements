  - date: "2026-08-05"
    slice: "core/core-identity-shape"
    event: "Slice `core-identity-shape` landed in `core` — the root of the whole core cluster across both entries, so `core-primitive-keying`, `core-platform-and-match` and 0011's `core-identity-package` are now unblocked. Implements D1, D8, D38, D41, D43 and D45. `#ModulePathType` requires a terminal `@vN` and `#PackagePathType` splits off carrying the old regex verbatim, so no primitive value shipped by any catalog changes; `#ArtifactRef` decomposes a module path into `registryPath`, `major` and `importPath` in one place. `#Module.metadata.fqn` and `#Catalog.metadata.fqn` are the module path verbatim — `#ModuleFQNType` and `#CatalogFQNType` retire with the derivations they typed — so `module.uuid` moves on a major and on nothing else. `#Module.metadata.name` is snake_case with the path leaf constrained to equal it; `nameSnakeCase` and `#KebabToSnake` are deleted. `#ModuleInstance.metadata` gains its own `fqn` off the module\'s MAJOR-FREE `registryPath` and hashes THAT, so instance identity survives every upgrade including a major bump — the property the `module-instance.opmodel.dev/uuid` owner label depends on. `#Catalog` loses the `*\"0.0.0-dev\"` default and stamps `\"\\(registryPath)/transformers\"` with the major split out and not re-appended. NEITHER ARTIFACT TYPE ASSERTS THE VERSION/PATH MAJOR AGREEMENT, per D43 and D45, and both accepting cases are pinned as MUST-VET-CLEAN in `core/src/identity_pins.cue` so restoring the `core`-side assertion reads as a change rather than as a fix. That file also pins both directions of both invariant halves plus six MUST-FAIL cases; one refinement worth recording is that a module path supplied where a registry path belongs is refused in `core` by a CONFLICT rather than by the type, because `registryPath` there is derived rather than authored — `schemas/target.cue`\'s `_instanceFromFqn` reports the type error instead, since `#InstanceIdentity.moduleRegistryPath!` is authored and has nothing to conflict against. Both refusals are structural. NOT PUBLISHED: `core-alpha-release` remains the single cut point and still waits on the other three slices."
  - date: "2026-08-07"
    slice: "core/core-primitive-keying"
    event: "Slice `core-primitive-keying` landed in `core` (feat!, unpublished). Implements D4, D21, D25, D33, D34 and D44. THE KEY IS SPLIT BY ROLE: `#ContractFQNType` (path/name terminated by the primitive's own apiVersion) is what a module DEMANDS, `#ImplFQNType` (the pre-split regex verbatim, path/name terminated by SemVer) is what a platform EXECUTES, and `#FQNType` is now their disjunction. `#APIVersionType` admits the Kubernetes ladder and `#APIVersionGated` reports whether the additive-only promise binds — the only place the ladder is interpreted, and it introduces no ordering. `#Resource`, `#Trait` and `#Blueprint` carry a required `apiVersion` and key on it; `#ComponentTransformer` carries none, and the exclusion is STRUCTURAL rather than remembered — `metadata` sits inside a definition and is therefore closed, so supplying one yields `apiVersion: field not allowed` (measured 2026-08-07, cue v0.17.1). `version` becomes `catalogVersion` on all four kinds, including the `#Catalog` pattern stamp. `fqn` is AUTHORED on all four rather than derived, so `core` no longer refuses a wrong key at all; the replacement gate is named in every doc comment and in SPEC.md and ships in 0011's `core-identity-package`. `#ComponentTransformer.metadata.#definitionName` is deleted (nothing read it); the three primitives keep theirs, since each builds its `spec!` key from it. `#Blueprint` is reclassified Construct to Primitive in SPEC.md's two category lines, and the dividing question moves with it — not \"does this introduce vocabulary?\" but \"does a module attach this and write against its spec?\", which is what earns a contract key. The section keeps its 3.3 number so existing cross-references resolve; the category lines point at it. Eleven pins added to `core/src/identity_pins.cue` (four positive keyed cases, three ladder cases, the kind-segment separation, two MUST-VET-CLEAN skew cases, five commented MUST-FAILs); the two new invariant pins were mutation-tested rather than merely observed to pass. TWO MEASURED FINDINGS WORTH CARRYING. First, A MISSING REQUIRED FIELD IS NOT VET-VISIBLE: `cue vet ./...` and `cue vet -c ./...` both exit 0 on a `#Resource` with `apiVersion` unset, and `cue eval` prints the field back as an unsatisfied constraint; only concrete evaluation reports it (`cue export` -> \"field is required but not present\"). That is the correct surfacing for a consumer rendering a module, but it means the `!` on `apiVersion` is not gated by this repo's own check, and the pins file says so rather than carrying a case that appears to test it. Second, `#FQNType` BECOMING A DISJUNCTION LOOSENED SIX MAP KEYS that previously admitted build-form keys only — `#TransformerMap`, `#Catalog.#transformers`, `#ComponentTransformer.required/optionalResources` and `.required/optionalTraits`, plus `#Platform.#matchers.resources` and `.traits`. Each admitted both forms while its values can only ever carry one, so a contract-shaped transformer key or a build-shaped demand key was expressible and nothing complained until a match returned nothing. NOT IN THE TASK LIST, and narrowed anyway on the author's call: the demand maps and `#Platform.#matchers` take `#ContractFQNType`, `#TransformerMap` and `#Catalog.#transformers` take `#ImplFQNType`, and `#FQNType` keeps its exported disjunction with no reader left inside `core`. Its doc comment carries the per-site table, since it is the one type that could silently re-admit the wrong form. Both refusals pinned, and both are closedness failures rather than out-of-bounds — the offending string is a map KEY matching no pattern constraint, so the error reads `field not allowed`. ONE TOOLING NOTE: `task spec:check` Direction 3 refuses any `#Name` in SPEC.md that no `src/*.cue` defines, so the forward reference to the publish gate is written without its sigil until `core-identity-package` adds the definition and its section. NOT PUBLISHED — `core-alpha-release` is still the cut point and still waits on `core-platform-and-match` and 0011's `core-identity-package`."
  - date: "2026-08-07"
    slice: "core/core-platform-and-match"
    event: "Slice `core-platform-and-match` landed in `core`, implementing D14, D28, D32, D36 and D37 — the third of the four slices in the unpublished alpha, leaving 0011's `core-identity-package` before `core-alpha-release` can cut. SELECTION: the subscription filter definition is deleted outright and `#Subscription` carries a required scalar `version!`, so catalog selection is a pure function of committed source — git-identical inputs materialize identical bytes with no lockfile, because the platform file IS the resolution. Two builds of one catalog is two platforms, and the map key makes the alternative a conflict rather than a discouraged shape. MATCHING: `matchLabels` lands on `#Resource`, `#Trait`, `#Blueprint` and `#Component`, unified WHOLESALE with no filter; `#ComponentTransformer.requiredLabels` selects on it; `metadata.labels` keeps categorisation and is never unified upward; `#LabelWorkloadType` is deleted, so `core` names no matching key. TWO CLAIMS WERE DELETED RATHER THAN CORRECTED, and this is the one finding that changes the story: `metadata.labels` was documented as unified from every attached primitive in BOTH the schema comment and SPEC.md, and NOTHING PERFORMED THAT UNION — not the CUE, and not the kernel, which reads `metadata.labels` off the component value at `compile/match.go:111`. What made label matching work was catalogs writing the label onto a component FRAGMENT by hand, which is exactly what D36 removes. FULFILMENT: `fulfilment: *\"catalog\" | \"provider\"` on `#Resource` and `#Trait` only; `#Blueprint` is excluded structurally and a declaration there is `field not allowed`. D28 SPELLING, which this slice was left to pick: the trait opt-out is a MARKER SET on `#Component` — `#optionalTraits?: [#ContractFQNType]: true` — keyed by the same contract FQN the `#traits` map is keyed by, with no `false`, so absence is the only spelling of required. A field on `#Trait` was rejected as supply-side; a second attachment map was rejected because catalogs ship fragments that attach into `#traits` and a module author cannot move where a fragment put a trait, while a marker is writable beside one; a list was rejected because two fragments unifying into one component fail on list unification while map keys merge. Resources get no marker, per D28. TWO CONSEQUENCES SHIP HERE RATHER THAN LATER: rendered objects stop carrying `core.opmodel.dev/workload-type`, because `matchLabels` is deliberately not folded into `#TransformerContext` (recorded at the fold site, since the omission otherwise reads as an oversight); and every live Platform with a range must be rewritten to a scalar `version`, which is cluster work outside both entries. `src/platform_and_match_pins.cue` pins the properties, with seven MUST-FAIL cases measured in place against cue v0.17.1. TWO OF THOSE ARE MISSING REQUIRED FIELDS, which `cue vet` does not report: the unanswered match-label case surfaces under an ordinary `cue export` because `matchLabels` is a REGULAR field, while the version-less subscription does NOT, because `#registry` is hidden and even concrete evaluation skips it — the field has to be named, which is what a kernel does. THE LIBRARY STILL READS `metadata.labels` FOR MATCHING: shipping this schema without `library-match-labels` leaves a matcher that silently matches nothing, so a green `task check` in `core` is not evidence the system works end to end. NOT PUBLISHED — `core-alpha-release` remains the cut point."
  - date: "2026-08-07"
    slice: "core/core-platform-and-match"
    event: "Follow-up on the slice above, from verifying it rather than from new design. TWO DEFECTS, both of the same kind — a rule written down that nothing performs, which is exactly what D36 corrected in `metadata.labels` and which this entry had just reproduced twice more. FIRST: the delta spec said a component fragment MUST be a pure wrapper and MUST NOT declare `matchLabels`, and nothing enforced it — a component could declare a matching key and it landed in the identity, vet-clean. `#Component.matchLabels` is now DERIVED: the union moved into a hidden `_matchLabelsFromPrimitives`, the public field reads it, and a size comparison refuses any key the component contributed itself, since unification can only ever ADD. Two findings settled it by measurement. `close()` around the union does NOT refuse an authored key under cue v0.17.1, so the obvious spelling would have read as enforcement while enforcing nothing. And THE RULE CANNOT BE NARROWED TO FRAGMENTS, because CUE has no way to name one — a catalog's wrapper and a module author's component are the same type — so it binds every `#Component`, and the accepted cost is that a required matching key can no longer be answered inline; it is answered by attaching a blueprint. Measured against the fleet before being taken: `modules/**` carries ZERO hand-set matching labels, because every module composes a workload blueprint and inherits, so the closed hatch is one nobody uses. SECOND, AND THE ONE WORTH CARRYING FURTHEST: several pins COULD NOT FAIL. `_pin: <expr>` followed by `_pin: <literal>` asserts only that the literal is a LEGAL value of the expression, which is always true when the expression is an unset required field or a defaulted disjunction — it never asks whether the computation produced it. With `#Component.matchLabels` replaced by `{}`, the whole centrepiece of the slice deleted, `_pinMatchUnified` reported its expected values unchanged and `cue vet` exited 0. Same blindness on the `fulfilment` and `enable` defaults. All rewritten to force evaluation via `len()`, key indexing and interpolation, each mutation-verified to fail where the old form passed, and the file header now carries the rule. THE AUDIT THIS PROMPTED FOUND A HOLE IN `identity_pins.cue` THAT PREDATES BOTH SLICES: every uuid pin there is RELATIVE — two uuids agreeing, or differing — and both sides move together when the formula moves, so changing `OPMNamespace`, the constant `types.cue` declares immutable across all versions, produced ZERO failures. Two absolute pins added. `SPEC.md` claimed that sentinel lived in `library`'s fixture harness; the helper there encodes the PRE-D41 formula (it hashes the module uuid, not its registryPath) and sits behind the unlanded `library-core-retarget`, so the claim is corrected to name `identity_pins.cue`. The rest of that file audited sound — it catches the D41 instance-fqn regression and a broken alpha gate loudly. Also corrected: `SPEC.md` stated that an `#optionalTraits` key MUST also be a key of `#traits`, which nothing cross-checks; a dangling key is accepted, marks nothing, and the trait stays required, which is now what it says. And `.tasks/branch-tag.sh` still argued from range subscriptions after `docs/publishing.md` had been updated. NOT PUBLISHED — `core-alpha-release` remains the cut point."
  - date: "2026-08-07"
    slice: "core/core-platform-and-match"
    event: "D46 recorded, and the trait opt-out D28 left to the implementing slice was REBUILT after the first spelling was found wanting. The marker set on `#Component` — keyed by contract FQN, beside `#traits` — is gone. `#Trait` carries `optional: bool` beside `spec`, `core` gives it NO DEFAULT, the declaring catalog states the posture AS A DEFAULT (`bool | *true` advisory, `bool | *false` load-bearing), and a module overrides it at the attachment site: `#traits: (BackupFQN): Backup & {optional: true}`. WHAT THE FIRST SPELLING GOT WRONG was not the location but the reading of D28's `lives on the demand side` clause: taken as forbidding a field on `#Trait`, it wrote the contract FQN twice and left the trait's own author — the one who knows whether a trait is advisory — unable to say so. Optionality is a property of the (trait, component) PAIR: `backup` on a throwaway cache is advisory, on a database it is the entire point. A default plus an attachment-site override says both; a demand-side-only marker says one. THE DEMAND SIDE STILL WINS, structurally rather than by convention — measured against cue v0.17.1, a module narrowing a DEFAULT is never a conflict while narrowing a CONCRETE value always is, which is the whole reason the catalog must state a default rather than a value. `core` states none of its own because TWO DEFAULTS DO NOT COMPOSE: a catalog restating one against a core default annihilates both and leaves `bool | true | false` — incomplete, defaultless, and reported as `incomplete value bool`, which never says why. THE RULE THE SCHEMA CANNOT CARRY went to a gate. CUE cannot express `you may supply a default here but not a value`, because what separates the two cases is who wrote it; so `#TraitOptionalGate` ships in `core` and `opm catalog publish` unifies every published trait's `optional` against it, refusing an unstated posture and a pinned one. That is 0011 D22's mechanism, not a second one, and 0011's D22 and its `cli-catalog-member-gate` slice now