than deleted, per the tombstone convention, and `releases` stays in affects because vet requires repo-in-affects for a cancelled slice too. It was never viable as written: measured 2026-08-05, all 31 of that repository's cue.mod/module.cue files pin opmodel.dev/core/v1alpha1@v1.3.10 and opmodel.dev/opm/v1alpha1@v1.5.9 on CUE v0.15.x, and every module coordinate they consume is the v0_legacy fleet — ZERO overlap with the eleven v1-line modules this entry republishes. There was nothing to re-pin in either direction; what that repo needs is its own v0 -> v1 migration, the same one 0011 D17 names as the gate on deleting the legacy v1alpha1 repositories. TWO MEASURED SCOPE ERRORS CORRECTED. 02-design.md said D42 moves `Seven import sites`; re-measured, it is NINETEEN across FIVE repos, and the shape of the miss matters more than the count — `modules/` carries twelve rather than three (every module in the repo), `opm-operator/test/fixtures/modules/` carries three and was missed entirely, and library/opm/helper/synth/instance_integration_test.go:154 WRITES THE IMPORT AS A STRING into a temp file, so it survives a grep for `import` and is the one site a mechanical sweep will miss. Five modulePath self-references inside the moving files and a regenerated INDEX.md go with them. The undercount made D42 read as a bounded catalog-local edit when three of the five affected repos are not the catalog. And 05-risks.md's `Two hyphenated module names change` is RETIRED as already done: zero hyphenated directory names or declared module paths across 13 directories on `main` and 25 module paths on `v0_legacy`, so modules-fleet-republish no longer claims a rename it cannot perform. What stays hyphenated is a different class the D8 rule does not reach — primitive metadata.name values under #NameType, which are kebab by design. ONE NEW RISK, and it is the find with the longest reach. D36 calls its own consequence `a label removal on every live workload` and 06-operational.md names dashboards, kubectl selectors and network policies as what must be re-pointed. Measured 2026-08-05, that understates it by one level: transformer.cue:147-157 folds every metadata.labels key into componentLabels, and catalog_opm consumes componentLabels AS A SELECTOR — deployment_transformer.cue:134 and statefulset_transformer.cue:146 set `selector: matchLabels`, service_transformer.cue:115 sets `selector`. apps/v1 makes .spec.selector IMMUTABLE, so an already-deployed workload cannot accept the render that omits the key; the apply is rejected rather than being a no-op diff, and a Service selector changed out of step with pod labels drops every endpoint. D36 SHIPS AS DECIDED (author, 2026-08-05) — the cutover is out of scope with the rest of the cluster work — and the risk exists to hand the fact to whoever schedules it, together with the cheaper of the two remedies: D36's own v_render fold, four lines, already measured, which keeps the key in the selector and makes the cutover a no-op. Stated with no cluster, namespace or workload names. SEPARATELY FLAGGED, NOT FIXED: cluster and environment detail already committed to this entry from earlier measurement passes — research/migration-inventory.md's instance table with pre-migration UUIDs, environment names and namespaces, and 06-operational.md's Migration Inventory — is to be redacted in its own reviewable pass rather than folded in here."
