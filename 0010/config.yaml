    event: "D38 recorded, amending D2, D7 and D23 — a module declares a version again, supplied by a catalog-style identity SUBPACKAGE exporting both ModulePath and Version. Recorded while walking 0011's Open Questions, where the command-surface half lands as 0011 D12; the two are contingent on each other. WHAT REOPENED D2 was a consumer this entry had not accounted for, found by measurement rather than by argument: an instance derives its version from the module and declares NONE OF ITS OWN (library/opm/module/instance.go:110's ModuleVersion(); core/src/module_instance.cue), and core/src/transformer.cue:105 declares `version: string` NON-OPTIONALLY inside #moduleInstanceMetadata. Under D2 a registry-acquired module could have that field filled from the resolved coordinate, but a module rendered FROM DISK has no coordinate — which is D2's OWN stated reason for rejecting its second alternative, that `a module read from disk has no identity`. 0010 never named transformer.cue:101-109 in its edit surface and never said what supplies the field after the deletion, so the entry carried an unfilled declaration it had not noticed. Recorded so the case is not overstated: measured 2026-08-03, NO SHIPPED TRANSFORMER READS `.version` — 117 uses of #moduleInstanceMetadata across catalog_opm, catalog_kubernetes and catalog_opm_experimental, every one of them .name or .namespace — so nothing breaks either way and the choice is about which design leaves a declared field with no filler. THE INVARIANT IS THE WHOLE OF WHAT MAKES THIS SAFE, and it is stated everywhere a reader could meet the field rather than only in the decision. D2's deletion rested on two reasons; the drift reason is answered by 0011 D12's publish assertion, and the second — that fqn interpolated version, so a moving version moved module.uuid -> instance.uuid -> the owner label on every resource, after which prune.go:107 skipped every delete WHILE REPORTING SUCCESS — was removed independently by D1 making fqn the module path. So the field returns barred from fqn and uuid, and wiring it back into either restores a silent orphaning that emits no Event, no status field and no metric. That is now a first-class RISK in 05-risks rather than a comment, a MUST-FAIL case in schemas/target.cue (_moduleFqnLeak, confirmed 2026-08-03 against cue v0.17.1 — and it fails STRUCTURALLY on `fqn: conflicting values` before the regex ever runs, because fqn: #ModulePathType & modulePath admits no other value), and an accepted->implemented gate requiring a test that asserts changing only `version` moves NEITHER fqn NOR uuid — both, because a test checking fqn alone will not catch a uuid regression. D7 IS PARTIALLY SUPERSEDED, NOT REVERSED: its measurement stands and is why the subpackage is the shape — a top-level field beside the embedded #Module in the ROOT package still fails at re-unification with `field not allowed`, vetting clean standalone. A separate package is never unified into #Module, so it avoids the failure entirely. D23 IS REVERSED: it kept the two artifact types at different placements on the reasoning that the module half of the writer `has nothing to decide` under D2, which restoring the version removes; its self-import cost is real and unchanged, but `opm module init` generates the import so the cost lands on a template rather than on every module author. DELIBERATELY NOT DECIDED: whether D11's read-side check extends to comparing an acquired module's metadata.version against the tag it was fetched by. D2 had made that comparison impossible and D38 makes it available; doing it would close the drift for artifacts published outside `opm publish`, not doing it keeps D11 about the address alone. #FetchedArtifact's comment records the choice as open rather than silently keeping today's behaviour. Narrative surface corrected across 02-design (design point 2, the core/src/module.cue and shape.go edit lines, the SPEC.md :252-256 range), 06-operational (Semver Impact and the deprecation table, whose row now reads NOT REMOVED), 04-graduation (the modules/ gate now requires identity/identity.cue with both constants), README's cross-reference table (gaining transformer.cue:105 and instance.go:110 as the consumers that forced this), and 05-risks, where the `#Catalog and #Module stop being symmetric` drawback is RETIRED — both now carry a version, and what remains is an asymmetry of MEANING that is worth stating precisely because it is invisible: a catalog's version keys its transformers and stamps provenance, so changing it moves keys, while a module's keys nothing at all."
  - date: "2026-08-03"
    event: "D39, D40 and D41 recorded, all three from a review that read the post-0010 shapes as a COMPILING tree rather than as prose — every claim below was executed against cue v0.17.1 on a worked module + two catalogs + a platform + an instance. D39 AMENDS D9: the module.opmodel.dev/version label returns to core sourced from D38's metadata.version, and the kernel stops being its source and becomes its VERIFIER. D9's reasoning — that the label describes an ACQUISITION and only the fetching code knows which artifact it got — held while a module declared no version, and does not survive a render path with no coordinate to read: cli/internal/workflow/render/module.go:99 records that a module apply ALWAYS renders a local module directory, so the CLI's primary module path has nothing to stamp from, while the operator's registry-acquired render does. 04-graduation's byte-identical-render gate does not catch this, because it compares cli against opm-operator for one INSTANCE and both sides of that comparison acquire from a registry. The honesty half is what D38 had deliberately left open in #FetchedArtifact, and D39 ADOPTS it: an acquired artifact's metadata.version is compared against the tag it was fetched by, same typed error as the address mismatch. Without that comparison the label reproduces the exact pre-0010 defect measured in 01-problem — jellyfin v2.0.1 and v2.0.2 both shipping metadata.version 2.0.0 — because 0011 D4's own scope note is that `cue mod publish` keeps working, so a producer-side assertion is not something a consumer may rely on. D40 is the user's `id.VersionMajor` idea, redirected from the job it cannot do to the one it can. It CANNOT go into fqn or uuid, because the major is ALREADY in both and measurably so (@v2 yields b762d291-…, @v3 yields 6dc33f7b-…); a second route to a value that already has one is not harmless here, because `ModulePath: .../jellyfin@v2` with `Version: 3.0.0` VETS CLEAN today, so a version typo that currently changes nothing would under that wiring move every instance UUID and every owner label while reporting success. What it CAN do is close that gap: VersionMajor is DERIVED from Version, never authored, and asserted equal to the path's major — in the identity package, where the two values are written and a failure names the file the author has open, and independently in core, for identity packages that are absent or non-conformant. Nothing compared these two before: 0011's #TagRef compares the TAG against the path, which CUE's own publish already enforces, and the skew otherwise surfaces only when a PLATFORM names the build, reporting one publisher's mistake to a different party. D41 is the largest and closes a route into prune.go that D1 left open and nobody had named. D2's orphaning argument had ONE route closed — fqn interpolating version — and a second stayed live: instance.uuid derived from module.uuid, which carries the MAJOR, so a @v2 -> @v3 upgrade silently orphaned everything the new major stopped rendering. D1 reduced the exposure from EVERY RELEASE to EVERY MAJOR; it did not remove it. D41 gives #ModuleInstance.metadata an explicit fqn derived from the module's major-free registryPath, with uuid over that — separating two values that were conflated: module.uuid answers WHICH MODULE IS THIS and must move across a major (@v2 and @v3 are distinct modules under CUE and Go alike, per D1), while instance.uuid answers WHICH RESOURCES DOES THIS MANAGE and must not. Both labels already ship on every rendered resource; the names promised they were different facts and now they are. The invariance matrix was measured in full: version bump holds, major bump holds, owner change moves it, namespace change moves it. Deriving from metadata.name instead was rejected on collision (acme/jellyfin and otherorg/jellyfin share a leaf), and a second major-free UUID on #Module was rejected as a spare identity value since registryPath is already computed under D1 and has independent callers. DEFERRING was rejected on MIGRATION TIMING, which is the strongest argument for landing it now: this entry already moves every instance UUID once and D18 settles adoption as a manual pass over an enumerable fleet, so landing it in the same window costs nothing extra and makes it the LAST time an instance UUID ever moves — later, it is a second fleet-wide relabelling carrying the same silent-orphaning exposure through a second cutover. D38's invariant wording is RESTATED rather than kept: `version is never an input to fqn or to uuid` was imprecise, since the major IS an input by way of the path, and incomplete, since the value in the owner label is the instance UUID. It becomes two rules with reasons — artifact identity distinguishes majors and nothing finer; instance identity is reached by neither the version nor the major — carried into D2's and D38's revision notes, target.cue, examples.cue, 05-risks (where the risk is rewritten around TWO routes rather than one), 04-graduation (whose gate becomes four assertions in BOTH directions, since a test that only pins what must not move will not catch an identity that has stopped distinguishing what it should), README's summary, and 0011 D12's permanent-constraint paragraph. Three new MUST-FAIL cases confirmed against cue v0.17.1 the same day: _moduleMajorSkew (`versionMajor: conflicting values v2 and v3`), _fetchedVersionDrift (`declaredVersion: conflicting values 2.0.2 and 2.0.0`), and _instanceFromFqn, which fails STRUCTURALLY on the TYPE rather than the value — moduleRegistryPath is a #PackagePathType and admits no @vN at all, so a module path cannot be substituted for a registry path even by accident. Also corrected: schemas/examples.cue's _moduleAfter still described the pre-D38 design (`No version anywhere in source`, identity writing metadata: directly per D7/D23), which vetted clean while contradicting the decision log — the exact failure that file exists to prevent. Two consequences recorded rather than resolved: #TransformerContext.#moduleInstanceMetadata.fqn is filled today with inst.ModuleFQN() (library/opm/schema/context.go:59), i.e. the MODULE's fqn under an instance-shaped name, and D41 settles that the block carries the instance's — free today, since the same 117-use survey that found no reader for .version found none for .fqn; and two majors of one module deployed under one instance name in one namespace now collide on instance.uuid, which is not a new constraint because rendered resource names are instance-scoped and that pair already collides on names."
  - date: "2026-08-03"
    event: "D42 and D43 recorded, both from a read of the post-0010 shapes against the SHIPPED catalog tree rather than against the entry's own examples. D42 — EVERY PRIMITIVE KIND IS FLAT, and catalog_opm's five blueprints move up one segment. #PrimitiveFQNGate asserts `declaredModulePath: identity.primitivePrefix[kind]` and builds the key from the same value, both exact equality by unification, while primitivePrefix.blueprints is RegistryPath + `/blueprints` and every shipped blueprint declares `\\(id.ModulePath)/blueprints/workload` — one segment deeper (stateless_workload.cue:24, stateful_workload.cue:22, daemon_workload.cue:20, task_workload.cue:20, scheduled_task_workload.cue:20, read 2026-08-03). So the gate AS SPECIFIED REFUSES catalog_opm ON DAY ONE, and the key it computes is not the key the leaf authors. D17 had already recorded the fact that makes it fail — resources at .../opm/resources against blueprints at .../opm/blueprints/workload — as its reason for NOT delivering catalog-derivability, and the gate then encoded the assumption D17 refuted. Fixed on the catalog side rather than by loosening the gate: a prefix-match or a per-primitive prefix both make primitivePrefix stop PREDICTING where a primitive lives, turning it into a constant that must be re-checked against reality at every use, and both weaken the gate back to D17's somewhere-under-this-catalog rule, which cannot catch a primitive filed under the wrong KIND. Files move rather than only the declared string, so a primitive's modulePath stays the package that defines it — the correspondence D21 relies on when it argues for retaining kind segments. Costs measured the same day: blueprint names become globally unique within a catalog (the five are already distinct), seven import sites move (modules/metallb, modules/istio_ambient x2, library/testdata/modules/web_app, cli/tests/fixtures/modules/podinfo, cli/tests/integration/module-apply/testdata, and library/opm/helper/synth/instance_integration_test.go:154 which writes the import as a string), and core's own doc-comment examples at blueprint.cue:17/:19 and types.cue:45 move too — all inside the migration's existing blast radius, since the modules are being republished and the testdata regenerated regardless. ONE CONSEQUENCE RECORDED RATHER THAN ACTED ON: with exactly one segment per kind the owning catalog IS recoverable from a contract FQN (strip @version, strip the name, strip the kind segment), which is precisely the derivation D17 declares not delivered and which D37 cites when it argues fulfilment must be declared rather than inferred. D37's other argument is unaffected — a catalog later adding a transformer would silently change a contract's character — so neither D17 nor D37 is reopened here, but the next reader should not cite D17's blocker as still-current. Pinned in schemas/target.cue as _blueprintExample + _gateBlueprint plus a MUST-FAIL _gateGroupedBlueprint, confirmed against cue v0.17.1: the grouped path yields BOTH conflicts, declaredModulePath naming the extra segment directly and declaredFQN arriving wrapped as `2 errors in empty disjunction` because #FQNType is a disjunction. D43 — THE VERSION-MAJOR AGREEMENT IS ASSERTED IN THE IDENTITY PACKAGE ALONE, FOR #Catalog, amending D40. For a conformant catalog the core copy is provably redundant: both modulePath and version are WRITTEN in identity/identity.cue, which asserts VersionMajor == Major between them, so a value reaching #Catalog.metadata has already passed the check and re-deriving it in core tests the same relation one hop downstream. D40's stated reason for keeping both — that identity packages are hand-written with no schema validating their shape, so a package omitting VersionMajor omits the check — is answered by 0011 D8, which already requires publish to refuse an identity file that does not match #IdentityPackage. One mechanical constraint bounds what the reference can be: core CANNOT import a consumer's identity package (the impossibility D38 and 0011 D12 both record for metadata.version), so there is no shape in which #Catalog.metadata reads id.VersionMajor and the reference is the authored wiring in catalog.cue, exactly as modulePath and version already are. THE EXPOSURE IS ACCEPTED RATHER THAN DISCOVERED: the core constraint is CONSUMER-VERIFIABLE, because materialize/pull.go:23 builds the catalog value and it unifies against #Catalog, while identity/identity.cue is never evaluated as a package by any consumer — so a catalog with an absent or non-conformant identity package now carries no major check any consumer can run, and D11 records that `cue mod publish` keeps working, so that artifact class is not hypothetical. The residual failure surfaces at #SubscriptionSelection._majorAgrees as conflicting values 1 and 2 in the PLATFORM AUTHOR's file about a CATALOG PUBLISHER's mistake, which is the outcome D40 added the core check to avoid. RECOMMENDED FOLLOW-ON, not required by the decision: have core EXPORT #IdentityPackage and have each identity.cue embed it, so VersionMajor comes from the definition rather than from the author remembering — permitted because the import-free invariant is scoped to INTRA-module imports (D21), strings is a builtin, and core imports no catalog, so no cycle exists; it would also let identity.cue drop the #VersionType it duplicates for exactly that reason, and give #IdentityPackage one home instead of a definition in this entry's schemas mirrored by hand in four repos. DELIBERATELY NOT DECIDED: the #Module half. D40 asserts the same relation on #Module.metadata and D38 gives modules an identity subpackage, so the argument transposes without change, but the two artifact types having different answers to where-is-the-major-checked is the asymmetry D38 and 0011 D12 just spent two decisions removing — so it is left to be settled deliberately, with symmetry recommended on the record and free if the #IdentityPackage export lands. #CatalogIdentity additionally gains registryPath, which #Catalog's #transformers pattern constraint already needs under D1 and which keeps _ref live now that versionMajor is gone."
