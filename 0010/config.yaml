mbstones, the library/catalog order inverted with the library#52 revert, and ONLY-ALPHA.4-IS-A-RETARGET-TARGET is dated — v2.0.0-alpha.5 carries the D49 gate and trails only core#46's release-parse fix, after which the floating major resolves it. 06-operational.md's Cross-Repo Coordination reconciled to the same facts: the major bump happened (import rewrite, not update-deps; four alphas, not one cut), and the catalog step now precedes the library step."
  - date: "2026-08-11"
    slice: "library/library-core-retarget"
    event: "library-core-retarget moved to done — the SECOND landing, merged as library#54 after every check passed: library#51's major-aware fixture writers and two seam commits re-landed by cherry-pick, the new enumeration seam, the atomic flip, and the docs sweep, every commit before and after the flip independently green (task check + task cue:check against GHCR with no local registry, flow tests forced with OPM_FLOW_TEST_FORCE=1 materializing the real catalog). The default resolves core v2.0.0-alpha.4 (alpha.5 still not cut at landing time); web_app consumed catalogs/opm 2.0.0-alpha.2 with D49 versioned imports (blueprints/traits/resources at v1beta1) and opm_platform's subscription named the same tag as its scalar version — transitional invariant 1's pin-tracks-newest-tag obligation is live, ENFORCED by the library's repaired cue:catalog:drift check (previously vacuous: jq key hardcoded to the v0 dep form, stable-only tag filter, unpaginated tag listing; it now checks both the web_app dep pin and the platform #registry scalar against the newest tag on their own major line, stable-first with a prerelease fallback mirroring the kernel's highestStable), and bumps with every catalog release until library-acquire-and-subscription makes the pin load-bearing. TWO DEVIATIONS FROM THE REDO'S OWN PLAN, both discovered during apply. First, the fourth seam adaptation required NO new resolution logic: cuelang.org/go's modregistry.ModuleVersions already scopes a major-suffixed path to its major (client.go filters tags on semver.Major when ast.SplitPackageVersion finds a suffix), so materialize's existing pass-through of the raw subscription key IS the scoping — what landed is the locking unit test (mixed-major published list modelled on the real repo: a v2-suffixed key selects the highest v2 alpha via the prerelease-only fallback and never stable 0.6.0, a major-free key keeps selecting 0.6.0) plus the enumerate.go doc rewrite. The platform-materialization spec delta's scenarios hold verbatim; only the imagined diff was wrong. Second, web_app initially had to author updateStrategy.rollingUpdate EXPLICITLY although #UpdateStrategySchema marks the field optional, because catalog_opm's deployment-transformer dereferenced #component.spec.updateStrategy.rollingUpdate unguarded whenever type was RollingUpdate — a component exercising its schema-legal right to omit it failed transform execution with '2 errors in empty disjunction'. RESOLVED THE SAME DAY, catalog-side, not papered over: catalog_opm#37 guards the dereference in the deployment and statefulset transformers AND re-lands the alpha.8 guard-hoisting fix the daemonset transformer never received (its updateStrategy was still silently dropped from every DaemonSet — found while fixing the sibling), all four regression tests proven to fail against the pre-fix code; released as catalogs/opm 2.0.0-alpha.3, verified against the published bytes with an alpha.2 negative control before merging. library#55 then dropped the fixture accommodation — web_app renders the schema-legal omission end-to-end through the flow tests — and moved both pins to 2.0.0-alpha.3, the drift check's first real enforcement. ONE PRE-EXISTING DEVIATION RECONFIRMED: the deep blueprints/workload import at instance_integration_test.go stays pinned to catalog v0.6.0 where that path is correct — D49 does not reopen it, the site pins below both filings."
  - date: "2026-08-12"
    slice: "library/library-compat-comparator"
    event: "D30'S STRIP IMPLEMENTATION LANDED — in 0011's library-compat-comparator slice, not in this entry's library-matching, and the placement is a recorded scope addition against this plan rather than a drift. The mechanism is exactly D30's: denylist of metadata.catalogVersion + metadata.description, syntax round-trip via Syntax(cue.All(), cue.InlineImports(true)) -> AST delete from every metadata block -> rebuild, reaching the definition as well as the instance (the required-field leftover Validate(cue.Concrete(false)) cannot flag), closedness preserved, InlineImports proven required by a fixture that fails without it. The known position-loss cost carries over as accepted. WHY THERE: the comparator is unusable without the strip — catalogVersion changes on every release by construction, so an unstripped gate fires on every publish — and shipping it once in opm/compat, the package both consumers import, avoids two implementations of a subtle AST transform. WHAT THIS ENTRY IS STILL OWED: library-matching's unify-rung APPLICATION of the strip is unmoved and still that slice's work, along with its D34 consumption of compat.CompareAPIVersions — the kube-aware total ordering also shipped in the same slice, parity-pinned to core #APIVersionType, fixing sortFQNsBySemVer's measured non-transitive triple. The same landing unblocks library-acquire-and-subscription's move half: HighestStable now lives in opm/compat with materialize's filterVersions calling across the boundary, so D14's deletion of filter.go no longer strands predecessor selection."
  - date: "2026-08-12"
    slice: "library/library-acquire-and-subscription"
    event: "library-acquire-and-subscription moved to done — the read side landed as one OpenSpec change: D14's scalar flip (materialize reads the authored version!, checks major agreement against the key's suffix mirroring the target schema's _majorAgrees, pulls exactly that build; filter.go and filter_test.go deleted entire, the Masterminds/semver import left materialize, decodeFilter gone; enumeration survives unexported as a lazy failure diagnostic only — the happy path makes one registry operation per subscription and a missing named build reports the published list scoped to the key's major), D11/D9's identity verification at both library read sites via the new oerrors.IdentityError (module acquire returns it bare from the shared LoadModulePackageWithSource path so Kernel.AcquireModuleFromRegistry and every frontend inherit one implementation; catalog materialize wraps it in MaterializeError Kind catalog, errors.As-reachable), synth's lockstep move (SubscriptionSpec is {Enable, Version-required}, FilterSpec and writeFilter deleted, empty Version refused at synthesis naming the subscription path before any schema fetch), the cache-key trim (normSub drops range/allow/deny; a golden test pins v2 keys byte-identical across the trim), and D41's residue (#moduleInstanceMetadata.fqn now carries the instance's own metadata.fqn via new InstanceMetadata.FQN + InstanceView.InstanceFQN; Version stays, fed by the now-acquire-verified declared version). Transitional scaffolding retired: cue:catalog:drift shrank from the highestStable shell mirror to a named-tag-exists check, opm_platform's pin comment now reads load-bearing/ordinary-update, the materialize_test NOTE tombstone and the synth filter-rejection transitional test are resolved, and the happy-path assertion flipped from coincidence to contract (a HIGHER version is published beside the authored pin and must not be chosen). Everything green: task check, task cue:check against GHCR, forced flow tests (OPM_FLOW_TEST_FORCE=1) materializing catalogs/opm 2.0.0-alpha.3 by its authored version. THREE RECORDED DEVIATIONS. (1) D11's third read point — verify when a catalog is added to a platform's registry — has no library home: the platform loader deliberately resolves no subscriptions, so in-library the check collapses into materialize, and the fires-earliest, platform-author-facing property is delivered by frontends materializing at subscription time (option 1's exported VerifySubscriptions stays available later, deferral free per Principle VII). (2) The opm-operator CRD carries Subscription.Filter — a versioned API field whose retirement is operator-side work, contradicting this entry's 'no operator feature code at all' note in config.yaml affects; operator-library-retarget inherits it. (3) Found at implementation: the acquire-site path clause cannot be unconditional full-path string equality — a core-v0/v1 module's metadata.modulePath is the major-free PARENT path (the 0003 publishing convention; the v0/v1 schema cannot express the suffixed form), and the untouched registry-module-loading spec scenario plus the pinned core-v1 regression fixtures (library#31) keep that read path supported — so the check dispatches on the declared shape: suffixed declarations compare strictly per the design, major-free declarations verify the fetched path sits directly under the declared parent; both shapes still refuse lying metadata, and the version clause is line-independent. DOWNSTREAM HEADS-UP for cli-coordinate-adoption: cli/internal/platform's wireFilter -> synth.FilterSpec mapping no longer compiles and moves to Version, and cli/internal/config/templates.go's template shape moves filter: range: to version: in the same slice. MIGRATIONS.md carries the Unreleased-Breaking entry; the Migration: trailer machinery (add-migration-guard) is not yet live, so the PR carries none."
  - date: "2026-08-12"
    slice: "library/library-matching"
    event: "library-matching moved to done — the match rung is load-bearing, landed as one OpenSpec change in five separately-green strands. D36's flip: the label predicate's set builds from component matchLabels (new schema.MatchLabels path constant) at the two matching sites; the two non-matching readers stay on metadata.labels exactly per the site table — the transformer context (pinned by a new must-not-flip test asserting matchLabels never reaches #componentMetadata) and the display-only ComponentSummary; fixtures moved to the flipped vocabulary (registrytest primitives emit matchLabels beside the transitional metadata.labels duplicate; raw compile and kernel fixtures author component matchLabels; a new case pins that metadata.labels alone no longer matches) and the forced GHCR flow test proves the flip against published catalog bytes. D28+D4: every declared resource is a required demand — empty-bucket and all-candidates-disqualified states surface as the new value-typed oerrors.UnresolvedDemand (Component, FQN, Kind, ladder-ordered Alternatives carrying the D4 different-apiVersion diagnostic, Disqualified carrying the recorded UnifyErrors, plus an UnstatedPosture marker) aggregated by *UnresolvedDemandsError (Unwrap []error); Plan/Compile fail through one exit path beside UnmatchedComponentsError (both reported when both apply, errors.Join'd); Match stays phase-only; unhandled traits follow the effective optional read off the attachment (default-resolved), non-concrete fails closed naming the unstated posture, and Warnings() carries only effectively-optional unhandled traits; plan.Missing stays fed for compatibility. D34/D4: sortFQNsBySemVer renamed to sortContractKeys, delegating to compat.CompareAPIVersions with a lexical tie-break — the measured pathological triple (v1alpha1, v2, v10) now sorts identically from every input permutation, pinned; the Masterminds semver import left the matcher (no match site orders build keys). D32/D37: the single-provider guard runs in indexCatalogs' existing walk — declared fulfilment read (default-resolved) off every REQUIRED embedded copy, provider-fulfilled keys accumulate owning subscriptions structurally, two catalogs for one key refuse materialization naming both paths and the key, divergent fulfilment for one key refuses as a divergent contract, same-catalog plurality and catalog-fulfilled plurality stay legal. D10: the own-graph gate is TestFlow_OwnGraphResolution — the platform subscribes a catalog build divergent from the module's own dependency at a shared contract key; the unify rung must report the divergence (one value under a shared resolution could never conflict with itself) and a render default stated only by the module-side build must reach compiled output. ONE RECORDED MECHANISM DEVIATION (D26/D30): the unify rung does NOT apply compat.StripProvenance — measured at implementation, the strip's Syntax(cue.All(), InlineImports(true)) round-trip cannot rebuild kernel-side schema-derived operands (let-bound references to core helper definitions like #KebabToPascal fail resolution on rebuild, against both the real GHCR catalog and registrytest fixtures), and every export profile that does rebuild them (Eval-first, cue.Final) was measured to OPEN closed definitions, silently voiding the D27 closed-definition comparison. The rung instead excludes provenance-LOCATED diagnostics (metadata.catalogVersion/description directly under any metadata block, any depth) from the unify verdict and the recorded cause — equivalent under D25 (nothing derives from the denylisted fields), closedness preserved trivially, and D30's accepted position-loss cost REVERSED: surviving diagnostics keep document positions. compat.StripProvenance itself is untouched (the publish-side gate's operands export self-contained). SECOND MEASURED FINDING, recorded in the own-graph test: unifying two INDEPENDENTLY-LOADED closed #Resource instances whose spec bodies are both nested struct literals trips a v0.17 evaluator closedness quirk (spurious 'spec.<name>: field not allowed' naming both operands' declarations — adjacent to the documented alpha.2 regression), so the gate's platform-side embedded copies keep spec bodies at underscore or a scalar; a same-key cross-build unify of struct-literal specs in production catalogs would hit the same wall, which the interim duplicate-authoring in catalog_opm avoids today. CATALOG FOLLOW-ON (owed by catalog_opm, not this slice): the transitional duplicate metadata.labels on matching-relevant PRIMITIVES is droppable once this ships — component-side metadata.labels stays meaningful for render reads (hpa_transformer's workload-type lookup) — and the D36 opm.opmodel.dev/workload-type key rename remains unlanded catalog-side (the flip here is key-neutral). MIGRATIONS.md carries the five-bullet Unreleased-Breaking entry; add-migration-guard is not live, so the PR carries no Migration: trailer."
