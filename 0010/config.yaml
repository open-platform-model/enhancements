    event: "Compacted: OQ1-OQ8 and OQ10-OQ17 collapsed to their status tokens; OQ9 kept verbatim; one orphaned finding migrated into D34 first. Seventeen of the eighteen Open Questions drop the prose after their status token, roughly 27 KB, the largest being OQ17, OQ15, OQ12 and OQ6 at 2.4-2.8 KB each. OQ9 is NOT collapsed: it is `answered` rather than resolved-by, so its status line IS the answer and points at no decision — collapsing it would delete content existing nowhere else. EVERY collapse was audited first for content living only in the bullet, and all but one proved safe, each candidate set being already carried in the resolving decision's Alternatives: OQ3's three enforcement sites in D17, OQ6's remove-and-derive pair in D21, OQ8's three dev-checkout candidates in D19, OQ12's (b) and (c) named as such in D30, OQ13's in D35 including the (b) that D14 eliminated, OQ14's in D34, OQ16's three named by OQ-candidate letter in D36, OQ17's four in D37, and OQ15's tie-break and refuse-at-materialize in D14. Two were verified against documents rather than decisions: OQ1's argument that a catalog leaf is not a CUE package name the way a module's is survives in D16's own body, which states it in more detail than the question did, and OQ10's cross-scope ownerReferences obstacle survives at 0012/01-problem.md:98 with the same crd.cue:56 and role.cue:47 evidence. THE ONE ORPHAN was OQ5's, and it was migrated into D34 before the collapse rather than accepted as a loss: a catalog's release prerelease (1.0.0-alpha.2) and a contract's pre-stable level (v1beta1) are independent axes and only the second decides whether D27 binds — a warning that existed in no decision, and one the day-one table makes live rather than hypothetical, since both mainline catalogs are assigned v1beta1 while publishing only 1.0.0-alpha.* today. No decision number moved and no weave was performed; the four WEAVE candidates task compact:plan reports are deferred to their own pass."
