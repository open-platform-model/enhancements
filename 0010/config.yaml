E: every surviving `major` in either entry is a MODULE major (D41's instance-identity invariant at 04-graduation.md:46, 05-risks.md:31, README.md:15, 02-design.md:106/117/180, 03-decisions.md:56/852/858/870/874), a CATALOG major (02-design.md:220's import-churn note, D4's rejected catalog-major keying at 03-decisions.md:86), or D34's apiVersion ladder (03-decisions.md:513/647). Those are correct and were left alone — modules and catalogs do bump majors, and D41 exists precisely so instance identity survives it. 0011 needed no edit: it carried no core-major claim in any document."
