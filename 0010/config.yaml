    event: "Slice plan re-cut 7 -> 13 for execution, and THE CORE MAJOR BUMP IS RETIRED. No decision changes and no Open Question moves; what changes is the granularity of execution and one factual premise five documents rest on. THE PREMISE FIRST, because it is the one with teeth. 06-operational.md ## Semver Impact opens `Breaking, and a core major-version event` and ## Cross-Repo Coordination step 1 reads `publish the new major`. Measured 2026-08-05: `opmodel.dev/core@v1` has published `v1.0.0-alpha.1`, `.2` and `.3` and NO stable `v1.0.0`, so the SemVer compatibility promise has not started and there is nothing a break can break. The change lands in `v1.0.0-alpha.4` with the module path UNMOVED — no `@v1 -> @v2` rename, no import churn, no dual-major coexistence, and downstream retarget is an ordinary `task update-deps` rather than a migration. Live pins confirm the scale: catalog_opm and catalog_kubernetes sit on `alpha.1`, catalog_opm_experimental on `alpha.3`. FIVE STATEMENTS NEED RECONCILING and are listed so the pass is not rediscovered: 06-operational.md:24 (the major-version-event framing), :70 (`Reverting core to the previous major` and `Both majors can coexist` — it is a re-pin to alpha.3, and both ALPHAS coexist), :113 (step 1), 05-risks.md:23 (whose mitigation, `this is a core major-version event, published as such`, becomes STRONGER rather than weaker — the blast radius is the workspace's own enumerable repos, not an ecosystem), and 04-graduation.md:23 (the published-major gate). DELIBERATELY NOT TOUCHED: the `@v2 -> @v3` references at 04-graduation.md:46, 05-risks.md:31 and 03-decisions.md:858 are MODULE majors under D41 and remain correct — modules do bump majors, and D41's whole reason to exist is that instance identity survives it. THE RE-CUT: core-identity-schema splits three ways along the axes the design already separates — core-identity-shape (D1, D6, D8, D38, D40, D41, D43), core-primitive-keying (D4, D21, D25, D33, D34, D44) and core-platform-and-match (D14, D36, D37) — and library-kernel-retarget splits four ways, isolating the dependency bump (library-core-retarget) from the three behaviour changes it enables so each starts from a building tree. The four remaining slices are unchanged. A NEW TERMINAL SLICE, core-alpha-release, is what downstream depends on: the three schema slices land into one unpublished alpha line, so `nothing else can move until this tag exists` needs a single cut point rather than an arbitrary last-in-chain, and the slice's own content is the SPEC.md coherence pass across three changes plus re-vetting schemas/examples.cue. TWO CROSS-ENHANCEMENT EDGES TO 0011 ARE NOW DECLARED, reversing the previous event's `none, deliberately`. That reasoning was right about BLOCKING and wrong about ORDERING, and neither edge blocks anything: core-alpha-release depends on 0011:core-identity-package because #IdentityPackage ships in `core` (0011 D21) and belongs in the same alpha the catalogs and the fleet retarget to; library-subscription-collapse depends on 0011:library-compat-comparator because D14 DELETES materialize/filter.go while 0011's predecessor selection reuses filter.go:112's highestStable — 0011's own 2026-08-01 event calls that a MOVE rather than a delete-and-rewrite, which only holds if the move happens first. Nothing in either plan expressed that ordering before. ONE OVERLAP RESOLVED: modules-fleet-republish here and 0011's modules-publish-cutover both claimed `add each module's identity/identity.cue`. D17 settles it — 0010's step 6 is the only fleet republish and 0011 contributes the mechanism — so the file is created once, in this entry's slice, and 0011's keeps only the tooling deletion and the cutover. ONE CAVEAT RECORDED RATHER THAN FIXED: D42's blueprint flattening moves seven import sites in `modules`, `library` and `cli`, so catalogs-identity-republish is not repo-local the way its `repo: catalog` label suggests; the sites ride along with those repos' own slices, which the