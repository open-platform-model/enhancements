id: "0010"
slug: artifact-identity
title: Module and Catalog Identity
status: accepted
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: core
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
#
# NOTE on `catalog`: the #Area vocabulary predates the catalog split. Here it
# means the live catalog repos — catalog_opm, plus catalog_kubernetes and
# catalog_opm_experimental until D47's consolidation ends their v2 lines
# (their protected v1 maintenance branches remain) — not the deprecated
# `catalog/` tree.
affects:
  - core
  - library
  - cli
  - catalog
  - modules
  # No operator feature code at all: reconcile reads only spec.module.{path,version}
  # and never reads a module's metadata, and there is no live-instance identity
  # migration at all — the deployed fleet is entirely on the v0 schema line and
  # crosses to v1 through a separate migration (D18). Listed because the
  # operator must still be retargeted to the new core/library majors.
  - opm-operator
  # D35's enforcement boundary and D34's ladder belong in the published
  # catalog-author contract, not only in this entry — 04-graduation.md makes
  # that an accepted -> implemented gate, and it had no repo until 2026-08-05.
  - opmodel.dev
created: "2026-07-26"
updated: "2026-08-12"
authors:
  - emil@jacero.se
# Design impact: removes a required field from #Module and changes both the value
# and the shape of metadata.modulePath on a published schema that every module
# and every catalog consumes.
semver: major
# Implementation tracking. status: not-started | in-progress | partial | complete.
# `date` and `notes` allowed only when status reaches `complete`.
implementation:
  status: in-progress
# Append-only timeline of milestones.
history:
  - date: "2026-07-26"
    event: Drafted
  - date: "2026-07-26"
    event: "Initial design recorded as D1-D11 with six open questions. The entry answers one question — what is an OPM artifact's identity, and how does that identity reach the artifact's own bytes — and takes eleven positions on it. The load-bearing four: metadata.modulePath becomes the artifact's COMPLETE CUE module path including the major suffix, and metadata.fqn is that string (D1); #Module declares no version at all, because a full version is a coordinate rather than an identity (D2); #Catalog keeps a full SemVer, but as a compatibility signal that never enters a key (D3); and every primitive FQN becomes MAJOR-keyed, so a catalog's whole compatible series shares one key space and cross-minor installs work (D4). Identity is supplied by a committed, visible identity.cue whose tool-owned fields carry an inert @opm() marker (D5), and those fields MAY be left open — an unfilled field is an absent value CUE refuses to build on, never a wrong value that renders successfully (D6). Evidence is recorded inline per decision and dated; measurements were taken against cue v0.17.1, the workspace registry, and the shipped module fleet."
  - date: "2026-07-26"
    event: "D12 recorded; OQ6 resolved. Every primitive kind — #Resource, #Trait, #Blueprint AND #ComponentTransformer — keeps a REQUIRED metadata.version naming the catalog build its definition came from, and the field is load-bearing at match time rather than informational. It is the matcher's lookup input: from a demanded primitive the matcher derives the owning catalog by LONGEST-PREFIX MATCH over the platform's subscribed paths (not by stripping a fixed segment count, so it holds for flat .../opm/resources@v1 and nested .../opm/resources/workload@v1 alike, and does not depend on OQ3), looks that catalog up in the materialized registry, and reports one of two named failures instead of a bare missing key: `subscribed: false` — this platform has no subscription to that catalog — or `satisfied: false` — it is subscribed but resolved an older build than this module was authored against. Both replace `no matching transformer`, which names neither. D12 SUPERSEDES D10's choice of carrier: the built-against value is read from the demanded primitive rather than from the module's cue.mod deps, because the deps block gives one version per catalog DEPENDENCY and the matcher would have to join back from a primitive to the dependency that supplied it, which needs exactly the OQ3 constraint the prefix match avoids. D10's other holding stands — nothing new is generated, the value already exists in the artifact. MECHANISM: both supply routes stay. Primitives read id.Version at their own definition sites (catalog_opm already does this at resources/configmap.cue:15 and transformers/configmap_transformer.cue:14), and #Catalog's pattern constraint at core/src/catalog.cue:70-76 ALSO keeps stamping version onto every #transformers entry — kept rather than dropped because it is the only STRUCTURAL guarantee available, the pattern constraint owning the #transformers map, while resources/traits/blueprints are reached transitively through required/optional maps and have no site for a constraint to attach to. VERIFIED in schemas/target.cue as #PrimitiveDemand (cue v0.17.1): the supported cross-minor case and a nested primitive path both resolve to the owning catalog, an unsubscribed catalog yields ONLY `subscribed: conflicting values false and true`, and an out-of-date one yields ONLY `satisfied: conflicting values false and true` — the lookup is guarded so a missing catalog does not also emit an index-out-of-range from the sort. NEW RISK recorded in 05-risks: the value is only meaningful while a module's primitive definitions resolve through the MODULE'S OWN dependency graph. That holds today (compile/module.go:137 consumes mp.Transformers as read-only input from a separate resolver), but a single-build render sharing one graph with the platform would let minimal version selection pick the maximum, so a module would report the PLATFORM's catalog version and the lookup would compare a value against itself — silently reverting to the bad diagnostic while appearing implemented. Stated as an invariant of the render path with a graduation gate requiring a test that fails if the two resolutions are ever merged."
  - date: "2026-07-26"
    event: "Risk register revised on operator input; OQ4 narrowed open -> partial. Two risks were challenged on the grounds that OPM has a single operator today who can absorb the migration. ACCEPTED IN FULL for the 0011 sequencing item, which is DEMOTED FROM A RISK TO A DRAWBACK: checked and there is no correctness constraint underneath it, only doubled effort. 0010 landing alone leaves modules at opmodel.dev/modules/jellyfin@v2 — old namespace, new shape — which resolves and renders normally, and 0011 landing first would rewrite a path prefix rather than a full path, which also works. So the combined window is a preference (strictly cheaper, since effort scales with how much is published) rather than a gate, and 04-graduation now says so. ACCEPTED IN PART for the live-instance pruning item. The blast radius genuinely shrinks — the fleet is enumerable from releases/ plus the CLI CR inventory, so this is a one-time single-operator pass rather than an ecosystem event, and that ELIMINATES the operator-tolerance candidate from OQ4: no one-release tolerance for a recorded prior UUID, no transition window, no dual-identity support, all of which exist to protect consumers this migration does not have and each of which would ship code that then has to be removed. opm-operator stays in `affects` for the dependency retarget only, and its config comment is corrected to say so. WHAT DOES NOT SHRINK is the silence: prune.go:107 skips a mismatched delete WITHOUT erroring, so reconcile reports success while garbage collection has stopped. Being the only user makes the fleet fixable, not the problem visible. The mitigation therefore changes shape rather than disappearing — the migration is manual and enumerated, and its exit criterion is a POSITIVE CHECK rather than an absence of complaints: remove a resource from a module, re-render, and assert it is actually deleted from the cluster. That is now an accepted-to-implemented gate, with the explicit note that no errors does not satisfy it. OQ4's residue is a runbook question rather than a design one (relabel in place versus recreate, plausibly differing per instance since stateless workloads can be recreated and stateful ones should not be), so it no longer blocks promotion; OQ5 remains the sole blocking question."
  - date: "2026-07-27"
    event: "D4 REVERSED by D13; D14 and D15 recorded; the sole blocking question dissolved. Primitive FQNs keep the FULL SemVer of the build they came from (path/name@1.2.0, the form core already carries) rather than becoming major-keyed, and the `v` stays only on the module path so an ADDRESS (@v1) and a KEY (@1.2.0) never look alike. Cross-minor compatibility — the capability D4 existed to deliver — is supplied by SUBSCRIPTION BREADTH instead: a platform subscribed to a catalog major materializes every published build in it, so the composed map is the union of those key spaces and each module matches the exact build it was authored against. WHAT CHANGED THE DECISION is that the machinery already exists and D4 would have broken it: filter.go:43-100 returns EVERY survivor of a filter, materialize.go:87-95 pulls each as its own build, and index.go:57-64 documents the invariant it depends on — distinct versions yield distinct FQNs — while calling the collapse path `largely defensive`. That comment is true under SemVer keys and FALSE under D4, where every survivor of a range collides on every FQN and any changed transformer becomes `transformer %q diverges across selected builds`. The e2e failure in 01-problem is accordingly re-diagnosed: a subscription that did not cover the authored-against build, not a keying defect, and 01-problem now says so. THE ARGUMENT THAT DECIDED IT, absent from the entry until now, is reproducibility: under D4 every installed module keys to @vN, so publishing catalog 1.3.0 changes the transformer bodies every installed module renders against with nobody editing a module — under SemVer keys a catalog release is inert until a module is rebuilt. It also degrades better under the one failure OPM cannot control, since a publisher who breaks compatibility inside a major poisons every installed module at once under D4 and only later-built modules under D13. Recorded plainly: core/src/types.cue:41-44 shows FQNs were already lifted major→SemVer under 0001 D5 for this reason, D4 reverted it, and D13 reverts it back — so the entry now states which failure it prefers rather than flipping again. CONSEQUENCES: D3's floor and D12's lookup are retired (nothing to compare when a key names its own build); #CatalogFloor, #SemverTriple and #VersionGTE are deleted from schemas/target.cue and #PrimitiveDemand becomes exact-key containment plus an `availableVersions` set computed by splitting the version off the demanded FQN — which makes the diagnostic BETTER (it names the demanded build and the ones materialized) and independent of OQ3. D14 changes filterVersions' empty-filter default from highestStable to every published build in the subscription key's major, which D1's @vN-bearing #registry key makes the literal reading of the key. D15 adds an explicit prerelease opt-in to #SubscriptionFilter, measured as necessary rather than tidy: catalogs/opm publishes only v1.0.0-alpha* and catalogs/kubernetes carries v1.1.0-alpha (registry read 2026-07-27), so a bare subscription gets one build and `>=1.0.0 <2.0.0` selects ZERO. OQ2 and OQ5 are dissolved rather than answered — the floor they concerned no longer exists and prerelease/0.x builds no longer share a key space — OQ5 having been the entry's only blocking question; OQ3 narrows to diagnostics quality since the lookup that could misreport is gone; OQ6 RE-OPENS, because D12 was its answer and the version is now derivable from the fqn that interpolates it. New: OQ7 (nothing prunes a monotonically-growing materialized set; deferred by agreement, and answerable because fleet demand is enumerable) and OQ8 (a moved-ahead dev checkout supplies keys that look published — OQ2's residue). New risks recorded for a narrowed subscription, unbounded build growth, and the prerelease exclusion; the shared-resolution risk is RESTATED AS WORSE — under D13 a merged module/platform resolution makes a module demand the platform's build, which the platform supplies, so it matches silently against a definition it was never authored on. New drawback: with the version back in the FQN, an open Version leaves the whole key space non-concrete, so D6's `every FQN still evaluates in an unfilled tree` no longer holds."
  - date: "2026-07-27"
    event: "OQ walk: D16-D21 locked; OQ1/OQ3/OQ4/OQ6/OQ8 resolved; OQ9 and OQ10 filed. D16 gives #Catalog no `name` field — measured, nothing reads one in Go or CUE, and the catalogs already carry the kebab->snake projection D8 deleted (leaf `opm-experimental`, `package opm_experimental`) invisibly, because consumers import a catalog's `resources`/`traits` subpackages and never its root. D17 puts the primitive-under-catalog-path rule in 0011's PUBLISH GATE rather than in core, because core cannot express it where the primitives live: `requiredResources?: [#FQNType]: #Resource` holds a catalog's own resources and foreign ones as identical values, so a constraint reached through #transformers would enforce the rule by FORBIDDING 0001 D16's cross-catalog references. Recorded explicitly as NOT delivered: `which catalog ships FQN X` with no platform in hand, since resources sit at `.../opm/resources` while blueprints sit one segment deeper at `.../opm/blueprints/workload`, so no fixed kind-segment count exists. Stale `opmodel.dev/opm/...` doc examples fixed in core/src/{resource,trait,blueprint,transformer,types}.cue (spec-neutral). D18 resolves the live-instance migration as SUBSUMED: the entire deployed fleet (two deployment repositories, named out of band, covering eight environments) pins `opmodel.dev/core/v1alpha1@v1` — nothing is on core@v1, so there is no instance whose identity this entry changes. Two findings recorded as inputs to the future v0->v1 migration: relabel in place NEVER recreate, because opm-operator sets no ownerReferences and ModuleInstance has no finalizer, so deleting the CR garbage-collects nothing and the new instance can never prune the survivors; and the positive check stands, since a skipped prune emits no Event, status field or metric. D19 accepts a moved-ahead dev checkout and warns rather than versioning around it — 0011 experiment 02 measures that publish REFUSES a catalog with a local override even with --allow-local-override, and 0003 experiment 04 measures that the one-hop dev loop already renders local module bytes against the PUBLISHED catalog, so the residue is a developer's false conclusion, addressed by a file-presence check on cue.mod/local-module.cue at render. D20 AMENDS D1: a primitive's modulePath is a PACKAGE path with no @vN, split into #PackagePathType, because D1 widened one shared type and dragged the major onto fields that never read it — the pre-amendment #PrimitiveIdentity computed `_ref.major` and never used it, and a @vN module publishes vN.* tags so `version` already implies the major. This SHRINKS the migration: primitive modulePath values are unchanged from what ships today. D21 resolves OQ6 by keeping `version` required and moving `fqn` from a core derivation to a value each catalog AUTHORS from its identity package, so modulePath, version and fqn all read from one source and a release moves every key by one edit. The cost is measured and accepted: the derivation catches a disagreeing author at the catalog's own cue vet (`conflicting values`), whereas an authored FQN carrying a stale build passes `cue vet -c` with exit 0 — enforcement therefore MOVES to 0011's publish gate (#PrimitiveFQNGate), joining D17's rule in one mechanism. Both rejected alternatives were measured rather than argued: removing `version` leaves a stale key vetting clean, and deriving `version` from `fqn` is a CUE cycle. New: OQ9 (core/src/helpers_autosecrets.cue hardcodes `opmodel.dev/opm/resources/config/secrets@1.0.0` as a LIVE value, which no catalog ships and which D13 makes permanently unmatchable — core naming a catalog primitive is a layering inversion) and OQ10 (ModuleInstance has no finalizer and no ownerReferences, so deletion leaks every resource; ownerRefs cannot be the whole fix because modules render cluster-scoped resources a namespaced CR cannot legally own)."
  - date: "2026-07-27"
    event: "OQ9 answered by removal rather than by design. core `a77a12d` deletes src/helpers_autosecrets.cue and stops #ModuleInstance injecting an `opm-secrets` component, so no core construct names a catalog primitive and there is no identity left to supply. The discovery half survives — #AutoSecrets / #DiscoverSecrets / #GroupSecrets stay in core/src/schemas.cue and catalogs re-export them — and a module carrying secrets now declares a secrets component against its own catalog's #Secrets resource, so the FQN comes from the catalog that owns it like every other primitive's. Two things the question had left open are settled by that commit's own comment: the mismatch was LIVE rather than latent, since the injected component `matched no transformer on the v1 line and failed the render outright`, and the reason is stated in this entry's terms — a catalog's FQN embeds that catalog's version, which core cannot know and must not hardcode. Also closed by removal is the sub-question of whether core should gain an identity package of its own in order to own a primitive: it owns none, so it needs none. OQ10 remains the sole open question."
  - date: "2026-07-29"
    event: "D22 and D23 recorded. D22 SUPERSEDES D5's marker half: the @opm(identity, owner=publish) attribute is dropped from every identity field, and tooling locates what it writes by the SCHEMA-FIXED path instead — #IdentityPackage's ModulePath and Version for a catalog, #Module's metadata.modulePath for a module. D5's committed-and-visible half is untouched; only the attribute goes. The marker was retired on its own evidence rather than on preference. Its stated job was that tooling could locate what it owns without hardcoding names, and 0011 experiment 01 measured 7 of 8 cases resolving `found by name-fallback`, because the attribute says a field is identity and who owns it but never WHICH field it is. Its owner=publish argument is separately contradicted by D6, which supports an author managing the version by hand. Nothing depended on it: #IdentityPackage carried the marker only in COMMENTS, so no gate validated it and task vet could not notice its absence, and experiment 01 finding 3 had already established that a consumer can never see it at all, because a reference does not carry the attribute of the declaration it points at. The `role=version` argument both experiments recommended as load-bearing is REJECTED — its only advantage over a schema-path lookup is tolerating a renamed identity field, which should fail vet rather than be found. What survives is a comment (`// written by opm catalog version set`), which tells the reader the same thing at no cost. D23 RE-AFFIRMS D5's placement half and D7 after both directions of symmetry were re-examined: the catalog keeps an importable identity/identity.cue exporting ModulePath and Version because its leaves compute FQNs across a package boundary, and the module keeps a root-package identity.cue writing metadata directly. Catalog-to-root is structurally unavailable (import cycle, measured at D5); module-to-subpackage was already rejected at D7 for restating the module's own path in an import, and D23 adds the cost D7 did not record — 0011 OQ6's owner-scoped namespace migration rewrites the path PREFIX, which self-imports carry even though they omit the major. Symmetry of shape without symmetry of placement (a hidden _modulePath mirroring the catalog's exported constant) is available and cheap and is rejected as unpaid-for: under D2 a module declares no version and under D6 its modulePath is derivable from cue.mod/module.cue, so the module half of the writer has nothing to decide."
  - date: "2026-07-29"
    event: "OQ10 deferred to 0012, and corrected on the way out. 0012 (Kubernetes as a First-Class Kernel Platform) had already absorbed the question — its OQ4 is this one restated against its own candidates, and its graduation gate makes answering it mandatory on the grounds that it is half that entry's scope. Two of OQ10's factual claims were wrong and 0012 measured them: ModuleInstance DOES carry a finalizer (opmodel.dev/cleanup, moduleinstance.go:38, registered :97, driving a tested handleDeletion at :590), so `no cleanup path` was false; the ownerReferences claim was true (zero SetControllerReference/SetOwnerReference/OwnerReferences outside generated and vendored trees). Three gaps OQ10 did not see are recorded in 0012/01-problem.md: spec.prune has no CRD default and defaults to false, so the finalizer's DEFAULT behaviour is to orphan; handleCLIOwned deliberately registers no finalizer, so kubectl delete on a CLI-owned instance destroys the only inventory record and orphans every workload; and an ownerReference garbage-collects regardless of controller or blockOwnerDeletion, which makes OQ10's own additive-references candidate a silent contradiction of prune:false rather than a fast path over it. Nothing in 0010's scope depends on the resolution — this entry fixes what identity IS, and the deletion protocol reads identity without 0010 having an opinion on ownership. `related` gains 0012 to make the handoff traceable in GRAPH.md. WITH OQ10 DEFERRED AND OQ7 DEFERRED BY AGREEMENT, 0010 CARRIES NO BLOCKING OPEN QUESTIONS."

  - date: "2026-07-29"
    event: "D24-D28 recorded; D13's keying half and D14's role REVERSED; OQ11-OQ15 filed; OQ7 reframed. The trigger was a scenario the entry could not serve: a generic `backup` resource and trait defined in catalog_opm with NO transformer of its own, fulfilled by a k8up provider catalog the platform installs. Under D13 the demand key carries the catalog_opm build the MODULE compiled against and the supply key carries the build the PROVIDER compiled against — `materialize/pull.go:23` loads each catalog as its own root, so the provider's own cue.mod fixes it — and the two must be EQUAL. D14's breadth cannot repair it: subscribing to every catalog_opm build supplies every build's own transformers, and a provider-fulfilled primitive has none, so coverage is the set of catalog_opm versions the provider's release history happened to pin. Every catalog_opm release breaks the contract until the provider re-releases AND every module is rebuilt to match — an N x M lockstep between two independently-released catalogs. D24 SPLITS THE KEY BY ROLE: resources, traits and blueprints key on a per-primitive `apiVersion` (`path/name@v1`), a contract major moved only when that primitive's shape breaks and independent of both the catalog's module major and its release SemVer; transformers keep the full build SemVer, which is what keeps materialize/index.go's distinct-versions-distinct-keys invariant true and is the mechanism that made D4 unworkable. The split follows the demand direction — a module demands resources and traits and never demands a transformer. D4's catalog-major keying was rejected separately and on its own grounds: one version namespace per catalog means breaking one trait needs a catalog major bump, so in practice it never happens and the promise becomes unenforceable, whereas a per-primitive version gives a catalog a cheap legitimate way to break one contract on purpose — and admits two apiVersions of one primitive shipping SIDE BY SIDE, the migration path SemVer keys cannot express. D25 adds `apiVersion` as an authored field (the one identity value NOT derivable from identity/identity.cue, which is why it is a field rather than an interpolation) and renames `version` to `catalogVersion`; `moduleVersion` was rejected because `module` already means three things in OPM and would read as the field D2 deleted. D27 states the promise the key now rests on: inside one apiVersion, add never remove, a new field must be optional or defaulted, and an existing field's default is IMMUTABLE. D26 is the finding that makes any of it work, and it was not predicted: experiments/02-primitive-closedness-skew measured that with catalogVersion an ordinary metadata field, EVERY build skew fails on `metadata.catalogVersion: conflicting values` whether or not the shapes agree — major keys exist so two builds can meet at one key and the provenance field stops them meeting at all. Provenance is therefore excluded from the operands BEFORE unification; the mechanism is deliberately open (OQ12), and cutting at `spec` instead was measured and rejected because closedness is inherited from the enclosing definition, so an inline spec body silently drops a field the module set while a named schema definition catches it — and catalog_opm ships both styles. The same experiment measured the property the whole model rests on: a provider older than the contract fails LOUDLY (`spec.backup.retention: field not allowed`) exactly when the module uses what the provider lacks, and passes when it does not. D28 makes an unresolved demand an error — every declared resource required, traits opt-out — on the finding that `plan.Missing` has no production consumer at all (populated match.go:130, read only by tests) and there is no UnhandledResources counterpart, so a component with a container and an unsupplied backup renders successfully today with no backup. WHAT THIS COSTS is recorded rather than glossed: D13's reproducibility argument survives and RELOCATES — the key no longer pins the transformer build, so the platform's subscription must, and it currently floats (filter.go:43-47 highest-stable, Resolved in-memory only). That is OQ11 and it is the one place the new model is worse until answered. OQ15 supersedes OQ7's framing: breadth loses its job but stays structurally available, and if kept it acquires a failure D14 never had — several builds of one transformer in one contract bucket, all satisfying the predicate, all rendering."

  - date: "2026-07-29"
    event: "D29 recorded; OQ11 RESOLVED and OQ7 dissolved; D14 and D15 superseded in full; OQ15 narrowed. A subscription now NAMES the catalog builds it materializes instead of resolving them: `#SubscriptionFilter` collapses to a single required, non-empty `versions` list, `allow` renamed, `range` and `deny` deleted, and the empty-filter default deleted with them. Catalog selection becomes a pure function of committed source — no highest-stable rule, no Masterminds constraint solving, no registry ordering, no maturity inferred from constraint syntax — so git-identical inputs materialize identical catalog bytes on any day, from any machine, WITHOUT a lockfile, because with no range there is no resolution to record and the platform file already is that record. This closes OQ11, which D24 opened as its own price of admission: D13's key had pinned the transformer build a module rendered against, D24's contract key pins nothing, and the platform's subscription floated (filter.go:43-47 highest-stable; MaterializedPlatform.Resolved verified 2026-07-29 to have exactly ONE non-test consumer in the whole workspace, cli/tests/integration/platform-materialize/main.go:95, with a doc comment instructing callers they MUST NOT branch on it). OQ11 candidate (a) was taken and widened to a LIST so deliberate breadth stays expressible; candidate (b)'s lockfile is not deferred but redundant. WHAT MADE THE COST LOW is that D24 had already removed breadth's reason — D14's whole-major default existed to cover the fleet's AUTHORSHIP history under build-keyed contracts, and a contract key means one build satisfies every module in the major — so the list is length 1 in the normal case rather than a growing enumeration. D15 goes with D14: its prerelease opt-in existed only to reconcile 'the default selects every build in the major' with 'prereleases need opt-in', and a literal 1.0.0-alpha.2 in `versions` is selected by being written down. CONSEQUENCES: OQ7 (nothing prunes a monotonically-growing materialized set) is dissolved — the set is exactly what the platform wrote, so pruning is deleting a line, and all three of its candidates assumed a set the platform did not choose. OQ15 keeps only its second half, now reachable only on purpose: two NAMED builds of one catalog shipping one transformer both land in a contract bucket, both satisfy the predicate, both render — which makes its candidate (c), refusing at materialize time, cheaper to justify than it was, since it refuses something an author typed rather than overriding a default they never chose. Two risks in 05-risks are RETIRED (a catalog release moving every render with nothing in git changing; the unbounded materialized set) and the prerelease risk is re-mitigated by D29 rather than by D15's flag. The reversibility argument is recorded as the reason to prefer subtraction now: reintroducing `range` beside a lockfile later takes nothing away from a platform that already names its versions, while an established floating default cannot be withdrawn cheaply. EVIDENCE beyond this entry: the failure is not new and D24 did not create it — enhancement 0006 OQ18 records CI `-dev` tags sorting above `alpha` and winning every prerelease-tolerant range, analysed in 0006/research/dev-tag-range-pollution.md, already patched once for the demo platform by pinning exactly (0006 A5) with the CLI's seeded `>=1.0.0-0 <2.0.0-0` still exposed. D24 removed the tripwire that made the remaining instances announce themselves, converting a loud match failure into quiet output drift. SEPARATELY CORRECTED, because D29's rationale depends on stating it accurately: D24's rationale and OQ11 both read 'under D27 any build in the major is a legal supplier', which is wrong in the permissive direction. D27's own measurements are asymmetric — a supplier at or above the build a module compiled against is unconditionally safe, an OLDER one is safe only while the module stays inside the fields that build already had and fails loudly (`spec.backup.retention: field not allowed`) the moment it does not. Corrected in D24, OQ11, 05-risks and 02-design. schemas/target.cue rewrites #SubscriptionSelection to the D29 shape (versions required and non-empty, selected = versions, one remaining rule that every named build sits in the subscription key's major) with both MUST-FAIL cases confirmed against cue v0.17.1: a wrong-major build yields `_majorAgrees.0: conflicting values '1' and '2'` and an empty list yields `versions: incompatible list lengths (0 and 1)`. 04-graduation drops OQ11 from the blocking set, leaving OQ12 and OQ15."

  - date: "2026-07-29"
    event: "D30 recorded and OQ12 RESOLVED; D26's label rationale CORRECTED; OQ16 filed. D26 had fixed that provenance leaves the match comparison on the way IN and deliberately left the mechanism open. D30 takes candidate (a) — a Go-side filter over both operands, so `core`'s primitive shape does not change — and fixes the half D26 did not reach: the filter is a DENYLIST naming `metadata.catalogVersion` and `metadata.description`, keeping identity, `labels`, and every future field in the comparison by default. The denylist is the load-bearing choice, not the field list. D26 rejected the error-path filter (c) because it forgives ANY metadata conflict including an `apiVersion` or `fqn` disagreement; an allowlist over `metadata` reintroduces exactly that by another route, which would make choosing (a) over (c) cosmetic, and it fails OPEN — a contract-bearing field added to `core` later goes silently uncompared, which is the class D27 and D28 exist to eliminate. A denylist fails CLOSED: its worst case is a loud spurious match failure naming the field to add to the list. MEASURED in the new experiments/03-provenance-operand-filter (cue v0.17.1, 8 of 8 cases as predicted), because (a) was the one candidate never measured — `cue.Value` is immutable with no field removal, so the filter is a syntax round-trip, and experiment 02's finding 1 had already shown that changing what is fed to Unify can silently drop closedness. It does not: the closedness probe held on every rebuilt operand and the lagging-provider-uses-the-added-field case still fails `field not allowed` in BOTH spec-body styles, so (a) is available and candidate (b)'s structural split in `core` is unnecessary. Case 8 is new and settles the field list against assumption: two builds whose contract surfaces agree completely, differing only in `catalogVersion` and a reworded `description`, FAIL when only `catalogVersion` is stripped. Two things the experiment declines to claim, recorded rather than glossed: (c) and D30 agree on all eight cases and NO fixture can separate them, because the identity fields that would are structurally forced into agreement by the map key being `fqn` — so the argument for (a) is defense in depth, not measured correctness; and the round-trip rewrites the leading segment of a CUE error path to `_#def.`, which `oerrors.UnifyError` absorbs because it already carries Component and FQN structurally, but which breaks anything pattern-matching the message. SEPARATELY CORRECTED, because D30's rationale depends on stating it accurately: D26 and OQ12 both justified keeping `labels` on the ground that component labels are the union of the attached primitives' labels. There is no union. `core/src/component.cue`'s `_allFields` comprehension unions the primitives' `spec` bodies only, and the union wording at `component.cue:18-24` is a doc comment with no implementing code. A catalog actually ships two declarations per primitive — the primitive, and a component fragment beside it — and embedding fragments is what unifies component labels, on a path `unifyIntersection` never touches. A primitive's own `metadata.labels` has no reader on the match or execute path. The conclusion survives (labels stay in, because the denylist keeps what it does not name); the stated mechanism did not. Corrected in D26 and OQ12. The contract surface the union argument was reaching for is real and is now OQ16: the component fragment sets the labels `requiredLabels` selects on and reaches `#context`, yet sits outside both D27's promise and the match comparison. OQ16 does not gate promotion — the failure it describes is loud (`compile/errors.go:40` reports missing labels), not silent. 04-graduation drops OQ12 from the blocking set, leaving OQ15 alone, and gains an accepted->implemented gate with three checks that distinguish a shipped denylist from an allowlist."
  - date: "2026-07-30"
    event: "D31, D32 and D33 recorded; OQ15 RESOLVED, OQ17 filed, OQ13 narrowed. The blocking set is now EMPTY — no Open Question gates promotion. D31 supersedes D29's list shape: a subscription names exactly ONE catalog build in a required SCALAR `version`, `#SubscriptionFilter` is deleted rather than reduced further, and two builds of one catalog is two platforms. This DISSOLVES OQ15 rather than answering it, the same move D29 made on OQ7. D29 had kept `versions` a list on the reasoning that deliberate breadth stays legitimate; examined directly it is not. A module cannot demand a transformer (D24), so there is no per-module migration for breadth to stage; a single build ships two apiVersions of a contract side by side, so contract coexistence needs no second build; testing a new build beside an old one is two platforms, which is already expressible and names both behaviours; and the one case breadth uniquely served — a build that DROPPED a transformer, where listing both yields A@1.2.0 plus B@1.0.0 — describes a catalog that broke compatibility without saying so, which D28 now fails loudly on and which the catalog author should fix. The tie-break candidate (b) was rejected on the ground that it would make listing two builds indistinguishable in effect from listing one in every case EXCEPT that catalog bug: a silent arbitration bought to serve a scenario that should fail loudly. The singular spelling was the author's explicit call over a one-element-list alternative that would have made re-widening a pure relaxation; the cost — reopening multi-build is now a breaking rename — is recorded in D31 rather than left to be discovered. Consequences beyond the shape: `filter.go` is deleted rather than reduced to a validation pass, `_majorAgrees` collapses from a comprehension to one comparison, and OQ13 loses candidate (b) entirely, because materialize never holds two builds of one catalog — its answer space is now publish-side-only or a registry round-trip, with the free option gone. D32 takes OQ15's candidate (c) and RETARGETS it: with same-catalog breadth gone, a #matchers bucket holding two transformers means two DIFFERENT catalogs supply one contract, and that is a materialize-time error naming both. The invariant is stated rather than heuristic — every contract bucket resolves to exactly one transformer, or materialize fails — which is what lets `compile/match.go`'s candidate loop stay unchanged: it pairs every candidate that unifies and satisfies the predicate, and never needs arbitration because the arity is guaranteed upstream. Two implementation choices are load-bearing and recorded as such. The check lives in the KERNEL, not in a CLI lint, on the same argument OQ13 makes against publish-only enforcement of D27: a check the operator never runs is not a guarantee; the CLI platform walker is a convenience on top. And the owning catalog is read from `catalogBuild{Subscription, Version, Value}` provenance rather than parsed back out of a transformer FQN, because D17 makes primitive-under-catalog-path a publish gate and not a schema constraint. The author's weights proposal was rejected: a weight sits on the catalog so one number arbitrates every contract two catalogs share and cannot say k8up-wins-backup-velero-wins-restore; making it required taxes the overwhelming majority of platforms that have no overlap with a field that is inert in their case; and a number records no reason. If an override ships it should be an explicit per-contract binding or an ordered prefer list — reviewable source rather than arithmetic — which is OQ17. OQ17 is filed rather than answered because the case does not exist yet: MEASURED 2026-07-30, every transformer in catalog_kubernetes imports resources only from catalog_kubernetes (27 self-imports, zero foreign), and catalog_opm and catalog_opm_experimental are likewise closed over their own resources, so the cross-catalog pairing D24 exists to enable is entirely prospective and D32 breaks nothing today. OQ17 names the one overlap with no exit — a catalog that DECLARES a contract and also ships an implementation, against a provider catalog with a better one, where the author cannot resolve the error by dropping a subscription. D33 closes the last non-OQ design gate by deletion: `#definitionName` is removed from #Module (module.cue:27) and #ComponentTransformer (transformer.cue:24) because NEITHER HAS A READER, and no snake-aware projection is needed anywhere because the three kinds that do consume it — resource.cue:35, trait.cue:34, blueprint.cue:42, each building its spec! key via strings.ToCamel — keep kebab-case names under #NameType while only #Module.name goes snake under D8. Reader set measured the same day across core, library, cli, the three catalogs, modules and opm-operator. schemas/target.cue rewritten for the scalar with all three MUST-FAIL cases re-verified against cue v0.17.1: wrong major fails `_majorAgrees: conflicting values`, a list fails `version: conflicting values [...] and string (mismatched types list and string)`, and the absent field fails `version: field is required but not present` — the last only under `cue vet -c`, which is recorded beside it because D29's empty list had failed under plain vet and that detection strength changed."
