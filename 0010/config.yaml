    event: "The migration inventory's central finding CORRECTED on author input, and the collection gap CLOSED BY DATA. The fleet does not resolve through CUE's default central registry — it resolves against ghcr.io/open-platform-model, and the reason the operator Deployment shows no registry configuration is that it needs none: opm-operator/cmd/main.go:94-98 gives the --registry flag a COMPILED-IN DEFAULT of 'testing.opmodel.dev=ghcr.io/open-platform-model,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'. The 2026-07-30 observations were all accurate (no env, no arg, no mounted config, verified again 2026-07-31 including envFrom); only the inference from them was wrong, and nothing in the cluster object could have shown otherwise because the value is in the binary. GHCR enumerates completely through gh api --paginate: 53 packages, recorded as inventory section 3b, and EVERY live coordinate is present at its deployed version — including all three modules the workspace registry lacks entirely, radarr/sabnzbd/sonarr each carrying v1.0.0-v1.0.2. So the gap that gated SCHEDULING the migration is closed, and the draft->accepted inventory gate is now satisfied by data rather than by a stated absence. The two-registry finding SURVIVES and remains operative — the registries are neither subset nor superset, 74 repositories locally against 53 packages on GHCR — it simply constrains the runbook instead of blocking it from being written. THREE DEFECTS SHRANK on the same read. The opm_experimental spelling collision is WORSE than recorded in one respect and unchanged in kind: both spellings are published to GHCR as well as to localhost:5000, so the canonicalisation is a two-registry deletion. opmodel.dev/modules/opm-platform is ABSENT from GHCR, existing only on localhost:5000 alongside the library/testdata fixture, so both are dev-registry hygiene rather than wrong inputs to a fleet migration. And the source-tree/registry reconciliation loses most of its content, since radarr, sabnzbd and sonarr are published on GHCR at exactly their deployed v1.0.2, leaving only cdi and snapshot_controller sourced-but-unpublished-anywhere. 04-graduation records all three as cleanup rather than as gates. TWO NEW FINDINGS, neither predicted. resolveRegistry (main.go:334-342) documents its precedence as --registry > OPM_REGISTRY > CUE's built-in default and returns the flag value whenever it is non-empty; because the flag's default IS non-empty, both lower tiers are UNREACHABLE — setting OPM_REGISTRY on the operator does nothing, and CUE's own resolution is never used, unless a caller passes --registry='' explicitly. That matters directly to the planned move, since retargeting the fleet needs the flag or a new default and not an environment variable. Second, opmodel.dev/modules/test/podinfo carries roughly SEVENTY -e2e.g<sha> prerelease tags in MODULE space — enhancement 0006 OQ18's dev-tag pollution in a namespace that entry did not examine; harmless under D14 since a platform names one build, but noise the 0011 D5 namespace move must carry or drop deliberately. RECORDED FOR SEQUENCING: a dedicated central registry on ZOT is planned to replace the GHCR arrangement. It changes nothing about what the migration does, since neither 0010's identity values nor 0011 D5's namespace depend on which host serves the bytes, but doing the namespace move into GHCR and then moving hosts pays the republish cost twice — the same argument that makes the joint 0010/0011 window a preference — so 06-operational says to sequence the two together or move hosts first, and marks it a scheduling decision owned by the Zot rollout rather than a design one."
