    event: "Compacted (pass 2 of 2): the two chains woven to their lowest numbers. D13 and D24 merged into D4; D15, D29 and D31 merged into D14. Five tombstones, bringing the entry to eight. D4 now holds the contract/build key split — resources, traits and blueprints keyed by their own apiVersion, transformers by the build SemVer — and carries SEVEN alternatives, because this decision flipped twice and both discarded positions were actually adopted rather than hypothesised. Catalog-major keys (D4's own original content) are folded in as originally-adopted-then-reversed with BOTH defects that killed them recorded: reproducibility, since every installed module keyed to @v1 so publishing 1.3.0 changed the transformer bodies every already-installed module rendered against; and granularity, since one namespace per catalog means breaking one trait's shape needs a catalog major bump, so in practice it never happens and 'v1 means v1' becomes unenforceable. Full-SemVer keys plus subscription breadth (D13's content) are folded in as subsequently-adopted-then-reversed, rejected on the cross-catalog coverage failure — the backup/k8up walk is preserved verbatim in D4 because it is the evidence that forced the split and is reproduced nowhere else. D14 now holds the single-build subscription and carries TEN alternatives spanning three adopted-then-reversed positions: the whole-major default (D14's own original content), the prerelease opt-in flag (D15) with its registry measurement intact, and the required non-empty versions LIST (D29) reduced to a scalar by D31. Citation handling was split by kind rather than swept blind, and the first attempt at a blind regex is why: it produced ~25 self-referential sentences ('D29 then removes the list D29 kept', 'D14+D14', 'RETIRED BY D14 ... Under D14') because narrative prose describes the supersession HISTORY, not just the current design. That sweep was reverted and redone as 39 hand restatements plus 62 mechanical renumbers. The rule applied: NARRATIVE documents name the live decision, so the superseded approach is now referred to descriptively ('under the build-keyed contracts D4 replaced', 'the whole-major default D14 originally carried') rather than by a dead number; the DECISION LOG keeps its historical references, which the tombstones resolve, so 'D13 retired D12's catalog lookup' and 'this is D13's own objection to D4' stand as written. Normative references inside LIVE decisions were retargeted (D32's 'After D31' -> 'After D14', D27's 'Under D24' -> 'Under D4', D25, D28, D3, D21), since a live decision stating current behaviour should not point through a tombstone. 162 narrative citations touched across 02-design, README, 04-graduation, 05-risks, 06-operational and schemas/target.cue. The cost this pass accepted, stated plainly: this entry's central decision — the contract/build key split — now sits at D4, a number whose original content was the rejected catalog-major scheme, and enhancement 0011 cites 0010 D24 externally and now reaches it through a tombstone. That is what the lowest-number rule requires, and the tombstones are what keep every external citation resolving."
