    event: "D44 recorded, amending D25's apiVersion clause: A TRANSFORMER IS AN ADAPTER, NOT A PRIMITIVE, and apiVersion is primitive-only. The conflict was between two DECISIONS rather than between schema and prose, and nothing recorded which won: D25 (2026-07-29) opens `#Resource, #Trait, #Blueprint and #ComponentTransformer gain a required metadata.apiVersion`, D34 (2026-07-31) states `Transformers take no apiVersion — they keep the build SemVer (D4), so the ~50 of them are unaffected`, and D25 carried no revision note, so schemas/target.cue followed the earlier one while 02-design.md:193 followed the later. THE TAXONOMY IS ALREADY NORMATIVE IN CORE and neither decision cited it: core/SPEC.md:38 enumerates `the primitives #Resource and #Trait, the constructs …, and the ADAPTER #ComponentTransformer`, and :34 gives the reason — `Forcing transformers into the composition graph would mean every primitive needs a target-specific arm — an explosion that doesn't compose. Adapters sit beside the model, not inside it.` So D25's four-kind list contradicted SPEC.md, not merely D34. FIXED AS A CATEGORY RATHER THAN AS A FIELD, because the shared shape is the mechanism: #PrimitiveIdentity was named after three kinds and admitted a fourth, so every field added to it lands on the fourth for free — apiVersion is the one that bit, while D37's fulfilment and D36's matchLabels were each kept off transformers BY HAND, and the next field would need the same manual exclusion or acquire the same defect. #PrimitiveIdentity now covers the three primitives and narrows fqn to #ContractFQNType; a new #TransformerIdentity carries name + modulePath + catalogVersion + #ImplFQNType and NO apiVersion; there is deliberately NO shared parent, since a parent straddling a split SPEC.md draws on purpose is where the next field lands ambiguously, and the duplication it avoids is four lines. #ContractIdentity and #ImplIdentity are RETIRED — they were the parent plus an fqn narrowing and had nothing left to add. D25's catalogVersion RENAME IS UNAFFECTED and still applies to all four kinds: a transformer's catalogVersion is its own key's source component (D4) and the provenance both ends of a match read (D26). THE COST OF THE OTHER DIRECTION IS NOT TIDINESS: with an apiVersion present, 0011 D9's gate — `for every primitive in the tree … pull the last published build that shipped a primitive of that name at that apiVersion` — RESOLVES for transformers, and the additive-only rule then refuses ORDINARY catalog releases, since changing rendering logic, dropping an emitted field and narrowing an output type are all normal transformer edits and all D27 violations. That inverts D4, which keeps the build in the transformer key precisely BECAUSE a transformer is free to change. 0011 D9 gains an explicit primitives-only clause anyway, because that sentence is what an implementer reads. #Blueprint IS A PRIMITIVE (user decision, against SPEC.md's current classing): it composes resources and traits but is still a fundamental building block a component attaches and whose spec modules write against, so it keeps its apiVersion and its contract key, and core/SPEC.md:29 and :38 move it from Constructs to Primitives — a SPEC co-update gated by core-schema-edit, and the one edit in this entry that changes the TAXONOMY rather than a field. D37's exclusion of #Blueprint from fulfilment is unaffected and stands on its own structural ground (core/src/transformer.cue:54-64 has requiredResources and requiredTraits and no blueprint equivalent, so a transformer can never demand one), which makes a blueprint a primitive NOTHING DEMANDS rather than a non-primitive. TWO RENAMES, both free today because neither shape exists in shipped code and identity/identity.cue carries only ModulePath and Version: #PrimitiveFQNGate -> #CatalogMemberFQNGate and #IdentityPackage.primitivePrefix -> kindPrefix. Both genuinely cover transformers — the gate checks a transformer's package path (D17's rule binds it) and its build-keyed FQN — so the correction is to their NAMES, not their arms, and D42's exactly-one-prefix-per-kind rule constrains the renamed field unchanged. MEASURED against cue v0.17.1 the same day: apiVersion on a transformer is now INEXPRESSIBLE rather than merely unread, since #TransformerIdentity is closed (`_transformerWithAPIVersion.apiVersion: field not allowed`); and #CatalogMemberFQNGate needs no restructuring, because declaredAPIVersion becomes optional with a conditional `if kind != transformers` requirement while _keyVersion is unchanged — its transformer branch selects identity.Version BEFORE declaredAPIVersion is reached and CUE's laziness spares the absent optional (transformer absent -> yields the build, no error; contract supplying -> yields the apiVersion; contract omitting -> `declaredAPIVersion: field is required but not present`). Three wording-only sites left as they are, substantively correct and loose in the same way — D1 (#PackagePathType on four kinds, right because a transformer does declare a package path), D21 (version! required on `every primitive kind`, right for all four under its catalogVersion name) and D17 (whose rule binds primitives AND transformers): each says primitive where it means catalog member, and none changes meaning."
