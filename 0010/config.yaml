    event: "Compacted (weaves): D39 woven into D9 and tombstoned; D44's scope narrowing woven into D25 with D44 kept as its own decision. TWO of the four candidates `task compact:plan` reports were taken, and the two D38 candidates were deliberately left. D9 IS THE FULL WEAVE and was the clean one: single subject, no external citations, and a title — `The resolved-coordinate label is stamped once, by the kernel` — that had become flatly false, which is the read-order hazard in its purest form. D9 now states the schema-declared, kernel-verified label directly; the kernel-stamp position it originally adopted moves into Alternatives carrying the measurement that killed it, that `cli/internal/workflow/render/module.go:99` renders a local directory and so has no coordinate to stamp, together with the note that 04-graduation's byte-identical-render gate cannot catch it because both sides of that comparison acquire from a registry. Seventeen narrative and schema citations retargeted D39 -> D9 across README, 02-design, 04-graduation, 06-operational, target.cue and examples.cue, plus one EXTERNAL citation in 0011 D18's Source line; per the compaction convention the superseded approach is now named descriptively rather than by a dead number. D25 IS THE PARTIAL WEAVE, following this entry's own D34/D27 precedent rather than compact:plan's literal proposal. D25's Decision now states the three-kind `apiVersion` scope where the field is defined, and the four-kind position moves into its Alternatives carrying the cost that decided it — with an apiVersion present, 0011 D9's gate resolves for transformers and the additive-only rule then refuses ordinary catalog releases, inverting D4. D44 is NOT tombstoned: it independently settles the primitive/adapter taxonomy, moves #Blueprint from Constructs to Primitives with a gated SPEC.md co-update, splits #PrimitiveIdentity from #TransformerIdentity, and carries two renames — folding it wholesale would make D25 about two subjects and lose the taxonomy as a citable decision that 0011 D9 cites externally. Its amendment framing is replaced by a pointer to D25, exactly as D34's was to D27. THE D38 CANDIDATES REMAIN OPEN and are the one place compact:plan's output cannot be applied as given: it proposes D38 into both D2 and D23, which are mutually exclusive, and D38 is externally cited by 0011 D12 as a landing contingency. Deciding which subject D38 belongs to is a design judgement rather than a mechanical merge, so it is left for a pass that can be reviewed as one."
