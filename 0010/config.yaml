    event: "Compaction pass before promotion, WEAVE and TOMBSTONE only per the draft-status gate — resolved Open Question prose is left untouched and unlocks at accepted. TWO WEAVES, NO TOMBSTONES, no number vacated. (1) D37's correction of D32 is woven INTO D32, which now states the corrected test directly instead of carrying a stacked rider; the bucket-arity position moves into D32's Alternatives marked ORIGINALLY ADOPTED HERE THEN REVERSED, carrying the measurement that killed it (catalog_opm's own #ContainerResource bucket holds 8 transformers and #VolumesResource 6, all one catalog, because materialize/index.go:82-95 indexes required UNION optional and one contract feeds many outputs; 15 trait buckets hold 3-7 each). D32 is retitled from `Two catalogs supplying one contract` to `Two providers supplying one contract`. D37 keeps its number and its own subject (the fulfilment field) and its correction paragraph shrinks to a pointer so the measurement lives in exactly one place. (2) D34's NARROWING of D27 is woven into D27, which now states that the additive-only rule binds at beta and GA and not at alpha; uniform binding moves into D27's Alternatives as originally-adopted-then-narrowed. D34 is DELIBERATELY NOT TOMBSTONED, diverging from `task compact:plan`'s literal WEAVE D34->D27 proposal: D34 is not merely an amendment — it defines #APIVersionType's three forms, the day-one per-catalog assignment, the sortFQNsBySemVer comparator split and four reasoned exclusions from Kubernetes — so folding it wholesale would make D27 about two subjects and lose the ladder as a citable decision. Its amendment framing is replaced by a pointer to D27. Both surviving decisions gained a **Revised:** line and kept their original **Source:**. Narrative documents cleaned in the same pass: README's summary paragraph and the materialize/index.go cross-reference row both stated the retired bucket-arity mechanism and now state the fulfilment-keyed one."
