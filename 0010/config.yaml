    event: "OQ walk: D34 and D35 recorded; OQ14 and OQ13 RESOLVED. EVERY OPEN QUESTION IN THE ENTRY IS NOW CLOSED. D34 takes the Kubernetes ladder — vNalphaM -> vNbetaM -> vN — and keys D27's additive-only rule to the LEVEL rather than applying it uniformly: alpha promises nothing and 0011 D9's publish gate does not run against it, beta and GA are gated in full, and a break at either is redirected into a bump that may ship beside its predecessor. This AMENDS D27's scope rather than reversing it. Day one is settled per catalog rather than per primitive: v1beta1 for catalog_opm's 38 contracts and catalog_kubernetes's 27, v1alpha1 for catalog_opm_experimental's 3; transformers take no apiVersion at all under D4. The uniform alternative was offered and REJECTED ON COHERENCE — gating alpha enforces additivity on the one level whose definition is no additivity promise, which empties the label. v1alpha1-across-the-board was rejected on measurement: catalog_opm's entire contract history is 715 field-declaration additions against 30 removals (2815 lines added, 118 deleted), and most of the 30 are the blueprint propagation-guard hoist rather than contract surface, so these catalogs have behaved like beta or better since bootstrap and alpha would be a label their own history contradicts. WHAT KUBERNETES DOES THAT OPM DOES NOT IMPORT is recorded with a reason each: conversion and storage versions, because k8s persists objects while OPM renders, so two apiVersions are two independent contracts a module chooses between; feature gates, because OPM has no per-primitive opt-out and the nearest analogue is coarser and already exists as catalog_opm_experimental being a separate subscription; and deprecation windows, because k8s's exist to survive forced cluster upgrades while under D14 a platform moves only when someone edits version: in its own source. TWO CONSEQUENCES recorded rather than left to be discovered. 0011 D9's gate becomes LEVEL-AWARE — it defers to D27 by name so the carve-out propagates by reference, but its own wording says every primitive in the tree; what alpha gives up is narrow and specific, since closedness still fails a removed field loudly at match time, leaving only the default drift experiments/02 measured, confined under this assignment to three contracts. With both mainline catalogs at beta the gate is load-bearing from day one rather than deferred to v1, which raises the priority of the unmeasured cue.Value.Subsume question. And admitting the alpha/beta forms EXPOSES A DEFECT ALREADY IN THE TREE: measured 2026-07-31 against Masterminds v3, v1alpha1/v1alpha2/v1beta1 all fail to parse as SemVer, so compile/match.go:322-336's sortFQNsBySemVer falls back to lexical and orders v1 ahead of its own pre-releases — and worse, the comparator switches rule per pair, making v1alpha1 < v2, v2 < v10 and v10 < v1alpha1 all true, so the same three FQNs sort to [v2,v10,v1alpha1] or [v1alpha1,v2,v10] depending on input order. The kube-aware comparator D34 requires is also the fix. schemas/target.cue gains #APIVersionGated — the one place the ladder is INTERPRETED rather than matched, and still no ordering — and #ContractCompatibility's three clauses become conditional on it, with the beta MUST-FAIL confirmed against cue v0.17.1 (_betaBreak.subsumes: conflicting values true and false) and the alpha counterpart asserted to PASS, which is the case that distinguishes a level-aware gate from a merely thorough one. D35 then closes OQ13 by ACCEPTING publish-side enforcement as the whole of the guarantee and saying what that costs: a catalog published outside opm catalog publish carries a promise OPM cannot verify for a consumer, because cue mod publish keeps working (D11) and breaks the induction 0011 D9 rests on. A catalog check command ships with a compatibility mode but is called an AID rather than a gate, on D11's own reasoning that a check nobody must run is not something a consumer can rely on. The decision rests on the actor being PROSPECTIVE — all four catalog repositories in research/migration-inventory.md are first-party and D32 measured cross-catalog fulfilment as entirely prospective — and on the failure being bounded, since experiments/02 showed the removal class fails loudly at match and only default drift defers. The subscription-bump check is DEFERRED, NOT REJECTED, and filed as open-platform-model/opm-operator#63, on the finding that under D14 the only moment a platform's catalog bytes change is an edit to version:, and the operator is the one actor holding both the previous applied state and the incoming one without reading git. One exposure is accepted explicitly and is not about third parties: D14's reproducibility rests on a named tag meaning fixed bytes, 0011 OQ3 records that OCI registries make immutability opt-in, and with no read-side check nothing notices an overwritten tag — so tag immutability is a deployment constraint OPM STATES rather than a property it verifies. 04-graduation gains three accepted->implemented gates (the ladder at both ends, the transitive comparator, and documenting D35's enforcement boundary where a catalog author will meet it) and drops OQ13 and OQ14 from the promotion set."
  - date: "2026-07-31"
    event: "Three draft->accepted housekeeping items closed, one of them a correction. THE SPELLING COLLISION IS RESOLVED: opm_experimental is canonical and opmodel.dev/catalogs/opm-experimental is to be deleted from the registry. Re-measured 2026-07-31 rather than decided by preference — the catalog's source has only ever declared the underscore (catalog_opm_experimental/src/cue.mod/module.cue is module: opmodel.dev/catalogs/opm_experimental@v1), the underscore repository carries the real release history (v1.2.0-alpha.1, v1.2.0-alpha.2, v1.3.0-alpha) against the hyphen repository's lone v1.3.0-alpha, and the live platform already subscribes to the underscore. So the hyphen form is ONE STRAY PUBLISH from an older path rather than a parallel release line, which makes this a deletion rather than a migration: nothing is republished, re-pinned or renamed. Underscore is also the only form that CAN be canonical, since a CUE module's package name is inferred from its path leaf and only a snake_case leaf is a valid CUE identifier — the constraint core/src/types.cue:18-26 documents in these exact terms. Recorded in 06-operational; 04-graduation's defect bullet now lists only the opm-platform namespace question and the source-tree/registry reconciliation as open. SEPARATELY CORRECTED, because the number was wrong in the direction that understates the work: the 2026-07-30 event and 04-graduation both said SIX of twelve live instances name coordinates absent from localhost:5000. The inventory's own table says TEN of twelve, across EIGHT of the ten distinct modules — radarr, sonarr and sabnzbd have no repository there at all (five instances, since radarr and sonarr carry two each) and jellyfin, k8up, cert_manager, istio_ambient and seerr exist only below their deployed versions; only metallb and the podinfo test artifact resolve locally. The table was right and the summaries derived from it were not, so 04-graduation is corrected in place and the earlier event is left as written, this event being the correction. Nothing about the gap's status changes: the central registry remains uninventoried and closing it still gates SCHEDULING the migration rather than promotion. THIRD, experiments/01-identity-marker-discovery moves Running -> Concluded with a Conclusion section, having sat Running while both of its halves were overtaken. The verdict recorded is that the hypothesis HELD AS RUN and that the design moved past it in opposite directions: half one's marker discovery worked and was retired by the experiment's OWN finding 3 (a reference does not carry the declaration's attribute, so a consumer can never see a marker and a marker can never carry a guarantee), which is the argument D5 acts on; half two's every-FQN-evaluates-with-Version-open was falsified wholesale by the full-SemVer contract keys and then largely RESTORED by D4's split, since a contract key interpolates the authored apiVersion and only transformer keys and catalogVersion stamps go non-concrete — already reflected in 05-risks. The fixtures are explicitly NOT re-measured and the Conclusion says so, since they carry the pre-split shape; the experiment is retained rather than deleted because D5 sends a reader here for the measurements that reversed it."
