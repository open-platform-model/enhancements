p 6 told modules to `drop the authored version` (reversed by D38) and to rename hyphenated modules (none exist, measured 2026-08-05, and 05-risks.md had already retired that item); step 7 kept a deployment-repository re-pin the releases-repin slice was cancelled for; 02-design.md's opm-operator section still sent the reader to OQ4 for a live-instance adoption path D18 rejected outright; 05-risks.md described OQ15 as still open when D14 resolved it, and still argued from 0011 D5's owner-scoped namespace move that 0011 D13 removed. FINALLY, 04-graduation.md GAINS A `Deferred — clusters and environments` SECTION. plan.yaml recorded that scope call on 2026-08-05 and named the affected gates by reference, but the gate document itself still listed the live-instance relabel, its positive check and the workload-type confirmation against a deployed object as accepted -> implemented requirements — so as written the entry could never reach `implemented`, since the plan deliberately carries no slice for any of them. They are recorded there rather than dropped, each with the finding that would otherwise be rediscovered at apply time, and handed to the v0 -> v1 fleet migration where D18 already puts its two holdings."
