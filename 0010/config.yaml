    event: "D36 recorded, OQ16 RESOLVED, and two experiments concluded. The OQ16 queue is now OQ17 alone, which 04-graduation.md already permits shipping unresolved by construction. D36 moves matching OUT of metadata.labels into a dedicated `matchLabels` field on #Resource, #Trait, #Blueprint and #Component, unified WHOLESALE from the attached primitives, and leaves metadata.labels alone. The fragment therefore declares nothing and OQ16 dissolves: there is nothing for D27 to fail to cover, and the label now sits on a primitive where D27 and the matcher unify rung already reach it. The route there is the finding. experiments/04 first tested the union core/SPEC.md states normatively three times (:216, :222, :658) and MEASURED THAT IT CANNOT BE BUILT — primitives carry resource.opmodel.dev/category and trait.opmodel.dev/category with mutually exclusive values, so real catalog_opm fails at #StatefulWorkload (Container=workload + Volumes=storage) before reaching a module, and real modules/jellyfin additionally collides on trait category across workload/network/security. Three filtered repairs were then measured working — a core.opmodel.dev/ prefix, a categorisation denylist, and one key read by index — and REJECTED TOGETHER on a single mechanical fact: every filtered union must ITERATE, and CUE refuses to iterate a struct holding an unset required field (`missing required field in for comprehension`), so each one forces dropping `!` from the container workload-type and degrades author-must-pick from a required field to an incomplete value. The dedicated field removes the filter and all three costs at once: structs unify wholesale so `!` SURVIVES (verified: a bare container fails `field is required but not present`), categorisation labels never meet structurally rather than by a filter agreeing not to look, and a real disagreement becomes a meaningful conflict (`conflicting values \"daemon\" and \"stateful\"`). It also removes an asymmetry that already existed — #ComponentTransformer declares matching DEMAND in a dedicated field (transformer.cue:46) while only the component side declared SUPPLY in metadata.labels. Two riders follow from core no longer naming the key: #LabelWorkloadType is DELETED (measured 2026-08-01 to have ZERO readers across catalog_opm, catalog_kubernetes, library, cli, opm-operator and modules, which all write the literal string — the same reader-set argument D33 used), and the key is renamed opm.opmodel.dev/workload-type under catalog_opm ownership, which is a consequence of the design rather than a follow-on migration. Rendering was decided separately and PROVISIONALLY: matchLabels is NOT folded into rendered output, so rendered objects stop carrying core.opmodel.dev/workload-type, which they get today via transformer.cue:147-157. That is a label REMOVAL on every live workload, landing in the identity migration window rather than adding a new one; experiments/04 v_render demonstrates the opt-in fold working (default off) and is retained as evidence that adding it later costs four lines. SEPARATELY, experiments/05 measured what 0011 D9 explicitly deferred and 0011 04-graduation.md gates: cue.Value.Subsume CANNOT implement D27 in either direction (next.Subsume(prev) 10/14, prev.Subsume(next) 8/14), because adding a struct field NARROWS while adding a disjunct WIDENS and D27 calls both additive, so the rule spans both lattice directions while one call tests one; a changed default is missed by BOTH, confirming experiments/02 from the producer side. A three-rule field-wise walk (recurse structs with add/remove rules, forward-subsume leaves, compare defaults explicitly) scores 14/14 and is level-aware per D34 — alpha accepts a field removal, beta and GA refuse. That belongs to 0011 as a rider on D9 or a new OQ there and is NOT recorded as a 0010 decision."
  - date: "2026-08-01"
    event: "D37 recorded, OQ17 RESOLVED, and the Open Question queue is now EMPTY. D37 answers OQ17 by PROHIBITION rather than arbitration, for this iteration, with the intent to allow deliberate overlap later stated explicitly. #Resource and #Trait gain `fulfilment: *\"catalog\" | \"provider\"`. `catalog` is the default and today behaviour — the declaring catalog implements it, and many transformers may consume one contract to produce different outputs. `provider` says fulfilment comes from a transformer in ANOTHER catalog, which is the shape D4 exists to enable: a generic backup contract declared in catalog_opm, expressing the author opinion of what backup means, with NO transformer of its own, fulfilled by a k8up provider catalog on an unrelated cadence. For a provider contract the platform must carry EXACTLY ONE transformer requiring it — two is refused at materialize naming both catalog paths, zero is already D28 unresolved demand. k8up or Velero, never both; switching providers REPLACES a subscription rather than adding one. #Blueprint is excluded because core/src/transformer.cue:54-64 demands only resources and traits, so a blueprint can never be the contract a provider fulfils. The declaration cannot be DERIVED, which is why it is authored: D17 records as explicitly not delivered that \"which catalog ships FQN X?\" can be answered with no platform in hand, since the kind-segment count is not fixed (…/opm/resources against …/opm/blueprints/workload). Predicate equality was also rejected as a detector — measured 2026-08-01 it has zero false positives today (21 transformers in catalog_opm, 21 distinct predicates) but false-NEGATIVES on the real case, since a k8up transformer requiring backup+schedule and a Velero transformer requiring backup alone are still two providers with different predicates. D37 ALSO CORRECTS D32 MECHANISM, and this is a defect found while walking OQ17 rather than a refinement. D32 states that a #matchers bucket holding more than one transformer means two different catalogs supply one contract, and that every contract bucket resolves to exactly one transformer or materialize fails. That invariant is FALSE and, implemented as written, would refuse the shipped catalog: measured 2026-08-01, catalog_opm own #ContainerResource bucket holds 8 transformers and #VolumesResource 6, ALL FROM ONE CATALOG, because materialize/index.go:82-95 indexes required UNION optional demands and because one contract legitimately feeds many different outputs (a container becomes a Deployment AND a Service AND PVCs). compile/match.go:138-157 pairs every candidate that unifies and satisfies the predicate, so multiple pairings per component is the intended path. D32 conclusion — loud materialize-time error in the kernel, no arbitration, CLI walker as convenience — stands unchanged; only the test moves, keyed on the declared fulfilment and counting REQUIRED demands only. A rider was added to D32 so a reader is not misled, and the accepted->implemented gate that asserted bucket arity was replaced by one requiring three things: two providers fail, ONE foreign provider RENDERS (D4 headline scenario), and catalog_opm materializes unchanged — the third being what catches a guard that has reimplemented bucket arity. schemas/target.cue gains #Fulfilment and #ContractSupply with both MUST-FAIL cases verified against cue v0.17.1 (two providers and zero providers each yield `_ok: conflicting values false and true`)."
