    event: "experiments/05-d27-compat-gate MOVED to 0011/experiments/03-d27-compat-gate. It was authored here while D36 and D37 were being settled, but it measures whether 0011 D9's compatibility gate is implementable, and nothing in this entry cited it — no decision, no design-doc reference, only the experiments index row, which is the state the enhancement-experiments skill names as an anti-pattern. D27 delegates publish-side enforcement to 0011 D9 explicitly, and 0011 had asked for the measurement by name in two places. The outcome matters to this entry even though the evidence lives elsewhere: D9 recorded that a gate which could not be built as described would send D27 back to publisher discipline, and the measurement shows it CAN be built — by a field-wise walk rather than by cue.Value.Subsume, which fails in both directions. D27 therefore stands unchanged. No decision in this entry is affected and no cross-reference was added to D27, which was already sound; a reader looking for the feasibility evidence will be in 0011, where the gate is specified."
