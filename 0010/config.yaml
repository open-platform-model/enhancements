    event: "Compacted (pass 1 of 2): D20 woven into D1, D22 woven into D5, D12 woven into D10, D3 restated. Three tombstones. Selection was driven by READ-ORDER HAZARD rather than by compact:plan's ordering, because the two disagree: only D14 and D15 carry a banner warning that they themselves are stale, while D12, D13, D29 and D31 carry banners about what THEY superseded and say nothing about being superseded in turn — and D1, D3, D4, D5, D10, D20, D22 carried no banner at all. D1 now states both halves of the modulePath rule (artifacts carry the complete module path with @vN; primitives carry a package path with none) with D20's single-widened-type position folded into Alternatives as originally-adopted-then-amended, plus D20's three-fact justification and its consequences list. D5 loses the @opm() code block from its Decision — dead syntax a reader would have copied — and gains the marker, the role= argument and the documentation-only variant as alternatives, with the measurement that killed the marker preserved (0011 experiment 01: 7 of 8 cases resolved by name-fallback; experiment 01 finding 3: a consumer never sees a declaration's attribute at all). D10 was the most changed: D12 had reversed its carrier, then D13 removed the floor's reader and D24 removed the floor's reason, so BOTH were dead and the merged decision now says so outright — nothing records or reads the built-against catalog version. D12's render-path invariant is preserved verbatim in D10, because 04-graduation gates it and 05-risks records it: a module's primitive definitions must resolve through the module's OWN dependency graph, or a single-build render lets minimal version selection pick the maximum and the module silently renders against the platform's catalog. D3 was corrected rather than merged (no tombstone, D3 survives): its Decision claimed its 'single job' was the compatibility floor, which D13 and D24 retired; restated to what the value now carries — transformer build keys under D24 and catalogVersion provenance under D25 — which is what makes D6's no-default rule load-bearing rather than fastidious. Two stale marker references the weave exposed were corrected in place: D6's Decision showed `ModulePath: string @opm(…)` as the open-field form, and D21 claimed tooling writes 'the two fields D5 marks with @opm()'. Narrative citations of the retired numbers updated across 02-design, README and schemas/target.cue. DEFERRED to pass 2, deliberately and with numbers: the two big chains, D4<-D13<-D24 (183 combined citations, D24 alone 89) and D14<-D15<-D29<-D31 (140). Under the lowest-number rule those collapse onto D4 and D14, which would put this entry's central decision — the contract/build key split — at a number whose original content was the rejected major-only scheme, and turn ~300 citations into pointers at tombstones while 0011 cites 0010 D24 externally. That is a correct application of the rule and an unreviewable diff, which the skill warns is how a laundered decision gets through, so it is its own pass and its own decision."
