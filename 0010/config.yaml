    event: "Two draft->accepted gates closed by measurement: the migration inventory and the core/SPEC.md line identification. The inventory is research/migration-inventory.md, read directly from the workspace registry (localhost:5000) and the live cluster rather than derived from committed source, and summarised in 06-operational. Counts: 12 live ModuleInstances across 10 modules, 1 Platform whose ENTIRE D29/D31 rewrite surface is three `range` lines, 39 published module repositories, 4 catalog repositories, 17 non-module artifacts in the namespace. Four findings change what the migration has to do, and the first is the largest. THE LIVE FLEET DOES NOT RESOLVE AGAINST THE REGISTRY THIS WORKSPACE PUBLISHES TO: opm-operator-controller-manager carries no CUE_REGISTRY env, no registry arg and no mounted config, so CUE resolves through its default central registry, and six of twelve live instances name coordinates ABSENT from localhost:5000 (radarr, sonarr, sabnzbd have no repository there at all; jellyfin, k8up, cert_manager, istio_ambient, seerr are published only at lower versions than the ones deployed). The migration spans two registries; the central one had no egress at measurement time and is recorded as an open collection task that gates SCHEDULING the migration, not running it. This is the one part of the gate satisfied by a stated absence rather than by data, and it is stated rather than papered over. Second: opmodel.dev/catalogs/opm_experimental AND opmodel.dev/catalogs/opm-experimental both exist, both holding v1.3.0-alpha, with the live platform subscribed to the underscore form — under D24 a catalog path is the permanent prefix of every contract FQN, so two spellings are two key spaces and a module built against one cannot match a platform subscribed to the other. That is the failure D1 and D8 exist to prevent, already live. Third: opmodel.dev/modules/opm-platform sits in module space while probably not being a module, defeating 0011 D5's premise that module/catalog/schema space are distinguishable by path alone. Fourth: the source tree and the registry are neither subset nor superset — modules/ holds 12 directories, three deployed-but-unpublished (radarr, sabnzbd, sonarr) and two sourced-but-unpublished-anywhere (cdi, snapshot_controller) — so both lists must reconcile before the fleet republish step. All three defects are recorded as gate items to resolve BEFORE the migration runs, since each is a wrong input to it rather than a step within it. Also measured: the catalogs/opm subscription's `<=1.0.0-alpha.6` upper bound is enhancement 0006's A5 patch still working, since the registry holds v1.0.0-dev.1785176190.g76f3cc6 and SemVer orders alpha before dev; under D31 that exclusion becomes structural and 0006 OQ18 closes as a side effect. SEPARATELY, the SPEC.md pass replaced one section-name bullet with 20 line-ranges across 9 of the file's 15 sections (668 lines, read 2026-07-30), and it surfaced something that is not a mechanical re-type: SPEC.md states THREE TIMES, normatively, that component labels unify upward from every attached primitive (:216 constraint, :222 rationale, :658 the justification for label-based matching) — the exact union claim D26's correction found has no implementing code. The co-update must settle OQ16 or narrow the claim. :657's 'why match is FQN-keyed and always unifies' likewise argues from distinct-SemVers-are-distinct-keys, a premise D24 removes for contracts."
