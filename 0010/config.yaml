    event: "Corrected to follow enhancement 0011's D13-D18, recorded the same day. NO DECISION HERE CHANGES ITS CONCLUSION and no Open Question reopens — the queue stays empty — but four statements were left false by 0011's namespace reversal and one by a tooling finding. THE FLEET DOES NOT MOVE. 0011 D13 makes path ownership DOMAIN ownership: OPM imposes no namespace on third parties, first-party modules stay at `opmodel.dev/modules/<name>`, and the `m` segment is not adopted. research/migration-inventory.md's line 'Every one of these moves to opmodel.dev/m/<owner>/<name> under 0011 D5, and every one's fqn — and therefore uuid — changes under D1/D2' is marked SUPERSEDED: registryPath is unchanged for all 39 module repositories, and with it the instance identity D41 derives from it. What still changes is fqn and uuid under D1, which is ARTIFACT identity rather than the owner label, and the @vN suffix moves no OCI repository — opmodel.dev/modules/jellyfin@v2 addresses repository opmodel.dev/modules/jellyfin with v2.* tags. 06-operational's 'At the level of the fleet republish, they share one window' is likewise superseded: 0011's step 3 rewrites no coordinate, so STEP 6 HERE IS THE ONLY FLEET REPUBLISH and 0011 contributes to it rather than duplicating it — the republishes go through `opm module publish` instead of the modules repo's checksum task, which 0011 D15 deletes. The preference this entry's 04-graduation already recorded is now simply true rather than a trade-off, and 0011's 'joint window written down but not owned' gate closes by removal. D41's CITATION was stale, not its argument: it rejected deriving instance identity from `name` on the ground that two same-named modules collide, citing 'registryPath is owner-scoped under 0011 D5'. The property survives — a full module path is unique BY CONSTRUCTION — but the uniqueness now comes from the domain rather than an owner segment, and the alternative is reworded accordingly with the 2026-08-03 measurement left intact and labelled as against the spelling then in force. Three illustrative `opmodel.dev/m/acme/jellyfin@v2` paths in README.md and 02-design.md corrected to shapes that exist, since they were the headline example of D1 and showed a namespace that no longer does. SEPARATELY, A VERIFICATION-HARNESS FINDING that applies here as much as to 0011, measured 2026-08-04 on cue v0.17.1 while validating 0011's schema: a MISSING REQUIRED FIELD INSIDE A HIDDEN FIELD is caught by NEITHER `cue vet` NOR `cue vet -c` — both exit 0 and print nothing — so a MUST-FAIL case spelled `_name: #Def & {…}` stops being one with no signal at all. Conflicts and closedness violations do NOT share the blind spot and fail under plain `cue vet` even when hidden, which is why existing cases in both entries work. This is D4's own measured condition — `cue vet` without -c reporting 'some instances are incomplete' and exiting 0 — turning up in the tooling that checks the design. The draft->accepted gate now specifies `cue vet -c ./...` and requires any required-field MUST-FAIL case to use a non-hidden name."
