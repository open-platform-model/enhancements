    event: "core-alpha-release IMPLEMENTED and moved to done. `opmodel.dev/core` is published at v2.0.0-alpha.4 (open-platform-model/core#39), and that tag is the first one carrying ALL FOUR core slices. The coherence pass merged first as open-platform-model/core#41, so the release commit sits on top of it and the published tag includes it — the ordering the change's own schema-release capability requires, since a stale cross-reference is defined to block the cut. THE SINGLE CUT POINT NEVER HAPPENED, and this event closes the question the 2026-08-07 event above left open by recording which way it went: the slice is closed as done-differently rather than rescoped. The four slices shipped across four alphas — alpha.1 core-identity-shape plus the major move, alpha.2 core-primitive-keying, alpha.3 core-platform-and-match, alpha.4 core-identity-package — so what this slice actually delivered was the coherence pass and the verification, not the cut. THE PROPOSAL'S PARTIAL-TAG WARNING IS NARROWER THAN THE FACTS and is corrected here, because the next slice retargets against it: it names v2.0.0-alpha.1 as the dangerous resolvable-but-incomplete tag. alpha.2 and alpha.3 are partial too, and alpha.3 is the MOST hazardous of the three — it carries three of the four slices, so it compiles far enough to look complete and fails only on the identity package. Only alpha.4 is a retarget target. THE COHERENCE PASS FOUND SEVEN DEFECTS, all editorial, none design, so nothing blocked. The one that changes a claim other documents rest on: SPEC.md 3.6 and 5.2, identity_package.cue's doc comment and identity_package_pins.cue's note all said the scalar-subscription reshape REMOVED the platform-side major-agreement backstop that D43 and D45 accepted their exposure against. It removed nothing. Verified independently rather than copied from 0011's own correction — `git log --all -S_majorAgrees -- src/` is empty at every commit, and the pre-reshape subscription filter carried only range/allow/d