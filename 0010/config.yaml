    event: "04-graduation.md and 06-operational.md corrected against the decision log. No decision changes; every edit brings a narrative document into line with a decision already recorded, and each correction below was a statement a reader could have acted on wrongly. THREE SELF-CONTRADICTIONS INSIDE 06-operational: Semver Impact said `#SubscriptionFilter` GROWS A FIELD while the Deprecation table three sections down said it is deleted entire (D14 deletes it; #Subscription carries a required scalar version); Cross-Repo step 2 said D14 COLLAPSES materialize/filter.go from resolution to a single check while the same table said the file is deleted (04-graduation is explicit — deleted rather than reduced); and the Migration Inventory's finding 1 said the operator resolves through CUE's DEFAULT CENTRAL REGISTRY while a subsection eighty lines below said it resolves against ghcr.io/open-platform-model via a compiled-in --registry default. THREE STALE OQ CITATIONS, all pointing at questions closed by decisions in this entry: Rollback cited OQ4 for the adoption path when D18 fixed its shape (relabel in place, never recreate, because no ownerReferences means a recreate garbage-collects nothing); Cross-Repo step 5 said opm-operator is where the OQ4 adoption path ships IF IT LANDS AS OPERATOR TOLERANCE, a candidate D18 rejected outright, so the step now reads no feature change of any kind; and the closing paragraph said which transformer bytes run is OQ11's subject, which inverts the current design — OQ11 is resolved by D14 and a catalog release moves nothing until someone edits version: in the platform's own source, the inertness 04-graduation makes an implemented gate. 04-graduation carried the same class of defect in its own OQ bullet, which ended `OQ4 is a runbook question and OQ8 is deferred by agreement` — both superseded, OQ4 by D18 and OQ8 by D19, with OQ7 dissolved by D14 and OQ10 the sole deferral; the bullet now states each closure and says the earlier sentence was superseded rather than silently dropping it. THE INVENTORY NUMBERS were corrected to the figures the 2026-07-31 GHCR read established and 04-graduation already carried: TEN of twelve live instances across EIGHT of ten modules absent from the workspace registry, not six of twelve, and the collection gap that gated SCHEDULING the migration is closed by data — GHCR enumerates completely at 53 packages with every live coordinate present at its deployed version. The two-registry finding SURVIVES (74 local repositories against 53 GHCR packages, neither a subset nor a superset) and now constrains the runbook instead of blocking it. Findings 3 and 4 were demoted in place to match: opm-platform is absent from GHCR so it is dev-registry hygiene rather than a wrong input, though the design question behind it stays open as 0011 OQ9; and radarr/sabnzbd/sonarr are published on GHCR at exactly their deployed v1.0.2, leaving only cdi and snapshot_controller sourced-but-unpublished-anywhere. TWO OMISSIONS FILLED, both decisions that landed after 06-operational was last touched. D36 appeared nowhere: matchLabels, the #LabelWorkloadType deletion and the opm.opmodel.dev/workload-type rename are now in Semver Impact and the Deprecation table, and the consequence an operator meets without reading any CUE is called out on its own — rendered objects stop carrying core.opmodel.dev/workload-type, which is a LABEL REMOVAL ON EVERY LIVE WORKLOAD, so anything selecting on it must be re-pointed first. D32/D37's two-providers-for-one-contract error was missing from Observability, which also said `three new diagnostics` above a list of five; it is now five with the count fixed and the note that two of them have no predecessor. STRUCTURAL: the `Which registry the migration republishes into` subsection sat BETWEEN findings 2 and 3, breaking the numbered list in half; moved below it. THE 0011 RELATIONSHIP was stated in three places in terms that read as contradictory — 04-graduation `preference, not a gate` against 06-operational and 0011 both saying `must land in the same window` — and the two claims are now separated under their own heading: at ENTRY level neither blocks the other and steps 1-5 have no 0011 dependency at all, while at FLEET-REPUBLISH level step 6 and 0011's step 3 share one window because both rewrite every coordinate and therefore every deployed instance's owner label. The constraint is on scheduling the migration, not on either design, and what it buys is effort rather than correctness. Both documents now cross-reference the other so the pair cannot drift apart again. Also corrected: step 7's `releases` names a repo that does not exist under the workspace root — it is a deployment repository outside it, named out of band, and the workspace-root directory map's ./releases/ row is stale."
