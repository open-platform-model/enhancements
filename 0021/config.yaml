id: "0021"
slug: versioning-policy
title: OPM Versioning Policy
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  One versioning policy that names every published OPM artifact class, defines its compatibility surface and bump rules, and states how each rule is enforced
status: draft

# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: cross-cutting

# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
affects:
  - cross-cutting
  - core
  - catalog
  - modules
  - cli
  - library
  - opm-operator
  - opmodel.dev

# Does this enhancement add or change opmodel.dev/core definitions?
# false → schemas/ MUST NOT exist; non-core compilable CUE lives in contracts/.
core_schema: false

