id: "0019"
slug: kernel-cue-parity
title: Kernel render path parity with pure CUE
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  Make the Go kernel's render path match pure CUE unification exactly, by folding matching into the single build so parity is structural rather than maintained by hand.
status: accepted
# Aggregate design impact (both breaks are named at acceptance): FinalizeValue
# leaves the kernel surface in Phase A; version! leaves #Subscription in Phase B.
semver: major
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: library
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
affects:
  - library
  - core
  - catalog
  - opm-operator
  - cli
  - modules
core_schema: true
created: "2026-08-19"
updated: "2026-09-04"
authors:
  - emil@jacero.se
# Append-only timeline of milestones.
history:
  - date: "2026-08-19"
    event: Drafted
  - date: "2026-08-19"
    event: "Pure-CUE control concluded (library/docs/design/repro-purecue-definitions/). Unifying a #ModuleInstance's component into a transformer's #transform preserves every field including definitions, fills all three declared inputs, and passes `cue vet -c` fully concrete, with the transformer arriving by import from a separate package. The component carries genuine closedness (`_probe.spec.bogus: field not allowed`) and renders anyway, which falsifies the March 2026 premise that finalization was required before filling. Third finding: CUE resolves references lexically, so a transformer must re-declare a slot in its own #transform body to reference it at all."
  - date: "2026-08-19"
    event: "Kernel-side measurement: filling #component from the unstripped value leaves the full suite green across 14 packages including both closedness regression guards and the CUE canary pair; a transformer then renders #component.#names.dns.fqdn, which fails on the unmodified kernel with an empty-disjunction error. The ADR-003 output-local hidden field hazard does not reproduce, and defaults still resolve without cue.Final()."
  - date: "2026-08-19"
    event: "Experiment 01-purecue-render-flow concluded. The whole render flow (match, context, execute) expressed as 82 lines of CUE against the real published catalogs/opm 2.0.0-alpha.3 transformers and the real web_app module, producing the same five pairs the kernel produces and rendering a Deployment, Service, HTTPRoute and two ConfigMaps with `cue vet -c` clean. Settled three things beyond the hypothesis: matching structurally needs the definition fields rendering is denied, filling #moduleInstance works without a transformer declaring it (only referencing it needs the declaration), and #context is derivable in full except #runtimeName. OQ3 is made executable by a version-agreement unification rather than argued."
  - date: "2026-08-19"
    event: "Decisions D1-D4 locked by user decision in the design session; OQ1-OQ3 opened against the single-build question after finding that ADR-003's federation premise (multi-version-per-major catalog composition) was deleted by 0010 D14"
  - date: "2026-08-19"
    event: "Experiment 02-platform-authority-mvs concluded, refuting OQ3's premise. Minimum version selection does not run at load time: cue/load resolves an import from the MAIN module's own dependency list (modpkgload/import.go:93-98, RootSelected) and consults the module graph's maximum-version selection only for paths that list does not carry. A committed cue.mod is a resolution, not a floor, so the kernel-generated render module's cue.mod confers platform authority and a consumer module's higher pin is inert. Authority is lost in exactly one measured cell, an unlisted catalog path plus a consumer pinning higher, which reframes the risk as omission rather than override and opens OQ6. Three mechanical findings carried: local-module.cue is the complete main-module dependency view rather than a patch, `v: null` is undecodable in v0.17.1 despite the schema documenting it, and a dependency listed but not imported still participates in graph expansion."
  - date: "2026-08-19"
    event: "Experiment 03-sealed-platform-roundtrip concluded, hypothesis REFUTED. `cue def --inline-imports` is not a viable platform-sealing mechanism for catalogs/opm 2.0.0-alpha.3: the emitted source does not re-parse (486 trailing _|_ comments swallow multi-line booleans; 21 continuation lines break before their operator), two catalog packages survive the inlining so the seal is not self-contained, and inlining leaves dangling references to #KebabToPascal and #JSONSchemaProps. Definitions and hidden fields ARE emitted, which was the specific fear going in. Redirects sealing toward vendoring bytes rather than flattening values, and demotes it from an authority mechanism to a reuse optimisation (OQ8)."
  - date: "2026-08-19"
    event: "D7 locked by user decision: catalog version skew between a #Module and its #Platform is detected by the kernel, with the response (warn-and-render, or refuse) supplied per compile by the caller so cli and opm-operator can each expose it. Warning means a structured diagnostic returned to the caller, never library-emitted output (library/CONSTITUTION.md forbids it). A module requiring an OLDER build is not skew under D7, and a render module omitting a path is a kernel defect rather than a configurable policy. Resolves OQ7 in shape; default direction, where the comparison reads the module requirement from, and the older-build signal remain open."
  - date: "2026-08-19"
    event: "D5 and D6 locked by user decision: a platform imports its catalog and embeds catalog.#transformers WHOLE into the registry entry, with the version scalar removed (per-transformer selection stays enhancement 0015's job via classes and TransformerRegistration); the Platform CR keeps naming a catalog coordinate and the operator generates the #Platform CUE package on the backend, with publishing permitted but not pursued. OQ6-OQ11 opened."
  - date: "2026-08-19"
    event: "Experiments 04-render-build-cost and 05-match-in-one-build opened (Draft). 04 turns OQ8 into a measurement rather than an argument: four arms isolating cold load, warm module cache, a shared cue.Context, and an ADR-002-shaped fill-many baseline, with a refutation threshold stated up front. 05 carries the three matching rungs experiment 01 deliberately skipped, and adds the claim no OQ currently tracks, that failure isolation in a single build is a property of the glue shape rather than of CUE: whether one failing pair poisons the rest depends on whether verdicts and conflicts live in a diagnostics field or are allowed to become bottom."
  - date: "2026-08-19"
    event: "Experiment 04-render-build-cost concluded, hypothesis held on its headline claim and refuted on its stated mechanism. A per-render single build costs 2.1x the held-platform baseline (90.2 ms against 42.3 ms, warm, n=50), memory is flat (6-10 MB retained, drift negative), and a cold cache costs 1.76 s once per process. Against the 10x threshold set before the harness was written that is a wide hold, so ADR-002's materialize-once model is an optimisation rather than a precondition and OQ8 stops being a feasibility blocker. The mechanism the hypothesis credited is wrong: a shared cue.Context recovers only ~14%, not the catalog term, which removes the cheapest reuse strategy from OQ8's list and leaves vendoring or batching if the cost ever needs to come down. Two mechanical findings carried: evaluation happens inside BuildInstance rather than in a separate eval step (verified by removing the Validate call), and the load/build split is roughly 35/65 warm while a cold cache is essentially all load."
  - date: "2026-08-19"
    event: "Experiment 06-concurrent-render opened (Draft), from experiment 04's residue. 04 measured per-render cost sequentially, so its affordability verdict rests on renders being able to run at the same time, which nothing has tested: library/opm/compile/execute.go states execution is sequential because *cue.Context is not goroutine-safe, and if no strategy parallelises then the single build and today's path share a ceiling of roughly eleven renders per second per process regardless of core count. Four strategies (context per worker, per render, one shared, and ADR-002's shared prebuilt platform) across a worker sweep, with the race detector as the instrument for the safety half and a comparison against the sequential output as the guard against a concurrency bug that returns a wrong value rather than a crash."
  - date: "2026-08-19"
    event: "Experiment 06-concurrent-render concluded, hypothesis held on scaling and refuted on memory, with the safety half inverted. Renders do parallelise: about 4x on eight cores, taking the single build from roughly 11 renders per second to 44, and the 2.1x multiplier over the held-platform path survives concurrency (2.18x at peak), so experiment 04's affordability verdict no longer sits under an untested ceiling and OQ8 stops being a feasibility question at all. The memory hypothesis is refuted as stated: a cue.Context releases nothing until it is dropped, retaining 37.5 MB per single-build render and 9.2 MB per render on today's path, flat in worker count and exactly linear in render count, with a fresh context per render costing nothing measurable and holding retention under 2.5 MB (OQ12). The safety result is the reverse of both prior assertions: a cue.Context shared across every worker is race-clean and parallel, contra execute.go's comment, while ADR-002's shared read-only materialized platform produces 2321 data-race reports on the shared value graph, unfixed by pre-evaluating it (1540), because filling a shared value is a write to its evaluation state rather than a read (OQ13). No wrong value was produced anywhere, across every strategy and worker count."
  - date: "2026-08-19"
    event: "Experiment 07-module-scale-cost concluded, discharging the size caveat experiment 04 attached to its own verdict, with the hypothesis held on the bounded ratio and refuted on the payload mechanism. Two purpose-built large fixtures (a 129-component fleet with an aggregating router, and a 32-component module of deep guarded components) swept across sizes, each authored both with blueprints and with raw resources and traits, with a digest guard requiring the two styles to render byte-identical output. Per-render cost fits fixed + slope x components with R2 above 0.9996 in all eight fits. The single build's fixed term is 81.5 to 89.1 ms across every fixture and style and does not move, and is the catalog resolved and evaluated per render; its per-component term is LOWER than today's path in every case (7.71 vs 12.17, 14.01 vs 19.31, 22.79 vs 33.35, 34.13 vs 46.83 ms). The curves therefore cross at 4.6 to 14.2 components, and past that the collapse is cheaper: 0.68x to 0.77x at 33 to 129 components, 1.08 s against 1.59 s and 913 MB against 1.9 GB at 129 components. So experiment 04's 2.1x is a fixed per-render cost rather than a general ratio, and OQ8's reuse candidates are narrowed to modules below about a dozen components and to at most 85 ms of benefit. The refuted half is the more useful one: the definitional payload the collapse stops stripping is free, because no transformer reads a definition field off #component and CUE never evaluates it, while finalizing it is not, which is why a blueprint-authored component costs the baseline more per component (+13.5 ms) than it costs the single build (+11.3 ms). Two findings carried: matchLabels cannot be written on a component (core derives it and _matchLabelsAreDerived refuses an authored key, so a raw author must narrow the resource at the attachment site, which is one of the things a workload blueprint exists to do), and finalization reorders map-derived lists so today's path emits a different env ordering than the collapse for modules that assemble environments conditionally (OQ14)."
  - date: "2026-08-19"
    event: "Experiment 08-concurrent-render-at-scale concluded, hypothesis held on all four claims, closing the gap between experiments 06 and 07 by running 07's fixtures byte for byte through 06's worker pool. Module size changes none of 06's answers: concurrent speedup is flat across a 64-fold size range (4.28x, 4.33x, 4.24x, 4.05x at 2, 9, 33 and 129 components, close to perfect scaling on eight physical cores), peak resident memory grows sub-linearly in workers, the race detector reports nothing at 33 components with eight workers, and no concurrent render produced a wrong value across 2688 renders. The result neither parent could produce: experiment 07's crossover was an artefact of comparing the two paths sequentially. Since 06 established today's path cannot run concurrently, the operator's real comparison is a shares-nothing render worker against today's path serialised behind a mutex, and the single build wins at EVERY size, 2.48x at two components rising to 5.49x at 129. So OQ8 loses its last cost argument for holding a platform. Two corrections carried. Per-render retention is a property of holding a cue.Context rather than a cost the collapse introduces: today's path retains 348 MB per render at 129 components, a reused per-worker context retains 581.8 MB (23.4 GB resident through 32 renders), and a fresh context per render retains 117 KB and is flat in render count, which restates OQ12's rule as 'a cue.Context may not outlive its render'. And serialising today's path, the conservative fix for OQ13's races, costs 2.5x to 5.5x throughput, which argues for superseding ADR-002 rather than amending it. Operational residue: sixteen concurrent renders of a 129-component module need about 14 GB, so a render pool should be sized by memory rather than by core count."
  - date: "2026-08-19"
    event: "D8 locked by user decision: ADR-002 is SUPERSEDED rather than amended, and its shared-materialized-platform model is replaced by a rule with no shared built value in it, each render its own CUE build in its own cue.Context and that context not outliving the render. Concurrency is across renders, never within one. Rejected alternatives and why: a mutex around the shared platform costs 2.5x to 5.5x throughput and still retains 348 MB per render; per-worker private platform copies rest on the same independence assumption ADR-002 already lost and are the per-worker-retained-context shape at another granularity (41.9 MB to 581.8 MB per render); leaving the ADR standing would have the next person implement it again, since store.go is built around it. What makes it a supersession rather than a bug fix is that the ADR's trade no longer exists: it traded a safety assumption for speed, and experiments 07 and 08 show the shared model is also the slower one at every module size once holding the platform forces the serialisation its races require. Resolves OQ13 and gives OQ12's context-lifetime rule a home. Lands as a library slice (superseded-by header on ADR-002, a new ADR carrying both rules) plus the removal of opm-operator's single held platform slot. Two measurements recorded alongside it in 06-operational.md and experiment 08's README: CUE evaluates one build single-threaded (1.04 cores with the collector off, so the pairs offer no within-render parallelism and the extra 59 percent of CPU at default settings is the collector), and peak resident memory per concurrent render fits 61 MB + 7.75 MB per component with R2 0.9997, which makes memory rather than core count the constraint that sizes a render pool."
  - date: "2026-08-19"
    event: "Follow-up measurements on experiment 08's harness (-timesplit), answering whether one large render can be sped up by building the #ModuleInstance once and then executing the matched pairs in parallel. It cannot, for two independent reasons. There is no separate pair phase: forcing `rendered` concrete after BuildInstance returns costs 3.0 ms of an 1831 ms render for 387 objects, reproducing experiment 04's finding 4 at 64 times the module size, so CUE has already evaluated every pair by the time the build call returns. And restructuring so each build renders only a subset buys almost nothing, because rendering one component of a 129-component instance still costs 1303 ms against 1860 ms for all of them. Measured across six fixture and style combinations, 46 to 76 percent of a render is a fixed floor every split re-pays, an Amdahl bound capping the scheme at 1.31x to 2.16x for K times the working set against the 4.0x to 4.3x that rendering different instances concurrently already gets for 1x the memory each. This also corrects an estimate in an earlier draft of experiment 08's README, which projected roughly 4x by applying experiment 07's 14.01 ms-per-component slope to a subset build; that slope conflates about 4.3 ms of splittable transform work with about 9.3 ms of component construction that no split avoids. The transformer step is 1.3 to 1.5 ms per rendered object on the shallow fixture and 2.2 to 2.4 ms on the deep one, and it is IDENTICAL between blueprint and raw authoring (4.32 against 4.29 ms per component on the fleet), which pins the entire blueprint tax experiment 07 measured on component construction rather than on transformation. The practical lever on a large module is authoring style rather than concurrency: raw primitives at 7.71 ms per component against 14.01 for blueprints take the same fleet from about 1.9 s to about 1.1 s, a larger win than the splitting asymptote at no extra memory or cores."
  - date: "2026-08-19"
    event: "Experiment 05-match-in-one-build concluded, hypothesis held on all four claims, discharging the four undecided items in 02-design.md's What-matching-costs section. One glue shape (verdicts as data, the fail-closed gate as one unification, bottoms confined behind == _|_ guards) expresses all three matcher rungs plus D28 in ~230 lines of CUE and reproduces the kernel's exact pair set against a VENDORED kernel record (capture/ runs the real kernel over the flow-test fixtures; every other verdict surface agrees too). D30 is a federation artifact: in one build the component's embedded copy and the transformer's required copy resolve to the same catalog bytes, the denylisted provenance fields are asserted EQUAL, plain & disqualifies nothing healthy and still disqualifies a genuinely conflicting required copy, reported as data naming component, transformer and FQN, while the unnarrowed candidate pairs beside it - so excludeProvenance is deleted rather than ported and the parity harness loses its one stated exemption. D28 fail-closed survives with the gate expressible in-build: probed through the Go API, diagnostics stays fully readable and concrete via LookupPath while the gate is failing, so oerrors decoded from a diagnostics field coexist with in-build refusal (the CLI conflates them; the kernel does not). Two measured boundaries: an unhandled trait with UNSTATED posture refuses as an incomplete-value error naming core trait.cue's own optional field (incomplete is not detectable as data - guards resolve defaults, so stated postures classify cleanly), and an incomplete (non-error) pair output is invisible to == _|_, landing non-concrete in rendered where cue vet -c names the pair key - error-class failures isolate as data, incompleteness stays a per-pair-attributable build refusal. Finding beyond the claims: the catalog's D25 provenance stamp REFUSES a foreign transformer unified into its member map, so multi-catalog composition is a map fold, never unification into one catalog's map."
  - date: "2026-08-19"
    event: "Rescoped by user decision: the entry keeps BOTH halves rather than splitting the single-build collapse into a successor. The unifying thesis is stated as the entry's identity (parity is the contract; the single build is what makes it structural), executed as two slice phases in plan.yaml: Phase A, the library-local parity work (D1-D4, harness, fills, FinalizeValue removal), carries no dependency on Phase B, the cross-repo collapse (D5-D8). Two decisions added: D9 states the collapse itself (the render step is one CUE build per render), ratifying OQ1-OQ3 and OQ8 into its rationale; D10 states that matching moves into the build per experiment 05's glue shape (verdicts as data, D30 deleted, in-build gate coexisting with LookupPath-read diagnostics, the unstated-posture and incomplete-output boundaries recorded). affects grows to library, core, opm-operator, cli, which D6 and D7 had already committed implicitly. The measured architecture costs (shared-platform races, per-render retention, throughput under serialisation) join 01-problem.md as the third gap, per the same rescoping discussion. OQ9/OQ10 are planned to defer to 0015 and OQ11 to a named future entry at the OQ walk; OQ14 is re-homed to Phase A, since the ordering change comes from removing the strip, not from the collapse."
  - date: "2026-08-20"
    event: "OQ walk concluded with zero unresolved OQs: D11-D14 locked, D5 and D6 revised in place. OQ4 resolved-by-D11 (sibling access through #moduleInstance stays reachable and is discouraged by authoring contract, never narrowed structurally). OQ5 resolved-by-D12 (#TransformerContext becomes a core-computed projection of the other two inputs, the kernel fills #runtimeName alone, context.go's mirror deleted; adds a core slice to Phase B). OQ6 resolved-by-D5/D13: D5 revised so a registry entry embeds the imported catalog WHOLE and derives version and #transformers from it, with the pattern constraint binding the registry key to the catalog's modulePath and an optional generation-time version stamp unifying against the readout as a tripwire; D13 states the render module's cue.mod is derived by promotion (platform's tidied list whole, instance's unioned for module-only paths, platform wins every shared path as D7's skew surface), never by a render-time tidy, refusing when any OPM-namespace path would resolve from the module graph. OQ9 deferred-to-0015; OQ10 resolved-by-D13 on the shared-path half with the refusal site deferred-to-0015, filed there as its OQ7 carrying the walk's positions (two-CR registry contribution, provider catalogs not dependent on the base catalog or each other). OQ11 resolved by the D6 revision: publishing #Platform as a CUE module is disallowed outright, reversing the 2026-08-19 permission. OQ12 resolved-by-D8 (the context-lifetime rule's home is the superseding ADR). OQ14 resolved-by-D14: CUE's natural unfinalized ordering is the contract, today's ordering is an artifact of the strip with no compatibility promise, migration note rides library-finalize-removal."
  - date: "2026-08-20"
    event: "Schemas convention migration: config gains core_schema: false — the entry changes no opmodel.dev/core definitions, so its compilable CUE moved from schemas/ to contracts/ (file renamed target.cue -> contracts.cue, package renamed to contracts, content unchanged); cue.mod refreshed to enhancements.opmodel.dev/0019/contracts, CUE v0.17.0. Structure/metadata only."
  - date: "2026-08-20"
    event: "D15 locked by user decision: transformers read component identity from #component.#names (resourceName and dns variants) and never derive a name — generation stays upstream on #Component, reading metadata.resourceName directly is rejected as the input rather than the finalized projection, and the rule is an authoring contract like D11's. The catalogs/opm transformer sweep moves from out-of-scope into the entry as slice catalog-names-readonly (Phase A, gated on library-component-fill), absorbing the catalog half of open-platform-model/catalog_opm#44; affects grows to include catalog."
  - date: "2026-08-20"
    event: "D16 locked by user decision: metadata.resourceName's default becomes the instance-qualified form *(\"\\(#instance.name)-\\(name)\" & #NameType) | #NameType — Helm-style <instance>-<component>, validated so an overlong concatenation refuses the render, explicit resourceName still winning. Lands as core slice core-resourcename-default, gated on catalog-names-readonly so the flip propagates through #names reads instead of widening the computed-versus-rendered divergence; breaking by intent for rendered fleets (objects rename, replace-not-update on first reconcile), migration note rides the slice."
  - date: "2026-08-20"
    event: "D15 and D16 revised in place after a source-verification sweep of the shipped catalog. The catalog counts 50 transformers, not 35, and carries its own exact-name authority (#ResourceNameTrait plus the #WorkloadName helper), which is deleted in favour of metadata.resourceName rather than reconciled; D15 is scoped to the component's primary object with three carve-out classes (exact-name kinds, secondary/multi-object names, cross-object references). D16's ordering is inverted: the default flip lands BEFORE the sweep, because rendered objects are already instance-qualified by every hand-rolled formula, which makes the flip output-neutral for rendered fleets and the sweep a byte-identical refactor gated on the catalog goldens; the original sweep-first order would have renamed every default-named object twice. The measured refusal caveat is recorded: the validated default degrades to a bare incomplete-value on overflow, so the core slice adds a hidden assertion for a legible refusal. Residual renames (explicit metadata.resourceName starts winning at sweep time; trait fixtures migrate) are absorbed by the new modules-fleet-rename slice under the alpha no-deprecation stance; affects grows to include modules."
  - date: "2026-08-20"
    event: "contracts/contracts.cue (then schemas/target.cue) completed against the decision log. Audit finding: the D5 revision and the D6..D16 lock/revision commits updated the decision log and target.cue's COMMENTS while leaving the schema's field bodies at their pre-revision placeholders, so a reader implementing from the contract alone would have reproduced the shape D5 removed (version: string is the authored scalar minus its required marker). The self-containment rule (no core imports) was the stated cause and does not justify it: derivations need no import, and where a core NAME was needed the file now carries loose local mirrors (#Catalog, #TransformerMap, #NameType, #ModulePathType, #VersionType) in the 0017 style. D5 is now written as CUE (version and #transformers derived off the embedded #catalog, #Registry carrying the pattern constraint that binds the key to #catalog.metadata.modulePath, #ComposedTransformers retyped to it), verified by probe: the derived version reads out concretely, the fold copies enabled entries only, and a key/import mismatch conflicts at build time. Seven decisions that had no schema surface at all gained one: D1 (#ParityContract, fixing removal as the direction of every parity fix), D6 (#PlatformPackage, publishing disallowed), D7 (#SkewPolicy, #SkewContract, #SkewDiagnostic, with the three non-configurable cases as fields), D8 (#RenderBuild.contextOutlivesRender and the concurrency/pool-sizing rules), D10 (#MatchingInBuild, carve-out deleted, the two measured boundaries), D12 (#ContextProjection plus the field split as core declares it), D13 (#DependencyPromotion), D14 (#OutputOrdering). D15 and D16 grew from two-field stubs to the scoped rule with its three carve-out classes, the deleted #ResourceNameTrait authority, and D16's exact spelling, hidden-assertion requirement and flip-before-sweep ordering. D4 is deliberately not represented: slice ordering is plan.yaml's surface."
  - date: "2026-08-20"
    event: "Re-split under the schemas/contracts convention, correcting the migration's core_schema: false. The entry DOES change opmodel.dev/core in three places, so core_schema flips to true and schemas/ is authored as a real core-schema delta: #CatalogEntry replacing the closed #Subscription with version and #transformers derived off the embedded #catalog, #Platform restated with the key-to-modulePath pattern constraint and both materialization slots turned into folds (D5); #TransformerContext plus #transform restated with the two metadata blocks projected from the other two inputs, #runtimeName the only runtime-owned field left (D12); #Component.metadata.resourceName restated with the validated instance-qualified default (D16). examples.cue makes the delta a test rather than a syntax check: derived version readout, enabled-only fold, reverse-index buckets, qualified default and its DNS ripple, override precedence, and the context projection including the label folds, each pinned by a hidden assertion; must-fail cases carry error text captured from cue v0.17.1 (stamp-versus-readout conflict, key-versus-import conflict, and the overlong-name refusal reported as `incomplete value` naming #NameType's constraints). spec.md pre-drafts the SPEC.md co-update for all three core slices in the four-part format. Two findings from writing the delta: (1) D16's hidden legibility assertion cannot be unconditional, because a component that authors an explicit short resourceName is legal even when the qualified concatenation would overflow, and CUE cannot detect from inside the value that the default was selected, so the core-resourcename-default slice must scope the assertion or restructure the cascade; recorded as a SKETCH at the field. (2) #Platform.#matchers loses its filler under D5 exactly as #composedTransformers does, but no decision says whether the reverse index stays derived on #Platform or moves into the render glue under D10; derived in the delta with the alternative recorded at the field. Re-measured on cue v0.17.1 while writing examples.cue: the unvalidated spelling exports a 67-rune name with cue export exiting 0, confirming D16's validated branch is load-bearing. contracts/contracts.cue keeps only the non-core material and its header, mirror section and cross-references are rewritten accordingly (the D5 registry shapes, the #ResourceNameDefault stub and the #Catalog/#TransformerMap/#NameType mirrors move to or are subsumed by schemas/). 02-design.md's core bullets refreshed: they still described the pre-revision D5 and framed D12 as conditional on OQ5. One committed mojibake line in 02-design.md (a double-encoded em-dash and two apostrophes, line 64) repaired."
  - date: "2026-08-20"
    event: "D17 locked by user decision, closing the residue the core delta surfaced: #Platform.#matchers is REMOVED rather than derived. Measured 2026-08-20 before deciding: its only reader is library/opm/compile/match.go, which D10 deletes, and nothing in opm-operator or cli reads it at all; experiment 05's in-build glue does not read it either, taking exactly two inputs (the composed transformer map and the components) and building its own buckets keyed contract FQN to a SET of transformer FQNs, where core's buckets are lists of transformer values. So a derived #matchers would be a second index, in a shape nothing consumes, beside the one the render actually uses. Rejected alternatives: deriving it on #Platform (the shape experiment 02's schema.cue anticipated), and reshaping it to the glue's set form so one index serves both, which is a wider core change than the evidence supports and couples the glue to a core field it was deliberately built without. The removal rides core-registry-import beside D5; library-match-in-build rewords opm/errors/match.go's message text. schemas/target.cue and spec.md record the removal, and examples.cue pins it as an ABSENCE assertion (_assertNoMatchersSlot), verified to fail when the slot is reintroduced."
  - date: "2026-08-20"
