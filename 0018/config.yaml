id: "0018"
slug: documentation-architecture
title: Documentation Architecture
# One line: the capability OPM will have and does not have today, or the
# rework of one it has. The `feature` admission gate (gates.cue) made durable;
# `task archive:list` renders rejected ideas by this field.
summary: >-
  Organise the documentation by what a reader is holding when they arrive, with diagnostics as a top-level entry point for readers who came from an error string.
status: draft
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: opmodel.dev
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
affects:
  - opmodel.dev
  - core
  - catalog
  - cli
  - library
core_schema: false
created: "2026-08-18"
updated: "2026-08-30"
authors:
  - emil
# Append-only timeline of milestones.
history:
  - date: "2026-08-18"
    event: Drafted
  - date: "2026-08-18"
    event: "Sourcing survey concluded across core, library, catalog_opm, opm and enhancements 0001-0017. Findings that shaped the entry: opm/docs is a total write-off (every file last touched 2026-04-21, describes the v0 catalog line, 121 references to the retired #ModuleRelease); the best explanation prose in the workspace is core/SPEC.md's Rationale sections, which are unpublishable as-is because they cite enhancement decision numbers and experiment paths; catalog doc-comment coverage is inverted against usage (blueprints 0 of 5, abstraction resources 1 of 11, traits 6 of 27, while the raw k8s-* family that no first-party module imports has 27 of 27); metadata.description is populated for all 70 catalog members but the index generator is a text scraper that never reads it; and only five enhancements of seventeen are implemented, so nine draft systems including lifecycle/workflows (0009) must not appear as features."
  - date: "2026-08-18"
    event: "Decisions D1-D6 locked by user decision in the design session"
  - date: "2026-08-20"
    event: "Schemas convention migration: config gains core_schema: false — the entry changes no opmodel.dev/core definitions, so its compilable CUE moved from schemas/ to contracts/ (file renamed target.cue -> contracts.cue, package renamed to contracts, content unchanged); cue.mod refreshed to enhancements.opmodel.dev/0018/contracts, CUE v0.17.0. Structure/metadata only."
  - date: "2026-08-21"
    event: "Delivery-plan extraction: plan.yaml/PLAN.md moved out of the entry into the plans/ tree under the one-way reference rule (plans cite enhancements; enhancements never cite plans); in-entry file references reworded to the generic form. Structure/metadata only."
  - date: "2026-08-21"
    event: "Decision Kind gate retrofit: every decision annotated with Kind (contract | policy | scope) per the new template convention. Classification only — no decision content changed."
  - date: "2026-08-22"
    event: "Open Questions register extracted: the ## Open Questions section moved from 03-decisions.md to the new 07-questions.md under the seven-doc convention (single canonical location); in-entry location references reworded. Structure/metadata only."
  - date: "2026-08-23"
    event: 'Lifecycle reshape: implementation axis removed (delivery derives from the plans side), 04-graduation.md deleted, summary added.'
  - date: "2026-08-24"
    event: 'Delivery-log adoption: forecast plans retired; landed changes and no-work claims recorded in delivery.yaml in the entry; delivery state derived as not-started/in-progress/implemented.'
  - date: "2026-08-30"
    event: 'ADHD readability pass: claims front-loaded, sentences split, em-dashes removed, lists capped. No answer, number, Source, Kind or Status changed. Under the 2026-08-30 readability carve-out.'
