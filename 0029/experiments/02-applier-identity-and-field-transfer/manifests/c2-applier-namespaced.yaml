# Case 2: a named applier ServiceAccount with a NAMESPACE-scoped Role that
# covers every namespaced kind the fixture renders, and nothing cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata: {name: applier, namespace: c2}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: applier, namespace: c2}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: applier, namespace: c2}
subjects: [{kind: ServiceAccount, name: applier, namespace: c2}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: applier}
