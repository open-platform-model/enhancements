# Sufficient applier for c6 (copy of the case 3 grants).
# (same Role as case 2, for c6):
apiVersion: v1
kind: ServiceAccount
metadata: {name: applier, namespace: c6}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: applier, namespace: c6}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: applier, namespace: c6}
subjects: [{kind: ServiceAccount, name: applier, namespace: c6}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: applier}
---
# Cluster half: every verb on the RBAC kinds the fixture renders, PLUS the
# rights the rendered ClusterRole grants (get/list nodes), so RBAC escalation
# prevention is satisfied without escalate/bind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: c6-applier-cluster}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: c6-applier-cluster}
subjects: [{kind: ServiceAccount, name: applier, namespace: c6}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: c6-applier-cluster}
