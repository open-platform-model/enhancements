# Structured slice plan for this enhancement. Optional — see
# 0000/README.md ## Slice Plan for the field reference and the
# workflow this feeds (task vet, task plan:graph, task plan:ready,
# task slice:seed). Delete this file if the enhancement never
# grows past one slice.
#
# Structural backing for 06-operational.md ## Cross-Repo Coordination.
#
# NOTE — this plan carries two slices that section did not list until
# 2026-08-05. It opened "nothing else moves until opm catalog publish and
# opm module publish exist", but `affects` also names core and library, and
# two decisions put work there that the CLI slices CONSUME rather than
# follow:
#
#   D21 — #IdentityPackage must ship in `core`, because publish validates
#         identity by unifying against it and surfacing CUE's own error.
#         It exists today only in 0010's schemas/target.cue. D22 adds
#         #CatalogMemberFQNGate to the same slice for the same reason.
#   D9  — the compatibility comparator is pure cue.Value logic and belongs
#         in `library`, shared by publish, `catalog registry check --compat`
#         and any CI action; predecessor selection also moves here.
#
# Both are therefore UPSTREAM of the CLI slices, not downstream of them.
# 06-operational.md ## Cross-Repo Coordination was reconciled against this
# ordering on 2026-08-05 and now leads with core and library.
#
# THE CUTOVERS ARE `implementation`, NOT `migration`: both change a release
# pipeline's CONFIGURATION and publish nothing themselves. The two acts that
# change a published artifact are 0010's catalogs-republish and
# modules-fleet-republish, and 0010's plan header carries that boundary.
#
# ONE MIGRATION SLICE LIVES HERE — registry-cleanup, D17 items 2-4. It moves
# and deletes already-published artifacts, so it is migration by purpose even
# though nothing it touches is a fleet coordinate. It was previously owned by
# neither plan: 0011's 04-graduation.md required it while this header claimed
# the entry had no migration work, and 0010's plan header listed it as out of
# scope. Adding it REVERSES that one item of the 2026-08-05 scope call; the
# call's other two — the legacy v1alpha1 deletion and the Zot cutover — stand
# unchanged and stay outside both entries. Its `repo: cli` is a PLACEMENT,
# not a measurement — the `-e2e` tags
# come from CLI e2e publishing while `hello-web` is an opm-operator fixture.
# If the operator's CI publishes them, move the slice and add `opm-operator`
# to `affects` first.
#
# FIVE CROSS-ENHANCEMENT EDGES CONNECT THE TWO PLANS. They are ordering
# edges, not blocking ones — neither entry blocks the other at the entry
# level (D17 dissolved the joint window). Two point from 0010 into here:
#
#   0010:core-alpha-release depends on core-identity-package, because
#     #IdentityPackage ships in `core` and belongs in the same
#     v1.0.0-alpha.4 the catalogs and the fleet retarget to. There is no
#     core MAJOR bump — core@v1 has published only prereleases, so the
#     break lands in the alpha line with the module path unmoved.
#   0010:library-subscription-collapse depends on library-compat-comparator,
#     because 0010 D14 DELETES materialize/filter.go while predecessor
#     selection reuses filter.go:112's highestStable. A move, not a
#     delete-and-rewrite — so the move happens first.
#
# AND THREE POINT FROM HERE INTO 0010. The first is a COMPILE dependency
# rather than an ordering preference:
#
#   core-identity-package -> 0010:core-identity-shape
#     #IdentityPackage does not stand alone. Its `ModulePath!` is typed
#     #ModulePathType in the D1 `@vN` form, its `Version!` is #VersionType,
#     and RegistryPath/Major are projected through `_ref: #ArtifactRef`
#     (0010 schemas/target.cue:275). Measured 2026-08-05 against core/src:
#     #ArtifactRef does not exist there at all, and #ModulePathType is still
#     types.cue:26's no-major regex. So this slice cannot compile — never
#     mind validate anything — until 0010's identity slice has landed those
#     three definitions. The two slices read as parallel core roots only
#     because that edge was missing; there is ONE core root, and it is in
#     0010. No cycle results: 0010:core-identity-shape -> this slice ->
#     0010:core-alpha-release is a chain, and the alpha cut is what both
#     halves of the pair were already waiting on.
#
# THE OTHER TWO ARE THE CUTOVERS, WITHOUT WHICH BOTH BREAK CI.
# catalogs-publish-cutover points release.yml at `opm catalog publish`, and
# modules-publish-cutover points the modules pipeline at `opm module
# publish`. Both commands validate identity/identity.cue by unifying it
# against core's #IdentityPackage (D21) and REFUSE a tree where it is
# absent (refusal 10) or not concrete (D4). On a pre-migration tree that
# refusal fires, so each cutover depends on the 0010 authoring slice that
# creates those files:
#
#   catalogs-publish-cutover -> 0010:catalogs-identity-authoring
#   modules-publish-cutover  -> 0010:modules-identity-authoring
#
# Neither edge existed until 2026-08-05. Declaring them is also what keeps
# the category split clean: 0010 had bundled authoring with republishing in
# one slice each, so the only edge available would have dragged a REPUBLISH
# into category 1.
#
# THE MODULE IDENTITY FILE BELONGS TO 0010, NOT HERE. An earlier revision
# of this plan gave modules-publish-cutover "add each module's
# identity/identity.cue and the D12 metadata wiring", which 0010's
# modules-fleet-republish also claimed. D17 settles it: 0010's step 6 is
# the only fleet republish and this entry contributes the MECHANISM. So
# the file is created once, in 0010's slice, and what remains here is the
# tooling deletion and the cutover to `opm module publish`.
slices:
  - id: core-identity-package
    repo: core
    phase: implementation
    concern: >
      Ship #IdentityPackage and #CatalogMemberFQNGate in core so publish
      validates identity and every catalog member by unification and CUE
      produces the diagnostic, not a hand-rolled comparison.
    depends_on:
      - "0010:core-identity-shape"
    decisions: [D21, D22, 0010:D40]
    status: in-progress
    openspec_ref: "core/core-identity-package"

  - id: library-compat-comparator
    repo: library
    phase: implementation
    concern: >
      The D9 three-rule field-wise walk — NOT cue.Value.Subsume, measured
      10/14 and 8/14 on disjoint sets — plus predecessor selection moved out
      of filter.go before 0010 D14 deletes it. Level-aware per 0010 D34.
    depends_on: []
    decisions: [D9, 0010:D14, 0010:D34]
    status: planned

  - id: cli-login
    repo: cli
    phase: implementation
    concern: >
      `opm login [registry]` — resolves its target through the existing
      ResolveRegistry precedence and writes to the credential store CUE itself
      reads, because CUE performs the push. Independent of everything else
      here.
    depends_on: []
    decisions: [D11]
    status: planned

  - id: cli-publish-pipeline
    repo: cli
    phase: implementation
    concern: >
      One pipeline, two entry points: decode, read identity, derive
      coordinates, run the gates, push, with the dry-run plan output. Refusals
      1-8 and 10, plus the D16/D18 checks in `opm module vet`.
    depends_on:
      - core-identity-package
    decisions: [D1, D2, D4, D6, D12, D15, D16, D18, D21]
    status: planned

  - id: cli-version-set
    repo: cli
    phase: implementation
    concern: >
      `opm module|catalog version set` and `--version` — the surgical AST
      rewrite that preserves the & chain, located by schema path rather than
      by a marker. Measured in experiments/01.
    depends_on:
      - core-identity-package
    decisions: [D3, D8, D12]
    status: planned

  - id: cli-catalog-verify
    repo: cli
    phase: implementation
    concern: >
      The compatibility gate on `opm catalog publish` plus `opm catalog
      registry check [--compat]`, whose help text must call it an aid rather
      than a gate. Both over the library comparator.
    depends_on:
      - library-compat-comparator
      - cli-publish-pipeline
    decisions: [D7, D9, 0010:D35]
    status: planned

  - id: cli-catalog-member-gate
    repo: cli
    phase: implementation
    concern: >
      Publish refuses a member whose modulePath or fqn disagrees with
      #CatalogMemberFQNGate, and a trait whose optional is unstated or
      pinned. Both unify against core-shipped gates; -c is required.
    depends_on:
      - core-identity-package
      - cli-publish-pipeline
    decisions: [D22, 0010:D17, 0010:D21, 0010:D25, 0010:D42, 0010:D46]
    status: planned

  - id: cli-mod-init-repair
    repo: cli
    phase: implementation
    concern: >
      `opm mod init` becomes scaffold AND repair behind a second confirmation
      naming every file and value change, and never invents identity. What
      makes D16's refusal actionable.
    depends_on:
      - core-identity-package
    decisions: [D16, D20]
    status: planned

  - id: catalogs-publish-cutover
    repo: catalog
    phase: implementation
    concern: >
      Switch release.yml's publish job to `opm catalog publish` and delete the
      copy-and-stamp task. Catalogs go first because modules build against
      them.
    depends_on:
      - cli-publish-pipeline
      - cli-version-set
      - cli-catalog-verify
      - cli-catalog-member-gate
      - cli-login
      - "0010:catalogs-identity-authoring"
    status: planned

  - id: modules-publish-cutover
    repo: modules
    phase: implementation
    concern: >
      Delete the checksum-driven publish and versions.yml, cut over to `opm
      module publish`. The identity file itself is 0010's modules-identity-
      authoring; coordinates do not change.
    depends_on:
      - cli-publish-pipeline
      - cli-version-set
      - catalogs-publish-cutover
      - "0010:modules-identity-authoring"
    decisions: [D13, D17]
    status: planned

  - id: registry-cleanup
    repo: cli
    phase: migration
    concern: >
      D17 items 2-4: rename opmodel.dev/modules/test/hello-web to hello_web,
      relocate modules/test/* and its -e2e tags to testing.opmodel.dev, delete
      test/cleanmod. Legacy v1alpha1 waits on the v0 -> v1 fleet migration.
    depends_on: []
    decisions: [D17]
    status: planned

# Decisions this entry implements in no slice, each with the reason. Surfaced
# by `task decisions:uncovered`, which is quiet about them once they are here.
# See schema.cue #SlicePlan.unsliced: this is a claim on the record that the
# decision needs no work, not a suppression list.
unsliced:
  D5: >
    Its namespace half is REVERSED by D13, which is carried by
    modules-publish-cutover. What survives is the hosts-rather-than-indexes
    holding — a property of what the registry IS, established by the CUE
    resolution argument rather than by anything anyone builds.
  D10: >
    Tag immutability is enforced by the REGISTRY, not by OPM. It gates on the
    Zot cutover, which 0010's plan header records as out of scope for both
    entries with no owner and no date. Nothing in either plan can deliver it,
    and pretending otherwise by attaching it to a CLI slice would claim an
    enforcement OPM does not have.
  D14: >
    Explicitly forward-looking in its own words: the platform segment is
    RESERVED and no platform is published or fetched from a registry today,
    while instances get no segment at all. A reservation with no publisher is
    a namespace claim, not work.
