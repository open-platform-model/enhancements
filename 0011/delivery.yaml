no_work:
  D5: >-
    Its namespace half is REVERSED by D13, which is carried by the modules
    publish cutover. What survives is the hosts-rather-than-indexes holding,
    a property of what the registry IS, established by the CUE resolution
    argument rather than by anything anyone builds.
  D10: >-
    Tag immutability is enforced by the REGISTRY, not by OPM. It gates on the
    Zot cutover, recorded as out of scope for both 0010 and 0011 with no
    owner and no date. Attaching it to a CLI change would claim an
    enforcement OPM does not have.
