    event: "D19 recorded, closing the last item under 04-graduation's command-surface gate. Publishing an ALREADY-PUBLISHED VERSION IS ALWAYS A REFUSAL — no sweep mode, no --skip-if-published, no invocation in which the condition succeeds. This AMENDS D15, which had the registry lookup 'used to skip rather than to refuse when publish is run as a fleet sweep' and left the distinction to this gate. The author's reason was direct — 'It should be a refusal. It should check against the registry and error' — and the consistency argument is stronger still: D10 ALREADY SPECIFIES this behaviour, having publish 'refuse client-side to overwrite an existing tag', so a skip in sweep mode would have been a carve-out from a rule the design already stated. Carve-outs on refusals are how the producer-side half becomes decorative, which is 05-risks' own 'a refusal that fires too easily gets routed around' arriving from the opposite direction. IDEMPOTENCY MOVES RATHER THAN DISAPPEARING: the sweep resolves which artifacts carry an unpublished version and invokes publish only for those, instead of invoking publish on everything and relying on it to no-op. D15's substance is untouched — the authored version is still the trigger, nothing predicts a version, no ledger is consulted — and its 'CI needs no trigger logic at all' is NARROWED rather than reversed, since CI still needs no notion of whether an artifact CHANGED, only of what the registry already holds. Rejected on the way: having the sweep tolerate publish's exit code, which would make it parse failure to detect a normal state and put a genuine error and an expected no-op on one channel. The graduation gate now requires BOTH halves tested — a second sweep run that exits zero because its filter selected nothing, and a direct invocation on an already-published version that errors — because a sweep exiting zero by swallowing the refusal has implemented the design D19 rejected."
