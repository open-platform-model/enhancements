    event: "registry-cleanup splits and the operator half lands: `opm-operator` is added to affects and a second slice, registry-cleanup-operator, carries D17 items 2-3 for the fixture fleet this entry could never have moved from the cli. The plan header had already written the condition — the `repo: cli` placement is not a measurement, and opm-operator must join affects first if its CI publishes the artifacts in scope — and it does, on release and on every e2e run. The four fixtures move to testing.opmodel.dev/modules/operator/* and their modulepackages to testing.opmodel.dev/releases/operator/*, each module gaining an identity subpackage with D12 derivation wiring and publishing through `opm module publish` against the pinned cli release, whose gateNamespace exemption for the testing domain was verified present in the shipped v1.0.0-alpha.11 binary rather than assumed. THE MEASUREMENT THAT SUPERSEDES THE OPERATOR'S OWN 2026-06-17 D1, which had moved these fixtures ONTO opmodel.dev/modules/test/* on the argument that 'two path conventions is more confusing' and that path and registry are 'the same decision': measured on GHCR this date, the five opmodel.dev/modules/test/* packages hold 377 tags of which 366 are per-commit -e2e.g<sha> churn, sitting beside forty-plus first-party production modules; longest-prefix routing had pinned the WHOLE opmodel.dev prefix to localhost in every local flow, mirroring core and the catalogs as collateral; and the publish pipeline that did not exist in June refuses a three-segment opmodel.dev/modules/test/<m> outright, so nothing had ever gate-checked these artifacts. Path and registry are independent — the testing domain publishes to the same GHCR under the same canonical mapping — so the 'no extra config' property D1 protected survives the move. Recorded operator-side as ADR-017, which extends ADR-008's taxonomy with the distinction it did not draw: the DOMAIN, not a path segment, separates production artifacts from fixtures, because the domain is what CUE's resolver routes on. ONE DELIBERATE DEVIATION FROM THIS ENTRY, stated rather than absorbed: D17 item 5 and D14 place opmodel.dev/releases/* out of scope as 'Flux artifacts, not CUE modules', and the modulepackage fixtures move anyway. D14's reasoning is that those paths are not IN the partitioned namespace, not that their spelling is right; leaving them would keep fixture-shaped artifacts under opmodel.dev while the modules beside them moved, and the rule is only worth having if it has no exceptions to remember. Cost is nil — they were never published to GHCR (NAME_UNKNOWN on every one), so no consumer is re-pointed. TWO TOOLING CONTRACTS CHANGED AS A CONSEQUENCE, both silent-failure risks: the operator's publish task read its version with a grep for the first `version:` literal in module.cue and documented that grep as its stable contract, but a D12-derived metadata block contains no such literal, so the grep would have matched nothing and taken a `continue` branch that still exits 0 — a no-publish reported as success; it now reads `cue eval ./identity -e Version` and treats a missing identity package as a hard error. And the prerelease path, which must move the DECLARED version with the tag or the acquire-time identity check (0010 D11) refuses the artifact, stops sed-rewriting a formatting convention and stages a copy through `opm module version set`; `opm module publish --version` cannot serve there because it ASSERTS a declared version rather than filling one and these fixtures declare a defaulted Version — verified end to end, every prerelease publish reports its identity Version equal to its tag. ALSO FIXED: the registry-backed integration guard tested strings.Contains(reg, \"opmodel.dev=localhost\"), which a testing.opmodel.dev mapping also satisfies, so it had never proven anything about the fixture's own namespace — and after the move it would have skipped every registry-backed spec in CI while claiming the fixtures were unavailable; it now tests that a mapping exists at all, and 41 specs run with zero registry-mapping skips under OPM_TEST_REGISTRY_FORCE=1. The workspace Registry Policy's known-deviation paragraph is emptied on both sides. The slice stays in-progress: the 377 orphaned tags, the hyphenated hello-web package (D17 item 2's registry residue) and two pre-2026 testing.opmodel.dev leftovers are deletable only once the release workflow has republished at the new coordinates, and that deletion is irreversible. Operator fmt/vet/build/unit green; all four fixtures publish, re-publish as no-ops, and pass every gate."

