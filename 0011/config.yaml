ity-package half ships in 0011:core-identity-package and was likewise uncited. Both now carried. SEVEN DECISIONS ARE DELIBERATELY UNSLICED and say why, in a new top-level `unsliced` map: 0010's D2, D7, D16 and D23 (three reversed or superseded by D38, one a decision NOT to add a field) and 0011's D5, D10 and D14 (a reversed namespace half, a registry property gated on the ownerless Zot cutover, and a forward-looking reservation nobody publishes to). Tombstoned numbers need no entry — they are excluded automatically, being retired rather than unimplemented. Both entries now report zero uncovered."
