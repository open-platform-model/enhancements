    event: "Two cross-enhancement edges declared, closing a gap that would have broken this entry's own CI cutovers. No slice added, removed or renamed; all nine stand, and EVERY ONE IS SCHEMA, CODE OR DOCS — this entry contributes no migration work at all. That is not a judgement call: catalogs-publish-cutover and modules-publish-cutover change a release pipeline's CONFIGURATION and publish nothing themselves, so the two acts that change a published artifact are both 0010's. THE GAP: catalogs-publish-cutover points release.yml at `opm catalog publish`, and modules-publish-cutover points the modules pipeline at `opm module publish`. Under D21 both commands validate identity/identity.cue by unifying it against core's #IdentityPackage and REFUSE a tree where it is absent — that is refusal 10 in 06-operational.md, and D4 refuses a non-concrete one. On a pre-migration tree the refusal fires, so pointing CI at either command before the identity files exist replaces a working pipeline with a failing one. Neither slice declared a dependency on anything that creates those files; both now depend on 0010's new authoring slices (catalogs-publish-cutover -> 0010:catalogs-identity-authoring, modules-publish-cutover -> 0010:modules-identity-authoring). THIS IS ALSO WHAT FORCED 0010'S SPLIT, and the two are worth reading together: 0010 had bundled `commit the identity file` with `republish` in one slice per repo, so the only edge available would have made a CI configuration change depend on a fleet republish — putting an irreversible publish upstream of a reversible config edit, and making the schema/migration boundary unstateable. 0010 split those slices in the same pass; the edges point at the source-only halves. Four cross-enhancement edges now connect the pair, against the two declared yesterday. modules-publish-cutover's concern is corrected on the same point: it cited 0010's modules-fleet-republish as the owner of the identity file, which after the split is modules-identity-