th OPM_REGISTRY set beside CUE_REGISTRY because opm's resolver never reads the latter. REHEARSED before merge: dry-run at the committed version refuses with only already-published (member gate 120/0, posture 27/0, compat 66 compared/0 refused/4 alpha-exempt), dry-run after version set to the next alpha is GO, and the branch push published v2.0.0-0.dev.1787062834.g641abe3 to GHCR through the full pipeline. FIRST LIVE RELEASE CYCLE VERIFIED post-merge: the stale pre-cutover release PR 41 — generated with the annotation edit, conflicting with main after the cutover — was closed and the release workflow re-run; release-please recreated the release PR (43) from current main WITHOUT touching identity.cue, the advance step committed the surgical one-line bump to 2.0.0-alpha.4 as its own chore commit, and PR 43 stands green and mergeable. Its merge is the first real publish through the new command — 0010:catalogs-republish's act, deliberately left to a human. modules-publish-cutover is now the last implementation slice standing."
