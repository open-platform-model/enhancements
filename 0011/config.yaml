y.cue gate idempotency, defaulted-disjunction assertion preservation, and x-release-please-version marker preservation on both. The SECOND change, cli-template-modules, carries everything `mod init` — argument grammar, templates, scaffold, repair, second confirmation — moved there wholesale so the command is rewritten once, coherently; the slice flips to done with both openspec_refs when it lands; the first ref (cli/cli-authoring-commands) is recorded on the slice now. The change was verified and ARCHIVED 2026-08-16 — every spec scenario test-covered, plus a post-verify quality pass: both writers share one verify-and-write tail before the init rewrite adds a third, ReadIdentityVersion unquotes through cue/literal so a hash-quoted version literal reads instead of refusing, and the command reports the no-op from the writer's own Changed verdict so the idempotency decision has exactly one home. The authoring-commands capability spec (one requirement, five scenarios) is synced to cli's main specs. CLI task fmt/vet/lint/test all green."
