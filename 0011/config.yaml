id: "0011"
slug: artifact-publishing
title: Module and Catalog Publishing
status: draft
# Which OPM area is the primary owner. See enhancements/schema.cue #Area.
area: cli
# Every repo that ships code/schema/content changes driven by this enhancement.
# MUST include `area`. Validated against the workspace directory map in /CLAUDE.md.
#
# NOTE on `catalog`: the #Area vocabulary predates the catalog split. Here it
# means the live catalog repos — catalog_opm, catalog_kubernetes,
# catalog_opm_experimental — not the deprecated `catalog/` tree.
affects:
  - cli
  - catalog
  - modules
  # D9's compatibility comparator is pure cue.Value logic and ships HERE, not in
  # cli, so publish, `opm catalog registry check --compat` (D7) and any CI action
  # share one implementation — 0010 D32's argument for the kernel. Predecessor
  # selection also moves here: enumerate.go + filter.go:112's highestStable
  # already do it, and 0010 D14 deletes filter.go out from under them.
  - library
created: "2026-07-26"
updated: "2026-08-03"
authors:
  - emil@jacero.se
# Design impact: new commands and a namespace move. Additive for the CLI's own
# surface; the namespace move rewrites every published coordinate, which is a
# migration rather than a schema break.
semver: minor
# Implementation tracking. status: not-started | in-progress | partial | complete.
# `date` and `notes` allowed only when status reaches `complete`.
implementation:
  status: not-started
# Append-only timeline of milestones.
history:
  - date: "2026-07-26"
    event: Drafted
  - date: "2026-07-26"
    event: "Initial design recorded as D1-D7 with six open questions. The entry defines how an OPM artifact reaches a registry: one publish pipeline serving two artifact types (D1), which DERIVES its coordinates from the artifact and never rewrites the artifact to fit a coordinate (D2); version authoring split from version publishing, so a commit can sit between deciding a version and pushing one (D3); a refusal to publish an artifact whose identity is not concrete, closing the measured gap that `cue mod publish` will happily push a tree with unfilled identity fields (D4); a central registry that HOSTS rather than indexes, with owner-scoped module paths under reserved namespace segments (D5); and a local-override gate that never honours cue.mod/local-module.cue, with an explicit escape hatch for modules and none at all for catalogs, because a catalog's divergence propagates into the key space of everything built against it (D6). The four questions that block promotion are the ones this entry cannot answer from inside itself: publishing credentials, tag immutability, what replaces the modules repo's checksum-driven bump, and how the published fleet moves to the owner-scoped namespace."
  - date: "2026-07-29"
    event: "D8 recorded as the write-side consequence of 0010 D22. `version set` and `publish --version` locate the field they write at identity/identity.cue's Version — the location and name 0010's #IdentityPackage fixes — with no marker attribute to match on and no role= argument. An identity file that does not match #IdentityPackage is refused as a schema failure rather than searched heuristically, which relocates the refusal experiment 01's catalog_unmarked case exercised: it now fires on `this tree is not a conformant catalog` instead of `this field lacks an attribute`, a condition an author can act on. Everything experiment 01 established about the EDIT stands and becomes specified behaviour — the surgical AST rewrite, the conjunction-preserving replaceConcrete() that keeps a #VersionType assertion the naive rewrite silently deletes, the no-write-when-unchanged idempotency, and the whole-file format.Node caveat. Only the locator changed, and the name == \"Version\" path that run reported as a FALLBACK is now the specified lookup. Experiment 01's own load-bearing recommendation (add role=version to D5's marker) is superseded. Experiment 02's fixtures and readIdentity still carry the role-marked form and are one revision behind; alignment is outstanding and does not affect what it measures, since every gate there reads identity VALUES and how a field was located does not change whether the version is concrete, whether cue.mod agrees, or whether an override file is present."
  - date: "2026-07-29"
    event: "Experiment 02-publish-plan-gates aligned with D8 and re-run, closing the alignment the previous event recorded as outstanding. The six identity fixtures lose their @opm() attributes, and readIdentity's attribute walk (Value.Walk + Attributes(cue.FieldAttr) + a role argument read off each one) is replaced by identitySpecs() — a two-entry table of schema-fixed paths, ModulePath/Version for a catalog and metadata.modulePath for a module — plus one LookupPath per field. ALL THIRTEEN PRIOR VERDICTS REPRODUCED UNCHANGED, which is the expected result and the point: the gates read identity VALUES, so how a field was located never entered any of them. A fourteenth case was added because D8 makes a claim nothing exercised — renamed-catalog is a catalog whose values are all correct and whose version field is named CatalogVersion, which is precisely the case the rejected role= marker existed to find. Measured: it passes `cue vet -c` with exit 0 on its own, and the planner refuses it naming the schema-fixed path it failed to find. So the accommodation the marker offered is not needed to CATCH the condition, only to tolerate it, and the diagnosis now names a contract rather than a missing attribute. That variant also exposed an asymmetry in the refusal list — the `open` case carried a guard against the tag rule restating the same problem while the `absent` case did not, so a renamed field produced two refusals for one cause. Fixed rather than recorded, the intent being already present in the open path. The planner shrank by roughly twenty lines."

  - date: "2026-07-29"
    event: "D9 recorded and OQ7 filed, both consequences of enhancement 0010's D24-D28. D9 gives `opm catalog publish` a COMPATIBILITY GATE: for each primitive, pull the last published build shipping that name at that apiVersion and refuse a non-additive change, per 0010 D27. It is not redundant with the consumer-side check, and the measurement says why — 0010's experiments/02 found that the match rung catches a removed field and a narrowed type but NOT a changed default, because two builds disagreeing on a default unify to a non-concrete value, so the match passes and the render fails later on an incomplete value naming a field rather than a build. The one violation the consumer cannot catch is the one that silently moves output. Two bounds are stated rather than assumed: subsumption is transitive so the immediate predecessor secures the whole history by induction, but only while every build passes the gate, and D11 in 0010 records that `cue mod publish` keeps working — whether that gap gets a read-side counterpart is 0010 OQ13. The implementation is deliberately unspecified because `cue.Value.Subsume`'s behaviour across two builds with closedness and defaults in play is UNMEASURED; 0010's experiment already carries the four builds a correct gate must classify, so sequencing that measurement before specifying the command is a graduation gate — a gate that cannot be built as described sends 0010 D27 back to publisher discipline. OQ7 asks who owns a catalog name. The provider-catalog scenario introduces exactly the actor D5's owner-scoping exists for, and D5 gives modules an owner segment while leaving catalogs flat — where the argument applies with MORE force, since a catalog's name is the permanent prefix of every FQN every module matches on and 0010 D24 makes contract keys outlive any single build. A third party publishing a k8up provider catalog today either gets OPM to host `opmodel.dev/catalogs/k8up`, which reads as endorsement and makes OPM the arbiter D5 wanted to avoid, or publishes under their own domain and is unresolvable for anyone who has not edited CUE_REGISTRY, which D5's own rationale rules out."
  - date: "2026-07-30"
    event: "OQ4 narrowed and OQ8 filed, both consequences of the module having no version at all. OQ4's candidate (b) — the authored version is the sole trigger — is CATALOG-ONLY BY CONSTRUCTION, which the question did not say. Enhancement 0010 D2 deletes #Module.metadata.version, so a module has no authored version available to be a trigger, and the asymmetry compounds rather than being a technicality: retiring publish:smart removes the module fleet's ONLY existing answer to should-this-publish-and-at-what-version, and D3's review seam (`version set` -> diff -> commit -> publish) is structurally unavailable to a module because `--version` supplies the tag directly and writes nothing. So a module's version is decided wholly outside the artifact, by (a) release automation or (c) an advisory checksum, while a catalog may use any of the three; a single mechanism covering both should not be assumed to exist. That also settles half of 04-graduation.md's command-surface gate from the other direction — `opm module version set` does NOT exist, because there is nothing for it to write, so what remains open is what replaces it rather than which command performs it. The gate bullet is rewritten to say so. OQ8 asks whether `--version` means one thing. D3 already gives it two jobs and states the split without weighing it: against a catalog it writes an open identity.cue Version or asserts a concrete one and refuses on mismatch; against a module it names the OCI tag, with nothing in source to agree or disagree with, so the catalog form's refusal path has no module analogue and neither does the value it would write. One flag, two semantics, two failure modes, on a command whose premise (D1) is one pipeline serving both artifact types. Candidates: (a) keep one flag and document the split; (b) take the version positionally for both as `cue mod publish v1.2.0` does, demoting the catalog-side WRITE to the thing needing an explicit flag; (c) split the names, `--version` for the catalog write/assert and `--tag` for the module coordinate. It resolves under the existing command-surface gate rather than adding one, and interacts with OQ1 (what the catalog-side write touches) and OQ4. Neither item changes a decision: D2, D3 and D4 stand as written, and nothing in schemas/target.cue moves."
  - date: "2026-07-31"
    event: "Three riders recorded from 0010's OQ walk, OQ9 filed, and a tooling defect fixed that had been hiding open questions. D9 GAINS A LEVEL-AWARE RIDER following 0010 D34: the compatibility gate reads each primitive's apiVersion and runs the pull-and-compare only at beta and GA, because D34 keys D27's promise to the level and an alpha contract may break freely. This is INHERITED rather than an amendment — D9 names D27 rather than restating it, so narrowing D27 narrows the gate automatically — but it is recorded because D9's own wording says 'every primitive in the tree' and an implementer would gate all of them. Two properties are unchanged: the apiVersion bump stays the escape hatch, since the lookup is keyed on name+apiVersion and a bumped contract finds no predecessor and passes trivially; and the MATCH-side rung does not skip alpha, so a removed field still fails loudly. What alpha gives up is exactly the default-drift class 0010/experiments/02 measured, confined under D34's day-one assignment to catalog_opm_experimental. D7 GAINS A COMPATIBILITY MODE following 0010 D35: `opm catalog registry check --compat` compares a published catalog against its predecessor under D9's rule, shipped explicitly as an AID rather than a gate — a distinction that belongs in the command's help text and not only in a design document, since D35 accepts publish-side enforcement as the whole of the guarantee. It reuses D9's comparator, so the marginal cost is plumbing. D5 GAINS A SCOPE LIMIT and OQ9 is filed: D5 partitions three artifact classes (m, catalogs, core) and the registry demonstrably holds more, measured rather than hypothesised — opmodel.dev/modules/opm-platform was a #Platform published into MODULE space at v1.0.0 and v1.0.1 while its own source header declares it an unpublished on-disk fixture, and opmodel.dev/releases/* holds four repositories of Instance-vocabulary artifacts under a segment D5 never reserved. Test fixtures are the useful precedent because they are already solved differently — by a separate DOMAIN, testing.opmodel.dev, mapped in every registry configuration in the workspace — which suggests the answer here may be a domain rather than a segment. OQ9's candidate (c), that platforms and instances are not published artifacts at all and both measured cases are defects, is the cheapest answer if it holds and the opm_platform header already asserts it for platforms. SEPARATELY, A TOOLING DEFECT: `task questions:open` parses the Status line up to the first period, so the form 'Status: open, filed <date>.' yields the literal string 'open, filed <date>' which matches no bucket and is silently OMITTED FROM THE QUEUE. Six Open Questions across four entries were invisible — 0011 OQ8 since 2026-07-30 and this entry's new OQ9, 0010 OQ16 and OQ17, 0012 OQ4 (which 0010 OQ10 was deferred to and whose own graduation gate makes answering mandatory), and 0006 OQ18. All were normalised to 'Status: open. Filed <date>.' except 0006's, that entry being implemented and therefore frozen. This matters beyond tidiness: an OQ the queue does not report is an OQ the promotion gate cannot see, and 0010 was briefly described as carrying no open questions on the strength of an empty queue."
  - date: "2026-08-01"
    event: "D9 GAINS ITS IMPLEMENTATION, measured rather than assumed, and the graduation gate D9 named from the day it was written is satisfied. experiments/03-d27-compat-gate was authored under enhancement 0010 while its D36/D37 were being settled, and MOVED HERE because the question it answers is D9's: nothing in 0010 cited it, D27 delegates publish-side enforcement to this decision explicitly, and 0011 asked for the measurement by name in both 03-decisions.md and 02-design.md. The finding is a negative and a positive. NEGATIVE: a single cue.Value.Subsume call CANNOT express D27 in either direction — next.Subsume(prev) agrees on 10/14 cases, prev.Subsume(next) on 8/14, and they fail on DISJOINT sets. The cause is structural: adding a field to a struct makes a value MORE specific while adding an option to a disjunction makes it LESS specific, and D27 calls both additive, so the rule spans both directions of the lattice while a subsume call tests one. The forward call is right about disjunctions and wrong about struct fields; the reverse is exactly inverted; there is no third direction. A CHANGED DEFAULT is missed by BOTH, because a default does not change what a value accepts, only which value it settles on when unconstrained — independently confirming 0010/experiments/02's finding from the producer side rather than the consumer side. POSITIVE: a three-rule field-wise walk scores 14/14 — recurse structs applying the removed-field and must-be-optional-or-defaulted rules, forward-subsume at leaves where that direction is correct, and compare defaults explicitly at every level — with path-located violations that supply most of what the refusal-message gate asks for, and level-awareness per 0010 D34 verified (the same field removal accepted at v1alpha1, refused at v1beta1/v1/v2). WHAT THIS SETTLES: D9 stated the stakes itself — a gate that could not be built as described would send 0010 D27 back to publisher discipline. It CAN be built, so 0010 D27 STANDS UNCHANGED and D9 gains an implementation shape rather than losing its premise. Nothing in D9 is reversed; the rider fills a blank D9 deliberately left. Two implementation consequences recorded: the comparator is pure cue.Value logic and belongs in LIBRARY so publish, `opm catalog registry check --compat` (D7) and any CI action share one implementation (the argument 0010 D32 uses for the kernel); and predecessor selection already exists — materialize/enumerate.go's enumerateVersions plus filter.go:112's highestStable, which skips -dev.* and prereleases and falls back to highest overall. 0010 D14 DELETES filter.go and highestStable with it, so that should be a MOVE rather than a delete-and-rewrite. The experiment's comparator is a demonstration of shape and feasibility, not code to copy. Also satisfied: the `enhancement 0010 is accepted` gate, 0010 having flipped the same day with an empty Open Question queue."
  - date: "2026-08-01"
    event: "04-graduation.md and 06-operational.md corrected, and `library` ADDED TO affects. No decision changes and no Open Question moves — the entry is still draft with all nine open. THE AFFECTS CORRECTION IS THE ONE WITH TEETH: the 2026-08-01 experiments/03 event concluded that D9's comparator is pure cue.Value logic and belongs in LIBRARY so that publish, `opm catalog registry check --compat` (D7) and any CI action share one implementation — 0010 D32's argument for putting a check in the kernel rather than in a CLI lint — and that predecessor selection MOVES there rather than being rewritten, since enumerate.go plus filter.go:112's highestStable already do it and 0010 D14 deletes filter.go out from under them. `affects` still listed only cli, catalog and modules, so the entry named a repo-set that could not ship its own largest decision, and `task vet` cannot catch it because it only checks that `area` is a member. THE accepted->implemented LIST HAD THE SAME HOLE FROM THE OTHER SIDE: D9's gate — the biggest single piece of work in the entry — appeared ONLY in the draft->accepted section as the measurement that had to precede specifying it, so an implementer reading the shipping criteria would not have found it. Four bullets added: the gate ships as the FIELD-WISE WALK and not as `Subsume` (experiments/03 measured 10/14 forward, 8/14 reverse, failing on disjoint sets, against 14/14 for the walk, so a gate built on Subsume has reintroduced a measured defect no matter what it scores on the happy path), with a changed default refused explicitly because that is the one violation the consumer side provably cannot catch; the gate is LEVEL-AWARE per 0010 D34 with the ALPHA case tested, since a gate that checks everything passes every beta test while silently contradicting D34; and the comparator lives in library. D7's --compat mode gained the requirement that its HELP TEXT calls it an aid rather than a gate, which is where a catalog author meets the enforcement boundary 0010 D35 accepts — 0010's own graduation already required this and 0011, which owns the command, did not. THE NON-MODULE NAMESPACE BULLET was widened from two kinds to the four actually measured, adding opmodel.dev/modules/opm-platform and the four opmodel.dev/releases/* repositories, with OQ9 named as what decides their disposition; and the roughly seventy -e2e.g<sha> tags on opmodel.dev/modules/test/podinfo (0006 OQ18's dev-tag pollution in a namespace that entry never examined) are now a deliberate carry-or-drop rather than a side effect of the move. THE JOINT-WINDOW CONSTRAINT was restated at the level it binds. This entry called it a HARD SEQUENCING CONSTRAINT while 0010's 04-graduation called the same relationship a PREFERENCE, NOT A GATE, and read side by side they contradict; separated, they do not. Entry against entry, neither blocks the other and 0010's steps 1-5 have no dependency on this entry at all; step 3 here against 0010's step 6 DO share a window, because both rewrite every module's coordinate and therefore every deployed instance's owner label, so running them apart does the whole fleet twice. Both entries now say so and cross-reference each other. The Zot central-registry move is recorded here as a third input to that window rather than living only in 0010. The graduation bullet is marked WRITTEN DOWN but explicitly STILL OPEN ON OWNED — it has no owner and no date. Rollback's `the same adoption path the forward migration needs` now names 0010 D18's finding: relabel in place, never delete and recreate, because the operator sets no ownerReferences so a teardown garbage-collects nothing and every later prune silently skips the survivors. Cross-References' `releases/` row named a path that does not exist under the workspace root — it is the sibling opm-releases/ — so the draft->accepted path-existence gate was failing on it; corrected and the gate marked verified. The workspace-root directory map's ./releases/ row is stale in the same way and is NOT fixed here."
  - date: "2026-08-03"
    event: "OQ walk, session 1: D10, D11 and D12 recorded; OQ1, OQ2, OQ3 and OQ8 RESOLVED. Both questions 04-graduation declared BLOCKING are now closed, and five remain — OQ4, OQ5, OQ6, OQ7, OQ9. Walked in dependency order rather than numeric order, because OQ3 gates OQ4's candidate (b) and OQ7/OQ9 both decide what OQ6's migration rewrites. D10 (OQ3) makes published artifacts IMMUTABLE by registry enforcement, researched rather than assumed: Zot has NO immutability flag and the documented mechanism is withholding the `update` authorization action, with create/update distinguished PER TAG rather than per repository (pkg/api/authz.go upgrades CreatePermission to UpdatePermission only when the reference already appears in the repo's tag list) — which is what makes it usable for a catalog shipping many releases, since a read+create policy that gated per REPOSITORY would allow exactly one tag. The author's initial namespace asymmetry (catalogs strict, modules relaxed) was dropped once the registry turned out to be MULTI-TENANT with arbitrary tenant paths: there is no path predicate to scope on, so `**/catalogs/**` would be a guess about another tenant's layout. Two independent objections are recorded anyway — nothing in the normal flow needs `update`, since every -dev and -e2e.g<sha> tag is a NEW tag and therefore a create; and a ModuleInstance pins spec.module.{path,version}, so a mutable module tag moves rendered bytes under an instance whose source did not change, making the exposure differ in DEGREE, which is the test D6 itself set when it justified its own module/catalog split as differing in KIND. Maven-style no-deletion was rejected on a counter-example from this workspace: the opm_experimental canonicalisation on 2026-07-31 REQUIRED deleting a repository in two registries, and localhost:5000's registry:2 refused with 405 because deletes were disabled, forcing an on-disk removal. Delete is therefore withheld from the default policy and retained by an administrator, which is inherent in operating the storage rather than a permission this design grants. GHCR CANNOT DO ANY OF THIS — community discussion #181783 is open and unanswered since 2025-12-12 — and that is accepted deliberately: the requirement takes effect when a conforming registry exists, with no urgency to get there. D10 was REFRAMED the same day on the author's scope note that these entries define how OPM WORKS WITH a future central registry rather than specifying one: it now binds a CLASS rather than a host, because the Zot configuration ships as an open module so there is a reference configuration and N deployments, and the Zot policy is labelled demonstrated feasibility rather than deployment specification. D11 (OQ2) gives the CLI `opm login [registry]`, resolving its target through the EXISTING ResolveRegistry precedence (flag > OPM_REGISTRY > config.registry in ~/.opm/config.cue) so pointing OPM at another deployment needs no new surface — which is what makes the open module usable rather than nominal. Credentials land in a store CUE ALREADY READS, and that is mechanical rather than preferential: CUE performs the push, so a credential written anywhere else is invisible at the moment it is needed. Measured from cue v0.17.1 — `cue login --help` directs users to `docker login`/`podman login` for any non-Central registry and reads what they write — so an OPM-private store is EXCLUDED rather than deferred, while a docker-credential-opm helper stays available as the upgrade path since helpers keep one store rather than adding a second. The authentication MECHANISM (htpasswd, LDAP, OIDC social login, API keys, mTLS, OIDC workload identity for CI) is left to the rollout by agreement. Recorded because it bears on the migration: opm-operator/cmd/main.go's resolveRegistry documents a flag > env > default precedence but gives the flag a NON-EMPTY compiled-in default, so OPM_REGISTRY is inert on the operator; the CLI's flag defaults to empty and its precedence works, and it already reports shadowed values — so a Zot cutover repoints the CLI by config and needs a code change for the operator. D12 (OQ1 + OQ8) is the largest and reverses this entry's direction on the module side. Modules gain a catalog-style identity SUBPACKAGE exporting both ModulePath and Version, `opm module version set` exists, and `--version` means ONE thing on both commands — fill an open field, ASSERT a concrete one, refuse on mismatch — writing the WORKING TREE rather than a copy, since a copy is the only candidate that guarantees the published bytes exist in no commit and D10 makes each instance permanent. The trigger was the author asking why modules had no `version set`; the answer was that 0010 D2 deleted the field, and walking that back surfaced an unfilled declaration in 0010 (transformer.cue:105) which is now 0010 D38. Publish additionally verifies metadata.version == id.Version because core CANNOT enforce the wiring — #Module has no way to reference an arbitrary module's identity package — so the template establishes the derivation, CUE enforces it for free while it is written (`conflicting values` at vet), and the publish check exists solely for the author who REPLACES id.Version with a literal and leaves nothing to conflict with. schemas/target.cue gained #IdentityState's assert half and a new #IdentityDerivation, both MUST-FAIL cases confirmed 2026-08-03 against cue v0.17.1 (_asserted and agrees each yielding `conflicting values false and true`). D12 is CONTINGENT on 0010 D38 landing; the two were written together and neither describes a workable shape alone."
