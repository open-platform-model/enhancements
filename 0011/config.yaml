t the bottom of its module's graph; the naive shape of importing and embedding the schema is excluded rather than overlooked. THIS WAS ALREADY BEING LEANED ON: 0010 D43 deleted a duplicate VersionMajor assertion reasoning that '0011 D8 already requires publish to refuse an identity file that does not match #IdentityPackage', which holds only if the validation is real — and as of today D8 states the requirement while nothing implements it. D21 is what makes that trade safe rather than a check exchanged for a promise. SEPARATELY, D6's OVERRIDE FLAG IS NAMED `--skip-override-check`, against a measured misreading: a drafted message used `--allow-local-overrides` and the author read it, correctly from the words, as permission for the overrides to take effect. They never do — D6 ignores replaceWith unconditionally and CUE strips the file when building the artifact, so nothing local is published or resolved, and what the flag waives is the GATE rather than the ignoring. The graduation gate gains a fifth local-override assertion because of it: published dependencies resolve in all four states INCLUDING the flag case."
