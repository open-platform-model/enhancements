    event: "cli-login IMPLEMENTED and moved to done — `opm registry login [host]` exists (D24's name over D11's unchanged contract) and writes the one store CUE's push and pull both read. THE MECHANISM FORK D11 LEFT OPEN IS CLOSED ON EVIDENCE, docker config as its named default: GHCR answers the device-authorization endpoint with 405 (documented in CUE's own login.go, which redirects users to `docker login`), GitHub tokens fail `cue login --token`'s format regex, `cue login` hard-refuses multi-host mappings — OPM's shipped default registry value is multi-host — and logins.json is a Bearer-only path in the resolver's transport, so basic/htpasswd registries are served by the docker path alone. Recorded non-choices, each revisitable behind the unchanged command contract: the OAuth device-flow wrap (blocked on Zot endpoint verification, D11's own framing), logins.json writing (no current registry needs a Bearer store), credential flags (--token/--password-stdin — CI has `docker login`, which writes the same file), and logout. THE WRITER (`internal/dockercfg.Upsert`) edits exactly one auths entry through a raw-message envelope so credsStore, credHelpers, foreign hosts and keys it has never heard of survive the rewrite — tab-indented, 0600 on create (an existing file keeps its own mode), same-directory atomic rename, malformed JSON refused with the file untouched. No-arg resolution builds the public resolver over the resolved mapping and takes AllHosts(): one host proceeds, several refuse listing each as a runnable `opm registry login <host>` (asserted against the shipped DefaultRegistry value), zero refuses pointing at `opm config init`; the resolution line is ResolveRegistry.Shadowed's FIRST CONSUMER, closing D11's overrides-are-reportable claim. VERIFY-THEN-WRITE probes GET /v2/ through CUE's own ociauth transport rather than a naive basic GET — measured necessity: GHCR answers /v2/ with a bearer challenge regardless of credential validity, so a naive probe would refuse every valid GHCR credential; through the transport, basic and bearer-challenge registries both verify for real. 401/403 refuse with the file untouched (exit 2), transport failure exits 3, non-TTY stdin refuses pointing at `docker login <host>`, and a set $DOCKER_AUTH_CONFIG earns a shadowing notice. golang.org/x/term becomes a direct dependency for the no-echo secret read. THE HERMETIC INVERSION of the pipeline's authenticated-push test passes: login itself writes the file against the in-process registry's basic auth, then the pipeline's push succeeds using only what it wrote. CLI task fmt/vet/lint/test all green."
