    slice: "cli/fixture-testing-domain"
    event: "registry-cleanup moved to in-progress: D17 item 3 is done for the CLI's own fixture, and the mechanism it proves is the argument for the rest. cli/tests/fixtures/modules/podinfo moves from `opmodel.dev/modules/test/podinfo@v0` to `testing.opmodel.dev/modules/cli/podinfo@v0`, gains an identity subpackage with D12 derivation wiring, and is published to GHCR by a new publish-fixtures workflow through `opm module publish` — the same pipeline and gate table the templates go through under D25, with the same D15 caller-side tag-existence filter, plus a PR-side dry-run job. THE MEASURED PAYOFF IS WHY THE RELOCATION MATTERS BEYOND TIDINESS, and it is larger than D17 item 3's framing suggests: because CUE routes by longest prefix on the module path, ONE fixture squatting the production namespace forced the WHOLE `opmodel.dev` prefix onto a laptop registry everywhere it was consumed — cli/Taskfile.yml's KIND_CUE_REGISTRY, hack/opm-config.cue, and an `opmodel.dev/modules/test=localhost:5000+insecure` prefix entry in examples/Taskfile.yml — which in turn required core and catalogs/opm to be MIRRORED into that registry as collateral (both were present in the local registry at the time of this landing). Relocating the fixture deletes all three overrides; `task cluster:operator` drops its registry-container precondition, its docker-network join and its --registry patch entirely, because the pinned operator (v1.0.0-alpha.11) ships no --registry arg and its compiled-in default already routes both domains to GHCR. The local-registry path survives as an explicit KIND_CUE_REGISTRY opt-in. ONE DIVERGENCE FROM THE RECORDED WORDING, deliberate and user-chosen: D17 item 3 says `moved to testing.opmodel.dev` without prescribing a sub-path, and library/testdata's precedent is the flat `testing.opmodel.dev/modules/web_app@v1`; this fixture takes an owning-repo segment, `testing.opmodel.dev/modules/cli/<name>`, so the operator's fleet can land beside it under its own segment without